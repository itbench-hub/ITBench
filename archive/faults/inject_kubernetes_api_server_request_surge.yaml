---
- name: Create ServiceAccount
  kubernetes.core.k8s:
    kubeconfig: "{{ faults_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: workload-scanner
        namespace: "{{ faults_kubernetes_object.metadata.name }}"
    state: present
  register: faults_service_account

- name: Create ClusterRole
  kubernetes.core.k8s:
    kubeconfig: "{{ faults_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        labels:
          "app.kubernetes.io/component": workload
          "app.kubernetes.io/managed-by": ITBench
        name: workload-scanner
      rules:
        - apiGroups:
            - ""
          resources:
            - pods
            - services
            - nodes
            - namespaces
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - apps
          resources:
            - deployments
            - replicasets
            - statefulsets
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - batch
          resources:
            - jobs
            - cronjobs
          verbs:
            - get
            - list
            - watch
    state: present
  register: faults_role

- name: Create ClusterRoleBinding
  kubernetes.core.k8s:
    kubeconfig: "{{ faults_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        labels:
          "app.kubernetes.io/component": workload
          "app.kubernetes.io/managed-by": ITBench
        name: workload-scanner
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: "{{ faults_role.result.kind }}"
        name: "{{ faults_role.result.metadata.name }}"
      subjects:
        - kind: "{{ faults_service_account.result.kind }}"
          name: "{{ faults_service_account.result.metadata.name }}"
          namespace: "{{ faults_kubernetes_object.metadata.name }}"
    state: present

- name: Create ConfigMap
  kubernetes.core.k8s:
    kubeconfig: "{{ faults_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: generator-script
        namespace: "{{ faults_kubernetes_object.metadata.name }}"
      data:
        deps: |-
          kubernetes==36.0.3
        script: |-
          import logging
          import os
          import sys
          import time

          from kubernetes import client, config

          # Logging
          logging.basicConfig(stream=sys.stdout, level=logging.DEBUG)

          logger = logging.getLogger(__name__)

          def main():
              try:
                  rps = int(os.environ.get("RPS"))
                  duration = int(os.environ.get("DURATION"))
              except ValueError:
                  sys.exit("error: RPS and DURATION environment variable are not set or not ints")

              if rps <= 0 or duration <= 0:
                  sys.exit("error: RPS and DURATION environment variable must be positive")

              try:
                  config.load_incluster_config()
              except Exception as e:
                  logger.exception("configuration loading failed: {0}".format(sys.exception()))
                  sys.exit(1)

              print("=== API Request Surge Load Generator ===")
              print("Target: Kubernetes API Server")
              print("Requests per second: {0}".format(rps))
              print("Duration: {0} seconds".format(duration))
              print("==========================================")

              v1 = client.CoreV1Api()

              count = 0
              sleep_interval = 1.0 / rps
              start_time = time.time()
              total_requests = rps * duration

              while count < total_requests:
                  elapsed = int(time.time() - start_time)

                  if elapsed >= duration:
                      break

                  try:
                      v1.list_pod_for_all_namespaces(watch=False)
                  except Exception:
                      logger.exception("request failed: {0}".format(sys.exception()))

                  count += 1

                  if count % (rps * 10) == 0:
                      print("[{0}s] Sent {1} requests. {2}s remaining...".format(elapsed, count, duration - elapsed))

                  time.sleep(sleep_interval)

              actual_duration = int(time.time() - start_time)

              print("Load generation complete!")
              print("Total requests sent: {0}".format(count))
              print("Actual duration: {0}s".format(actual_duration))

          if __name__ == "__main__":
              main()
    state: present
  register: faults_config_map

- name: Create Deployment
  kubernetes.core.k8s:
    kubeconfig: "{{ faults_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workload-scanner
        namespace: "{{ faults_kubernetes_object.metadata.name }}"
      spec:
        replicas: 5
        selector:
          matchLabels:
            "app.kubernetes.io/name": workload-scanner
        template:
          metadata:
            labels:
              "app.kubernetes.io/name": workload-scanner
          spec:
            containers:
              - name: load-generator
                image: registry.access.redhat.com/ubi10/python-314-minimal:10.2-1791464217@sha256:8e385670e8a2ef3ca18f5bc3ef005a424601b58f2964d5a144861be544537624
                env:
                  - name: RPS
                    value: |-
                      {{
                        fault_args.loadGenerator.options.requestsPerSecond |
                        ansible.builtin.string
                      }}
                  - name: DURATION
                    value: "{{ (60 * 60) | ansible.builtin.string }}"
                command:
                  - /bin/sh
                args:
                  - -c
                  - "python3.14 -m pip install -r ~/deps/requirements.txt && python3.14 ~/scripts/generate_load.py"
                volumeMounts:
                  - name: dependencies
                    mountPath: /opt/app-root/src/deps
                    readOnly: true
                  - name: scripts
                    mountPath: /opt/app-root/src/scripts
                    readOnly: true
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi
            serviceAccountName: "{{ faults_service_account.result.metadata.name }}"
            volumes:
              - name: scripts
                configMap:
                  name: "{{ faults_config_map.result.metadata.name }}"
                  items:
                    - key: script
                      path: generate_load.py
              - name: dependencies
                configMap:
                  name: "{{ faults_config_map.result.metadata.name }}"
                  items:
                    - key: deps
                      path: requirements.txt
    state: present
    wait: true
