---
- name: Create OpenShift related objects
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Create SecurityContextConstraint
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: security.openshift.io/v1
          kind: SecurityContextConstraints
          metadata:
            labels:
              "app.kubernetes.io/component": chaos-mesh
              "app.kubernetes.io/managed-by": ITBench
            name: it-bench-chaos-daemon-restricted
          readOnlyRootFilesystem: false
          allowHostDirVolumePlugin: true
          allowHostIPC: false
          allowHostNetwork: false
          allowHostPID: true
          allowHostPorts: false
          allowPrivilegeEscalation: false
          allowPrivilegedContainer: true
          allowedCapabilities:
            - IPC_LOCK
            - KILL
            - MKNOD
            - NET_ADMIN
            - NET_RAW
            - SYS_ADMIN
            - SYS_CHROOT
            - SYS_PTRACE
          defaultAddCapabilities:
          fsGroup:
            type: MustRunAs
          runAsUser:
            type: MustRunAsRange
          seLinuxContext:
            type: MustRunAs
          seccompProfiles:
            - runtime/default
          supplementalGroups:
            type: RunAsAny
          volumes:
            - configMap
            - csi
            - downwardAPI
            - emptyDir
            - ephemeral
            - hostPath
            - persistentVolumeClaim
            - projected
            - secret
          users:
            - system:serviceaccount:{{ tools_releases.chaos_mesh.namespace }}:chaos-daemon
        state: present

- name: Create Chaos Mesh Namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        labels:
          "prometheus.itbench.io/monitor": "true"
        name: "{{ tools_releases.chaos_mesh.namespace }}"
    state: present

- name: Install Chaos Mesh
  kubernetes.core.helm:
    chart_ref: chaos-mesh
    chart_repo_url: "https://charts.chaos-mesh.org"
    chart_version: "2.8.4"
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    release_name: "{{ tools_releases.chaos_mesh.name }}"
    release_namespace: "{{ tools_releases.chaos_mesh.namespace }}"
    release_state: present
    values:
      controllerManager:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-role.itbench.io/sandbox
                  operator: DoesNotExist
      chaosDaemon:
          podAnnotations: "{{ {'openshift.io/required-scc': 'it-bench-chaos-daemon-restricted'} if tools_cluster.platform == 'openshift' else ansible.builtin.omit }}"
          runtime: "{{ 'crio' if tools_cluster.platform == 'openshift' else 'containerd' }}"
          socketPath: "{{ '/var/run/crio/crio.sock' if tools_cluster.platform == 'openshift' else '/run/containerd/containerd.sock' }}"
      dashboard:
        create: false
      dnsServer:
        create: false
    wait: true
