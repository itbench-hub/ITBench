# yaml-language-server: $schema=../../../../schemas/json/library/definitions/scenario.json
---
applications:
  opentelemetryDemo:
    enabled: true
faults:
- injections:
  - args:
      kubernetesObject:
        apiVersion: chaos-mesh.org/v1alpha1
        kind: Schedule
        metadata:
          name: api-server-memory-stress
          namespace: chaos-mesh
      scheduleSpec:
        stressChaos:
          duration: 55s
          mode: one
          selector:
            labelSelectors:
              component: kube-apiserver
            namespaces:
            - kube-system
          stressors:
            memory:
              size: 6GB
              workers: 4
        type: StressChaos
    id: scheduled-chaos-mesh-experiment
tools:
  sre:
    enabled: true
