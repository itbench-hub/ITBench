# yaml-language-server: $schema=../../../../schemas/json/library/definitions/scenario.json
---
applications:
  opentelemetryDemo:
    enabled: true
faults:
- injections:
  - args:
      kubernetesObject:
        apiVersion: chaos-mesh.org/v1alpha1
        kind: Schedule
        metadata:
          name: ad-memory-stress
          namespace: chaos-mesh
      scheduleSpec:
        stressChaos:
          duration: 55s
          mode: all
          selector:
            labelSelectors:
              app.kubernetes.io/component: ad
            namespaces:
            - otel-demo
          stressors:
            memory:
              size: 100%
              workers: 4
        type: StressChaos
    id: scheduled-chaos-mesh-experiment
tools:
  sre:
    enabled: true
