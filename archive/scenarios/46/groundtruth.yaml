# yaml-language-server: $schema=../../../../schemas/json/library/definitions/groundtruth.json
---
alerts:
- labels: {}
  name: KubePodCrashLooping
entities:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: astronomy-db
    namespace: otel-demo
solutions:
- - steps:
    - command: kubectl -n otel-demo rollout undo deployment/astronomy-db
      text: Revert the last change done to the manifest.
  - steps:
    - command: kubectl -n otel-demo edit deployment astronomy-db
      text: Manually edit the manifest and replace the invalid container's resource configuration with the correct value(s).
