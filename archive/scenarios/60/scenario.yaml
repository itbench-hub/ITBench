# yaml-language-server: $schema=../../../../schemas/json/library/definitions/scenario.json
---
applications:
  opentelemetryDemo:
    enabled: true
faults:
- injections:
  - args:
      configMapName: features
      kubernetesObject:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: recommendation
          namespace: otel-demo
    id: crashing-kubernetes-workload-init-container
- injections:
  - args:
      container:
        name: checkout
      kubernetesObject:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: checkout
          namespace: otel-demo
    id: unsupported-architecture-kubernetes-workload-container-image
  waitFor:
    postInjection:
    - args:
        kubernetesObject:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: checkout
            namespace: otel-demo
      id: delete-workload-pods
tools:
  sre:
    enabled: true
