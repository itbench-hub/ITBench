# yaml-language-server: $schema=../../../../schemas/json/library/definitions/scenario.json
---
applications:
  opentelemetryDemo:
    enabled: true
faults:
- injections:
  - args:
      kubernetesObject:
        apiVersion: chaos-mesh.org/v1alpha1
        kind: Schedule
        metadata:
          name: otel-demo-product-catalog-network-delay
          namespace: chaos-mesh
      scheduleSpec:
        podChaos:
          action: pod-failure
          mode: all
          selector:
            labelSelectors:
              app.kubernetes.io/component: checkout
            namespaces:
            - otel-demo
        type: PodChaos
    id: scheduled-chaos-mesh-experiment
tools:
  sre:
    enabled: true
