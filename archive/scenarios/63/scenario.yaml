# yaml-language-server: $schema=../../../../schemas/json/library/definitions/scenario.json
---
applications:
  opentelemetryDemo:
    enabled: true
faults:
- injections:
  - args:
      kubernetesObject:
        apiVersion: v1
        kind: Secret
        metadata:
          name: email-service-secret
          namespace: otel-demo
    id: corrupted-kubernetes-secret-credentials
  waitFor:
    postInjection:
    - args:
        kubernetesObject:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: email
            namespace: otel-demo
      id: delete-workload-pods
tools:
  sre:
    enabled: true
