---
_fqdn_itbench_clickhouse_database_observability: >-
  {{
    "clickhouse-%s.%s.svc.cluster.local" |
    ansible.builtin.format(
      itbench_clickhouse_databases.observability.name,
      itbench_clickhouse_databases.observability.namespace
    )
  }}
_fqdn_itbench_opentelemetry_collectors_jaeger: >-
  {{
    "%s-collector.%s.svc.cluster.local" |
    ansible.builtin.format(
      itbench_opentelemetry_collectors.jaeger.name,
      itbench_opentelemetry_collectors.jaeger.namespace
    )
  }}
_fqdn_itbench_opentelemetry_gateway_applications: >-
