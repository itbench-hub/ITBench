---
openshift_cert_manager_namespace: cert-manager-operator
openshift_cert_manager_operator_group:
  name: openshift-cert-manager-operator
  namespace: "{{ openshift_cert_manager_namespace }}"
openshift_cert_manager_subscription:
  channel: stable
  name: openshift-cert-manager-operator
  namespace: "{{ openshift_cert_manager_namespace }}"

openshift_ingress_namespace: openshift-ingress

openshift_kubernetes_gateway_class:
  controller_name: openshift.io/gateway-controller/v1
  name: openshift-default

openshift_monitoring_config_map: cluster-monitoring-config
openshift_monitoring_namespace: openshift-monitoring
openshift_monitoring_prometheus:
  name: prometheus-k8s
  port: 9000
openshift_monitoring_thanos_querier:
  name: thanos-querier
  port: 9091

openshift_opentelemetry_operator_namespace: openshift-opentelemetry-operator
openshift_opentelemetry_operator_operator_group:
  name: openshift-opentelemetry-operator
  namespace: "{{ openshift_opentelemetry_operator_namespace }}"
openshift_opentelemetry_operator_subscription:
  channel: stable
  name: opentelemetry-product
  namespace: "{{ openshift_opentelemetry_operator_namespace }}"

openshift_operator_subscription_install_plan_approval: Automatic
openshift_operator_subscription_source: redhat-operators
openshift_operator_subscription_source_namespace: openshift-marketplace

openshift_operators_namespace: openshift-operators

openshift_service_mesh3_istio:
  name: default
  namespace: istio-system
openshift_service_mesh3_istio_cni:
  name: default
  namespace: istio-cni
openshift_service_mesh3_istio_ztunnel:
  name: default
  namespace: ztunnel
openshift_service_mesh3_subscription:
  channel: stable
  name: servicemeshoperator3
  namespace: "{{ openshift_operators_namespace }}"

openshift_user_workload_monitoring_config_map: user-workload-monitoring-config
openshift_user_workload_monitoring_namespace: openshift-user-workload-monitoring
