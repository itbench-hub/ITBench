---
_istio_system_namespace: istio-system
_kube_system_namespace: kube-system

helm_release_altinity_clickhouse_operator:
  name: clickhouse-operator
  namespace: "{{ itbench_namespaces.operators }}"
helm_release_argo_workflows:
  name: argo-workflows
  namespace: argo-workflows
helm_release_cert_manager:
  name: cert-manager
  namespace: cert-manager
helm_release_istio_base:
  name: istio-base
  namespace: "{{ _istio_system_namespace }}"
helm_release_istio_cni:
  name: istio-cni
  namespace: "{{ _kube_system_namespace }}"
helm_release_istio_istiod:
  name: istiod
  namespace: "{{ _istio_system_namespace }}"
helm_release_istio_ztunnel:
  name: ztunnel
  namespace: "{{ _kube_system_namespace }}"
helm_release_kube_prometheus_stack: # NOTE: This deploys Prometheus and Prometheus Operator in same namespace
  name: kube-prometheus-stack
  namespace: "{{ itbench_namespaces.observability }}"
helm_release_kubernetes_metrics_server:
  name: metrics-server
  namespace: "{{ _kube_system_namespace }}"
helm_release_kyverno:
  name: kyverno
  namespace: kyverno
helm_release_microservices_demo:
  name: online-boutique
  namespace: "" # Overriden by application role default value or scenario extra variables
helm_release_nginx_gateway_fabric:
  name: nginx-gateway-fabric
  namespace: nginx-gateway
helm_release_opencost:
  name: opencost
  namespace: opencost
helm_release_opentelemetry_demo:
  name: astronomy-shop
  namespace: "" # Overriden by application role default value or scenario extra variables
helm_release_opentelemetry_operator:
  name: opentelemetry-operator
  namespace: "{{ itbench_namespaces.operators }}"
helm_release_prometheus_mcp:
  name: prometheus-mcp
  namespace: "{{ itbench_namespaces.mcp_servers }}"
helm_release_prometheus_operator_crds:
  name: prometheus-operator-crds
  namespace: "{{ itbench_namespaces.operators }}"
