---
- name: Manage KOps (Kubernetes Operations) Clusters
  hosts:
    - localhost
  pre_tasks:
    - name: Validate target variable
      ansible.builtin.assert:
        that:
          - target in ["argo-stack", "single-cluster"]
        fail_msg: Invalid target provided. Please provide valid target.
        success_msg: Valid target provided.
      tags:
        - always

    - name: Validate environments cluster count
      ansible.builtin.assert:
        that:
          - environments_count | int > 0
        fail_msg: Invalid number of kOps clusters set. Must be greater than 0.
        success_msg: Valid number of kOps clusters configured.
      tags:
        - always
      when:
        - target == "argo-stack"

    - name: Import executables role
      ansible.builtin.import_role:
        name: executables
      tags:
        - always
  tasks:
    - name: Generate cluster names
      tags:
        - always
      block:
        - name: Generate environment cluster name
          ansible.builtin.set_fact:
            environment_clusters:
              - "{{ name_prefix + '-environment-aws.k8s.local' }}"
          when:
            - target == "single-cluster"

        - name: Generate environment cluster names
          ansible.builtin.set_fact:
            environment_clusters: |-
              {{
                (
                  environment_clusters | ansible.builtin.default([])
                ) +
                [
                  [
                    name_prefix,
                    "environment",
                    environment_index,
                    "aws.k8s.local"
                  ] |
                  ansible.builtin.join("-")
                ]
              }}
          loop: "{{ range(1, environments_count | int + 1) | ansible.builtin.list }}"
          loop_control:
            label: environment/{{ environment_index }}
            loop_var: environment_index
          when:
            - target == "argo-stack"

    - name: Create role variables
      tags:
        - always
      block:
        - name: Create kOps cluster group variable
          ansible.builtin.set_fact:
            kops_cluster_group:
              clusters: "{{ environment_clusters }}"
              name: "{{ name_prefix }}"
          when:
            - target == "single-cluster"

        - name: Create kOps cluster group variable
          ansible.builtin.set_fact:
            kops_cluster_group:
              clusters: |-
                {{
                  (
                    [
                      name_prefix + "-orchestrator-aws.k8s.local"
                    ]
                  ) +
                  environment_clusters
                }}
              name: "{{ name_prefix }}"
          when:
            - target == "argo-stack"

        - name: Create kOps configuration variable
          ansible.builtin.set_fact:
            kops_configuration:
              aws: "{{ aws }}"

    - name: Add required configurations for cluster(s) creation
      tags:
        - create_clusters
      block:
        - name: Add kOps cluster information to configuration
          ansible.builtin.set_fact:
            kops_configuration: "{{ kops_configuration | ansible.builtin.combine({'cluster': cluster}) }}"

        - name: Add ssh information to configuration
          ansible.builtin.set_fact:
            kops_configuration: "{{ kops_configuration | ansible.builtin.combine({'ssh_keys': ssh_keys}) }}"

        - name: Add docker information to configuration
          ansible.builtin.set_fact:
            kops_configuration: "{{ kops_configuration | ansible.builtin.combine({'docker': docker}) }}"
          when:
            - docker is ansible.builtin.defined

    - name: Import kOps role
      ansible.builtin.import_role:
        name: kops
