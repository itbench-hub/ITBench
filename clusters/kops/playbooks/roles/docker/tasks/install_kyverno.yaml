---
- name: Install Kyverno
  kubernetes.core.helm:
    chart_ref: "oci://ghcr.io/kyverno/charts/kyverno"
    chart_version: "3.8.2"
    create_namespace: true
    kubeconfig: "{{ docker_cluster.kubeconfig }}"
    release_name: "{{ docker_releases.kyverno.name }}"
    release_namespace: "{{ docker_releases.kyverno.namespace }}"
    timeout: 10m0s
    values:
      admissionController:
        rbac:
          clusterRole:
            extraResources:
              - apiGroups:
                  - ""
                resources:
                  - secrets
                verbs:
                  - get
                  - list
                  - watch
                  - create
                  - update
                  - delete
      backgroundController:
        rbac:
          clusterRole:
            extraResources:
              - apiGroups:
                  - ""
                resources:
                  - secrets
                verbs:
                  - get
                  - list
                  - watch
                  - create
                  - update
                  - delete
      config:
        webhooks: # Override the default webhook configuration
          namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                  - kube-public
                  - kyverno
        resourceFilters: # Explicitly set resourceFilters without kube-system
          - "[*/*,kyverno,*]"
          - "[Event,*,*]"
          - "[*/*,kube-public,*]"
          - "[*/*,kube-node-lease,*]"
          - "[Node,*,*]"
          - "[Node/?*,*,*]"
          - "[APIService,*,*]"
          - "[APIService/?*,*,*]"
          - "[TokenReview,*,*]"
          - "[SubjectAccessReview,*,*]"
          - "[SelfSubjectAccessReview,*,*]"
          - "[Binding,*,*]"
          - "[Pod/binding,*,*]"
          - "[ReplicaSet,*,*]"
          - "[ReplicaSet/?*,*,*]"
      excludeKyvernoNamespace: true
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-public
    wait: true

- name: Create ClusterPolicies
  kubernetes.core.k8s:
    kubeconfig: "{{ docker_cluster.kubeconfig }}"
    state: present
    template:
      path: templates/kubernetes/kyverno/clusterpolicies.j2
      variable_end_string: "]]"
      variable_start_string: "[["
