---
argument_specs:
  main:
    author:
      - Saurabh Jha
      - Gerard Vanloo
    options:
      kops_cluster_group:
        required: true
        type: dict
        options:
          clusters:
            elements: str
            required: true
            type: list
          name:
            required: true
            type: str
      kops_configuration:
        required: true
        type: dict
        options:
          aws:
            required: true
            type: dict
            options:
              region:
                required: true
                type: str
              s3:
                required: true
                type: dict
                options:
                  bucket:
                    required: true
                    type: dict
                    options:
                      name:
                        required: true
                        type: str
              vpc:
                required: true
                type: dict
                options:
                  cidr:
                    required: true
                    type: str
                  nat_gateway:
                    required: false
                    type: dict
                    options:
                      elastic_ip_allocation_id:
                        required: true
                        type: str
              zones:
                elements: str
                required: true
                type: list
          cluster:
            required: false
            type: dict
            options:
              api_access_cidrs:
                description: >-
                  List of CIDRs permitted to reach the Kubernetes API server.
                  Defaults to the VPC CIDR when omitted. Avoid 0.0.0.0/0 in
                  production environments.
                elements: str
                required: false
                type: list
              ssh_access_cidrs:
                description: >-
                  List of CIDRs permitted SSH access to cluster nodes.
                  Defaults to the VPC CIDR when omitted. Avoid 0.0.0.0/0 in
                  production environments.
                elements: str
                required: false
                type: list
              kubernetes:
                required: true
                type: dict
                options:
                  version:
                    required: true
                    type: str
              networking:
                required: true
                type: dict
                options:
                  mode:
                    choices:
                      - cilium
                    required: true
                    type: str
              nodes:
                required: true
                type: dict
                options:
                  control:
                    required: true
                    type: dict
                    options:
                      count:
                        required: true
                        type: int
                      image:
                        description: AMI ID or kOps image alias for control-plane nodes. Uses kOps channel default when omitted.
                        required: false
                        type: str
                      instance_type:
                        required: true
                        type: str
                      root_volume_size:
                        description: Root EBS volume size in GiB for control-plane nodes. Defaults to 64.
                        required: false
                        type: int
                  worker:
                    required: true
                    type: dict
                    options:
                      count:
                        required: true
                        type: int
                      image:
                        description: AMI ID or kOps image alias for worker nodes. Uses kOps channel default when omitted.
                        required: false
                        type: str
                      instance_type:
                        required: true
                        type: str
                      root_volume_size:
                        description: Root EBS volume size in GiB for worker nodes. Defaults to 128.
                        required: false
                        type: int
          ssh_keys:
            required: false
            type: dict
            options:
              public:
                required: true
                type: str
  set_state_storage:
    author:
      - Gerard Vanloo
    options:
      kops_configuration:
        required: true
        type: dict
        options:
          aws:
            required: true
            type: dict
            options:
              s3:
                required: true
                type: dict
                options:
                  bucket:
                    required: true
                    type: dict
                    options:
                      name:
                        required: true
                        type: str
  validate_state_storage:
    author:
      - Gerard Vanloo
    options:
      kops_configuration:
        required: true
        type: dict
        options:
          aws:
            required: true
            type: dict
            options:
              region:
                required: true
                type: str
              s3:
                required: true
                type: dict
                options:
                  bucket:
                    required: true
                    type: dict
                    options:
                      name:
                        required: true
                        type: str
