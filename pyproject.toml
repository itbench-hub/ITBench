[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "itbench"
version = "1.4.1"
description = "IT Domain AI Agents Benchmarks"
readme = "README.md"
requires-python = ">=3.13,<3.16"
dependencies = [
    "ansible-core==2.22.0",
    "ansible-runner==2.4.3",
    "boto3==1.44.1",
    "click==8.5.1",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "kubernetes==37.0.2",
    "pydantic==2.14.3",
    "questionary==2.1.1",
    "rich==15.0.0",
]

[project.scripts]
itbench = "itbench.cli.main:cli"

[dependency-groups]
dev = [
    "ansible-lint==26.11.0",
    "commitizen==4.19.3",
    "detect-secrets",
    "molecule==26.11.0",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: marks tests as integration tests (require a live Kind cluster)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E4/E7/E9 + F are ruff's defaults; I = import sorting, UP = pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
# Keep `import x` and `from x import y` in separate blocks within a section, as the codebase already does.
lines-between-types = 1

[tool.uv.sources]
detect-secrets = { git = "https://github.com/ibm/detect-secrets.git", rev = "f4b775c5c7adcebba29eb6d8bd3f641181ee4bfe" } # pragma: allowlist secret
