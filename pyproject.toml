[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "itbench"
version = "1.4.1"
description = "IT Domain AI Agents Benchmarks"
readme = "README.md"
requires-python = ">=3.13,<3.16"
dependencies = [
    "ansible-core==2.21.5",
    "ansible-lint==26.9.0",
    "ansible-runner==2.4.3",
    "awxkit==24.6.1",
    "boto3==1.43.110",
    "click==8.5.0",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "kubernetes==37.0.1",
    "pydantic==2.14.0",
    "questionary==2.1.1",
    "rich==15.0.0",
]

[project.scripts]
itbench = "itbench.cli.main:cli"

[dependency-groups]
dev = [
    "commitizen==4.19.2",
    "detect-secrets",
    "molecule==26.9.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: marks tests as integration tests (require a live Kind cluster)",
]

[tool.uv]
required-version = "==0.12.24"

[tool.uv.sources]
detect-secrets = { git = "https://github.com/ibm/detect-secrets.git", rev = "38ba7e335083e0a4db8c53e9be414795b27891e9" } # pragma: allowlist secret
