[project]
name = "ITBench"
version = "1.4.1"
description = "IT Domain AI Agents Benchmarks"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "ansible-core==2.21.4",
    "ansible-runner==2.4.3",
    "boto3==1.43.93",
    "jsonschema==4.26.0",
    "kubernetes==36.0.3",
    "psutil==7.2.2",
]

[dependency-groups]
dev = [
    "ansible-lint==26.8.0",
    "commitizen==4.17.1",
    "detect-secrets",
    "molecule==26.8.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
]

[tool.uv]
required-version = "==0.12.13"

[tool.uv.sources]
detect-secrets = { git = "https://github.com/ibm/detect-secrets.git", rev = "38ba7e335083e0a4db8c53e9be414795b27891e9" } # pragma: allowlist secret

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "scripts/library", "scripts/agent"]
markers = ["integration: requires a live Kubernetes cluster"]
addopts = "-m 'not integration'"
