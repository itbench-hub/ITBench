# yaml-language-server: $schema=../../../schemas/json/library/scenarios/ground_truth.json
---
signals:
  prometheus:
    alerts:
      - name: KubePodNotReady
entities:
  faulted:
    kubernetes:
      - apiVersion: apps/v1
        kind: Deployment
        name: payment
        namespace: otel-demo
solutions:
  - - steps:
        - text: Manually edit the manifest and remove the faulty pod anti-affinity
            rule with the correct value.
          command: kubectl -n otel-demo edit deployment payment
