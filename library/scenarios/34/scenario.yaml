# yaml-language-server: $schema=../../../schemas/json/library/scenario.json
---
environment:
  applications:
    - id: opentelemetry-demo
  domains:
    - sre
faults:
  - injections:
      - id: valkey-workload-changed-password
        targets:
          - kubernetes:
              apiVersion: v1
              kind: Secret
              name: valkey-credentials
              namespace: otel-demo
    waitFor:
      postInjection:
        - id: delete-workload-pods
          workload:
            apiVersion: apps/v1
            kind: Deployment
            name: valkey-cart
            namespace: otel-demo
