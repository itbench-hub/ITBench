# yaml-language-server: $schema=../../../schemas/json/library/scenarios/ground_truth.json
---
alerts:
  - name: HighRequestErrorRate
    labels: {}
entities:
  - apiVersion: apps/v1
    kind: Deployment
    name: frontend
    namespace: otel-demo
solutions:
  - - steps:
        - text: Manually edit the manifest and replace the invalid rule with the correct
            value.
          command: kubectl -n otel-demo edit authorizationpolicy frontend-deny
    - steps:
        - text: Delete the faulty authorization policy.
          command: kubectl -n otel-demo delete authorizationpolicy frontend-deny
