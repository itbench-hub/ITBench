# yaml-language-server: $schema=../../../schemas/json/library/scenarios/ground_truth.json
---
alerts:
  - name: KubeContainerWaiting
    labels: {}
entities:
  - apiVersion: apps/v1
    kind: Deployment
    name: email
    namespace: otel-demo
solutions:
  - - steps:
        - text: Manually edit the manifest and replace the command of the hanging
            init container to one which will complete.
          command: kubectl -n otel-demo edit deployment email
    - steps:
        - text: Manually edit the manifest and remove the faulty init container.
          command: kubectl -n otel-demo edit deployment email
