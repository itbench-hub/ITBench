# yaml-language-server: $schema=../../../schemas/json/library/scenarios/ground_truth.json
---
alerts:
  - name: HighRequestLatency
    labels: {}
entities:
  - apiVersion: apps/v1
    kind: Deployment
    name: frontend
    namespace: otel-demo
solutions:
  - - steps:
        - text: Remove the ConfigMaps that are consuming etcd storage.
          command: kubectl -n otel-demo delete configmap -l app=etcd-storage-fill
        - text: Compact and defragment the etcd database to reclaim storage space.
    - steps:
        - text: Identify and remove unnecessary resources (completed jobs, orphaned
            ConfigMaps) to reduce etcd storage usage.
        - text: Increase the etcd storage quota if the current limit is too low for
            the cluster workload.
