# yaml-language-server: $schema=../../../schemas/json/library/scenario.json
---
environment:
  applications:
    - id: opentelemetry-demo
  domains:
    - sre
faults:
  - injections:
      - id: nonexistent-kubernetes-workload-container-image
        targets:
          - kubernetes:
              apiVersion: apps/v1
              kind: Deployment
              name: product-catalog
              namespace: otel-demo
    waitFor:
      postInjection:
        - id: delete-workload-pods
          workload:
            apiVersion: apps/v1
            kind: Deployment
            name: checkout
            namespace: otel-demo
