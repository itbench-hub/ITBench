# yaml-language-server: $schema=../../../schemas/json/library/scenarios/ground_truth.json
---
alerts:
  - name: KubePodNotReady
    labels: {}
entities:
  - apiVersion: apps/v1
    kind: Deployment
    name: frontend
    namespace: otel-demo
solutions:
  - - steps:
        - text: Manually edit the manifest and remove the faulty readiness probe in
            the container rule.
          command: kubectl -n otel-demo edit deployment frontend
