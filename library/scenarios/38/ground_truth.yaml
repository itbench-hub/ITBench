# yaml-language-server: $schema=../../../schemas/json/library/ground_truth.json
---
alerts:
  - name: KubeHpaMaxedOut
    labels: {}
entities:
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    name: fraud-detection
    namespace: otel-demo
  - apiVersion: apps/v1
    kind: Deployment
    name: fraud-detection
    namespace: otel-demo
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    name: frontend
    namespace: otel-demo
  - apiVersion: apps/v1
    kind: Deployment
    name: frontend
    namespace: otel-demo
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    name: image-provider
    namespace: otel-demo
  - apiVersion: apps/v1
    kind: Deployment
    name: image-provider
    namespace: otel-demo
solutions:
  - - steps:
        - text: Manually edit the manifest and replace the utilization values with
            the correct values.
          command: kubectl -n otel-demo edit horizontalpodautoscaler fraud-detection
  - - steps:
        - text: Manually edit the manifest and replace the utilization values with
            the correct values.
          command: kubectl -n otel-demo edit horizontalpodautoscaler frontend
  - - steps:
        - text: Manually edit the manifest and replace the utilization values with
            the correct values.
          command: kubectl -n otel-demo edit horizontalpodautoscaler image-provider
