# yaml-language-server: $schema=../../../schemas/json/library/scenarios/ground_truth.json
---
alerts:
  - name: KubeContainerWaiting
    labels: {}
  - name: KubePodNotReady
    labels: {}
entities:
  - apiVersion: apps/v1
    kind: Deployment
    name: recommendation
    namespace: otel-demo
  - apiVersion: v1
    kind: ConfigMap
    name: recommendation-config
    namespace: otel-demo
  - apiVersion: apps/v1
    kind: Deployment
    name: checkout
    namespace: otel-demo
solutions:
  - - steps:
        - text: Manually edit the manifest and replace the script with a functioning
            one.
          command: kubectl -n otel-demo edit configmap recommendation-config
    - steps:
        - text: Manually edit the manifest and remove the faulty init container.
          command: kubectl -n otel-demo edit deployment recommendation
  - - steps:
        - text: Manually edit the manifest and replace the invalid image with the
            correct value.
          command: kubectl -n otel-demo edit deployment checkout
    - steps:
        - text: Manually edit the manifest and replace the node selector to allow
            Kubernetes to schedule the workload on a supported node (if exists).
          command: kubectl -n otel-demo edit deployment checkout
