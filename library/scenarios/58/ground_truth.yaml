# yaml-language-server: $schema=../../../schemas/json/library/scenarios/ground_truth.json
---
alerts:
  - name: NoRequestsReceived
    labels: {}
  - name: HighRequestErrorRate
    labels: {}
entities:
  - apiVersion: apps/v1
    kind: Deployment
    name: accounting
    namespace: otel-demo
solutions:
  - - steps:
        - text: Manually scale the workload to the correct value.
          command: kubectl -n otel-demo scale --replicas=1 deployment/accounting
    - steps:
        - text: Manually edit the manifest and set the `replicas` field to the correct
            value.
          command: kubectl -n otel-demo edit deployment accounting
