# yaml-language-server: $schema=../../../schemas/json/library/scenarios/ground_truth.json
---
signals:
  prometheus:
    alerts:
      - name: KubePodNotReady
entities:
  faulted:
    kubernetes:
      - apiVersion: apps/v1
        kind: Deployment
        name: payment
        namespace: otel-demo
solutions:
  - - steps:
        - text: Manually edit the manifest and replace the node selector with the
            correct value.
          command: kubectl -n otel-demo edit deployment payment
    - steps:
        - text: Retrieve all worker node nodes
          command: kubectl get nodes --selector='node-role.kubernetes.io/node='
        - text: Uncordon all worker nodes which are cordoned.
