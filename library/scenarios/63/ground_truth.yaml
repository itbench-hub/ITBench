# yaml-language-server: $schema=../../../schemas/json/library/scenarios/ground_truth.json
---
alerts:
  - name: HighRequestErrorRate
    labels: {}
entities:
  - apiVersion: v1
    kind: Secret
    name: email-service-secret
    namespace: otel-demo
solutions:
  - - steps:
        - text: Inspect the corrupted secret to identify the invalid data.
          command: kubectl -n otel-demo get secret email-service-secret -o yaml
        - text: Restore the secret with correct credentials from the credential management
            system.
    - steps:
        - text: Rotate the credentials in the external system and update the Kubernetes
            Secret to match.
