# yaml-language-server: $schema=../../../schemas/json/library/scenario.json
---
environment:
  applications:
    - id: opentelemetry-demo
  domains:
    - sre
faults:
  - injections:
      - id: corrupted-kubernetes-secret-credentials
        targets:
          - kubernetes:
              apiVersion: v1
              kind: Secret
              name: email-service-secret
              namespace: otel-demo
    waitFor:
      postInjection:
        - id: delete-workload-pods
          workload:
            apiVersion: apps/v1
            kind: Deployment
            name: email
            namespace: otel-demo
