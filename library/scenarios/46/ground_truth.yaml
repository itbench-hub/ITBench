# yaml-language-server: $schema=../../../schemas/json/library/scenarios/ground_truth.json
---
alerts:
  - name: KubePodCrashLooping
    labels: {}
entities:
  - apiVersion: apps/v1
    kind: Deployment
    name: postgresql
    namespace: otel-demo
solutions:
  - - steps:
        - text: Manually edit the manifest and replace the invalid container's resource
            configuration with the correct value(s).
          command: kubectl -n otel-demo edit deployment postgresql
