---
alerts:
  - HighRequestLatency
description: This fault changes the password of a Valkey instance by updating the `valkey-credentials` Secret. Dependent workloads using the old password will fail to authenticate on the next connection attempt.
expectation: Other workloads will be unable to authorize themselves with the Valkey workload. This usually causes increased latency and errors in applications.
name: Valkey Workload Changed Password
platform: Kubernetes
resources:
  - https://valkey.io/
  - https://kubernetes.io/docs/concepts/configuration/secret/
tags:
  - Secret
  - Authentication
targets:
  - kubernetes: KubernetesSecret
solution_templates:
  templates:
    - steps:
        - command: kubectl -n {{ args.kubernetesObject.metadata.namespace }} patch secret {{ args.kubernetesObject.metadata.name }} -p '{"stringData":{"valkey-password":""}}'
          text: Restore the original (empty) Valkey password in the `valkey-credentials` Secret.
