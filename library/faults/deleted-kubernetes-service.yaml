---
alerts:
  - HighRequestErrorRate
description: This fault deletes the services attached to a Kubernetes workload, preventing other workloads from being able to communicate with it.
expectation: Existing workloads will be unable to communicate with faulted workload.
name: Deleted Kubernetes Service
platform: Kubernetes
resources:
  - https://kubernetes.io/docs/concepts/workloads/
  - https://kubernetes.io/docs/concepts/services-networking/service/
  - https://kubernetes.io/docs/tasks/access-application-cluster/connecting-frontend-backend/
  - https://kubernetes.io/docs/reference/kubernetes-api/service-resources/service-v1/
tags:
  - Deployment
  - Networking
targets:
  - kubernetes: KubernetesService
solution_templates:
  templates:
    - steps:
        - text: Create the manifest with the expected values.
    - steps:
        - text: Apply the manifest file with the expected values to the application namespace.
