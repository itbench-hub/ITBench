---
- name: Verify fault injection
  hosts:
    - localhost
  tasks:
    - name: Retrieve deployment
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.kubeconfig }}"
        api_version: apps/v1
        kind: Deployment
        name: host-network-workload
        namespace: active-host-network-k8s-deployment-test
      register: faults_deployment

    - name: Validate deployment exists
      ansible.builtin.assert:
        that:
          - faults_deployment.resources | ansible.builtin.length == 1
        fail_msg: Deployment was not created. Fault injection failed.
        success_msg: Deployment was created.

    - name: Validate hostNetwork is enabled
      ansible.builtin.assert:
        that:
          - faults_deployment.resources[0].spec.template.spec.hostNetwork == true
        fail_msg: hostNetwork is not true. Fault injection failed.
        success_msg: hostNetwork is true.
