---
- name: Create test container
  hosts:
    - localhost
  pre_tasks:
    - name: Import docker validation tasks
      ansible.builtin.import_role:
        name: executables
        tasks_from: validate_docker.yaml

  tasks:
    - name: Start UBI9 container with systemd
      community.docker.docker_container:
        name: x11-forwarding-test
        image: registry.access.redhat.com/ubi9/ubi@sha256:9d99826a5299a54fa92e9b47d74e6cd72efb04cb57eb8fe748ed93e08ebb6184
        command: /sbin/init
        privileged: true
        state: started
        cgroupns_mode: host
        volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw

    - name: Install openssh-server in container
      community.docker.docker_container_exec:
        container: x11-forwarding-test
        command: dnf install -y openssh-server

    - name: Start sshd in container
      community.docker.docker_container_exec:
        container: x11-forwarding-test
        command: systemctl start sshd

    - name: Add container to inventory
      ansible.builtin.add_host:
        name: x11-forwarding-test
        ansible_connection: community.docker.docker
