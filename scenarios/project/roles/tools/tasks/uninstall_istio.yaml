---
- name: Disable Host Routing
  kubernetes.core.k8s_json_patch:
    api_version: network.operator.openshift.io/v1
    kind: EgressRouter
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    name: cluster
    patch:
      - op: replace
        path: /spec/defaultNetwork/ovnKubernetesConfig/gatewayConfig/routingViaHost
        value: false
  when:
    - tools_cluster.platform == "openshift"

- name: Uninstall Istio ZTunnel
  kubernetes.core.helm:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    release_name: "{{ tools_releases.istio_ztunnel.name }}"
    release_namespace: |-
      {{
        (tools_cluster.platform == 'openshift') |
        ansible.builtin.ternary(tools_releases.istio_ztunnel.namespace.openshift, tools_releases.istio_ztunnel.namespace.kubernetes)
      }}
    release_state: absent
    wait: true

- name: Uninstall Istio CNI Node Agent
  kubernetes.core.helm:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    release_name: "{{ tools_releases.istio_cni.name }}"
    release_namespace: |-
      {{
        (tools_cluster.platform == 'openshift') |
        ansible.builtin.ternary(tools_releases.istio_cni.namespace.openshift, tools_releases.istio_cni.namespace.kubernetes)
      }}
    release_state: absent
    wait: true

- name: Uninstall Istiod Control Plane
  kubernetes.core.helm:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    release_name: "{{ tools_releases.istio_istiod.name }}"
    release_namespace: "{{ tools_releases.istio_istiod.namespace }}"
    release_state: absent
    wait: true

- name: Uninstall Istio Base (CRDs)
  kubernetes.core.helm:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    release_name: "{{ tools_releases.istio_base.name }}"
    release_namespace: "{{ tools_releases.istio_base.namespace }}"
    release_state: absent
    wait: true

- name: Delete Istio namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    resource_definition:
      api_version: v1
      kind: Namespace
      metadata:
        name: "{{ tools_releases.istio_base.namespace }}"
    state: absent
    wait: true
