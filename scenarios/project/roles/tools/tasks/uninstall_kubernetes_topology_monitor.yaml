---
- name: Uninstall Kubernetes Topology Monitor
  kubernetes.core.helm:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    release_name: "{{ tools_releases.kubernetes_topology_monitor.name }}"
    release_namespace: "{{ tools_releases.kubernetes_topology_monitor.namespace }}"
    release_state: absent
    wait: true

- name: Delete Namespace for Kubernetes Topology Monitor
  kubernetes.core.k8s:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    resource_definition:
      api_version: v1
      kind: Namespace
      metadata:
        name: "{{ tools_releases.kubernetes_topology_monitor.namespace }}"
    state: absent
    wait: true
