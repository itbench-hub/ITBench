---
- name: Evaluate scenario — single pass
  hosts:
    - localhost
  pre_tasks:
    - name: Import executables role
      ansible.builtin.import_role:
        name: executables
      tags:
        - always

    - name: Import cluster role
      ansible.builtin.import_role:
        name: cluster
      tags:
        - always
      vars:
        cluster_files:
          kubeconfig: "{{ cluster.kubeconfig }}"

  tasks:
    - name: Import scenarios role
      ansible.builtin.import_role:
        name: scenarios
      vars:
        scenarios_identifier: "{{ scenario_id }}"

    - name: Load EvaluationCriteria file
      ansible.builtin.set_fact:
        evaluation_criteria: |-
          {{
            lookup("ansible.builtin.file", criteria_path) |
            ansible.builtin.from_yaml
          }}
      vars:
        criteria_path: >-
          {{
            [
              playbook_dir, 'roles', 'scenarios', 'files',
              'scenario_' + (scenario_id | string),
              'evaluation_criteria.yaml'
            ] | ansible.builtin.path_join
          }}
      ignore_errors: true
      register: evaluation_criteria_load

    - name: Synthesise prometheus-alert-absent checks from GroundTruth alerts (SRE fallback)
      ansible.builtin.set_fact:
        evaluation_criteria:
          spec:
            checks: >-
              {{
                scenarios_ground_truth.spec.alerts | ansible.builtin.default([]) |
                ansible.builtin.map('ansible.builtin.combine', {'backend': 'prometheus-alert-absent'}) |
                list
              }}
      when:
        - evaluation_criteria_load is failed or not evaluation_criteria
        - scenarios_ground_truth.spec.alerts | ansible.builtin.default([]) | length > 0

    - name: Skip evaluation — no criteria and no alerts
      ansible.builtin.meta: end_play
      when:
        - evaluation_criteria_load is failed or not evaluation_criteria
        - scenarios_ground_truth.spec.alerts | ansible.builtin.default([]) | length == 0

    - name: Set evaluation inputs
      ansible.builtin.set_fact:
        evaluation_checks: "{{ evaluation_criteria.spec.checks }}"
        evaluation_results: []
        evaluation_cluster:
          kubeconfig: "{{ cluster.kubeconfig }}"
        evaluation_storage: "{{ storage }}"

    - name: Import tools role to resolve Prometheus endpoint
      ansible.builtin.import_role:
        name: tools
        tasks_from: set_external_endpoints
      vars:
        tools_cluster:
          kubeconfig: "{{ cluster.kubeconfig }}"
          platform: "{{ cluster_platform }}"
      when: >-
        evaluation_checks |
        ansible.builtin.selectattr('backend', '==', 'prometheus-alert-absent') |
        list | length > 0

    - name: Set Prometheus URL from resolved endpoint
      ansible.builtin.set_fact:
        evaluation_prometheus_url: >-
          {{
            tools_prometheus_endpoint.http
            if tools_prometheus_endpoint is ansible.builtin.defined
            else ''
          }}

    - name: Import evaluation role
      ansible.builtin.import_role:
        name: evaluation

    - name: Determine overall pass
      ansible.builtin.set_fact:
        evaluation_overall_pass: >-
          {{
            evaluation_results | length > 0 and
            evaluation_results | ansible.builtin.selectattr('pass', '==', false) | list | length == 0
          }}

    - name: Write evaluation result to storage
      ansible.builtin.copy:
        content: >-
          {{
            {
              'pass': evaluation_overall_pass,
              'checks': evaluation_results
            } | ansible.builtin.to_json(indent=2)
          }}
        dest: "{{ storage.local.directory }}/evaluation_result.json"
        mode: "0644"
