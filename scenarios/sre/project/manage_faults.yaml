---
- name: Manage SRE and FinOps Scenario Faults
  hosts:
    - localhost
  tasks:
    - name: Import waiters role
      ansible.builtin.import_role:
        name: waiters
      vars:
        waiters_tasks: "{{ pre_injection_tasks | ansible.builtin.default([]) }}"

    - name: Import faults role
      ansible.builtin.import_role:
        name: faults
      vars:
        faults_injection_tasks: "{{ injection_tasks | ansible.builtin.default([]) }}"

    - name: Import waiters role
      ansible.builtin.import_role:
        name: waiters
      vars:
        waiters_tasks: "{{ post_injection_tasks | ansible.builtin.default([]) }}"
