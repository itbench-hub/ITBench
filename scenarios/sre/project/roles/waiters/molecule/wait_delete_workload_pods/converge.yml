---
- name: Run waiter tasks
  hosts:
    - localhost
  tasks:
    - name: Import waiters role
      ansible.builtin.import_role:
        name: waiters
      vars:
        waiters_tasks:
          - id: delete-workload-pods
            workload:
              apiVersion: apps/v1
              kind: Deployment
              name: test-deployment-standard
              namespace: delete-workload-pods-test
          - id: delete-workload-pods
            workload:
              apiVersion: apps/v1
              kind: Deployment
              name: test-deployment-pending
              namespace: delete-workload-pods-test
          - id: delete-workload-pods
            workload:
              apiVersion: apps/v1
              kind: StatefulSet
              name: test-statefulset-standard
              namespace: delete-workload-pods-test
          - id: delete-workload-pods
            workload:
              apiVersion: apps/v1
              kind: StatefulSet
              name: test-statefulset-pending
              namespace: delete-workload-pods-test
