---
- name: Run waiter tasks
  hosts:
    - localhost
  tasks:
    - name: Import waiters role
      ansible.builtin.import_role:
        name: waiters
      vars:
        waiters_tasks:
          - id: scale-kubernetes-workload
            workload:
              apiVersion: apps/v1
              kind: Deployment
              name: test-workload
              namespace: scale-kubernetes-workload-test
            replicas: 5
