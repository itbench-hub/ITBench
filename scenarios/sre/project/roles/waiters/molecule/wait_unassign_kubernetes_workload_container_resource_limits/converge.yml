---
- name: Run waiter tasks
  hosts:
    - localhost
  tasks:
    - name: Import waiters role
      ansible.builtin.import_role:
        name: waiters
      vars:
        waiters_tasks:
          - id: unassign-workload-container-resource-limits
            workload:
              apiVersion: apps/v1
              kind: Deployment
              name: compromised-workload
              namespace: unassigned-k8-container-resource-limits-test
            container: server
