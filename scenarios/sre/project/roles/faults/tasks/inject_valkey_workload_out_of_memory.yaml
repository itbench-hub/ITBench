---
- name: Include fault argument validation tasks
  ansible.builtin.include_tasks:
    file: validate_fault_arguments.yaml

- name: Create Valkey Configuration Job
  kubernetes.core.k8s:
    kubeconfig: "{{ faults_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: "{{ faults_kubernetes_object.metadata.name }}-oom-config"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      spec:
        ttlSecondsAfterFinished: 30
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: valkey-cli
                image: docker.io/valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
                command:
                  - /bin/sh
                  - -c
                  - >-
                    valkey-cli -h {{ faults_kubernetes_object.metadata.name }}
                    CONFIG SET maxmemory 1mb &&
                    valkey-cli -h {{ faults_kubernetes_object.metadata.name }}
                    CONFIG SET maxmemory-policy noeviction
    state: present
    wait: true
    wait_condition:
      type: Complete
      status: "True"
    wait_timeout: 60

- name: Delete valkey-cli config Job
  kubernetes.core.k8s:
    kubeconfig: "{{ faults_cluster.kubeconfig }}"
    api_version: batch/v1
    kind: Job
    name: "{{ faults_kubernetes_object.metadata.name }}-oom-config"
    namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
    state: absent
