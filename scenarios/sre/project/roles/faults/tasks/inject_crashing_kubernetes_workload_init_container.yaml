---
- name: Include fault argument validation tasks
  ansible.builtin.include_tasks:
    file: validate_fault_arguments.yaml

- name: Create ConfigMap
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        labels: "{{ faults_kubernetes_object.metadata.labels | ansible.builtin.default({}) }}"
        name: "{{ faults_kubernetes_object.metadata.name }}-config"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      data:
        config: |-
          {
              "configuration_items": [
                  {
                      "name": fake
                  }
              ]
          }
        script: |-
          import json
          import os
          import sys

          def main():
              try:
                  with open(os.path.expanduser("~/config/config.json"), "r") as f:
                      data = json.load(f)

                  items_count = len(data.get("configuration_items", []))

                  print(f"Config loaded successfully with {items_count} configuration items")
                  sys.exit(0)
              except json.JSONDecodeError as e:
                  print(f"FATAL: Failed to parse configuration file: {e}")
                  sys.exit(1)
              except Exception as e:
                  print(f"FATAL: Unexpected error loading configuration: {e}")
                  sys.exit(1)

          if __name__ == "__main__":
              main()
    state: present

- name: Update workload init containers
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: "{{ faults_kubernetes_object.apiVersion }}"
      kind: "{{ faults_kubernetes_object.kind }}"
      metadata:
        name: "{{ faults_kubernetes_object.metadata.name }}"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      spec:
        template:
          spec:
            initContainers:
              - args:
                  - -c
                  - "python3.14 ~/scripts/load_config.py"
                command:
                  - /bin/sh
                image:
                  registry.access.redhat.com/ubi10/python-314-minimal:10.2-1791928506@sha256:3754d6dacac3177e62637420cadf7dcf438e390f664c527b0457a79653a47488
                name: worker
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - mountPath: /opt/app-root/src/config
                    name: config
                    readOnly: true
                  - mountPath: /opt/app-root/src/scripts
                    name: scripts
                    readOnly: true
            volumes:
              - configMap:
                  defaultMode: 0755
                  items:
                    - key: config
                      path: config.json
                  name: "{{ faults_kubernetes_object.metadata.name }}-config"
                name: config
              - configMap:
                  defaultMode: 0755
                  items:
                    - key: script
                      path: load_config.py
                  name: "{{ faults_kubernetes_object.metadata.name }}-config"
                name: scripts
    state: patched
