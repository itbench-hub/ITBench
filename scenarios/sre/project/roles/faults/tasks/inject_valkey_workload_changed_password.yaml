---
- name: Include fault argument validation tasks
  ansible.builtin.include_tasks:
    file: validate_fault_arguments.yaml

- name: Generate random invalid password
  ansible.builtin.set_fact:
    faults_valkey_invalid_password: |- # pragma: allowlist secret
      {{
        lookup(
          "ansible.builtin.password",
          "/dev/null chars=ascii_lowercase,ascii_uppercase,digits length=24"
        )
      }}

- name: Update valkey-credentials secret with invalid password
  kubernetes.core.k8s:
    kubeconfig: "{{ faults_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ faults_kubernetes_object.metadata.name }}"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      stringData:
        valkey-password: "{{ faults_valkey_invalid_password }}" # pragma: allowlist secret
    state: patched
