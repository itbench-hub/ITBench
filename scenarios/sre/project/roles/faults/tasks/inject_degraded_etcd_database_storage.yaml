---
- name: Include fault argument validation tasks
  ansible.builtin.include_tasks:
    file: validate_fault_arguments.yaml

- name: Create ConfigMaps to pressure etcd storage
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        labels:
          "app.kubernetes.io/managed-by": ansible
          "app.kubernetes.io/part-of": itbench
          "itbench.io/layer": application
        name: "application-config-{{ item }}"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      data:
        payload: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_lowercase,digits length=102400') }}"
    state: present
  loop: "{{ range(1, 51) | list }}"
  loop_control:
    label: "application-config-{{ item }}"
