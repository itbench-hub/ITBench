---
- name: Include fault argument validation tasks
  ansible.builtin.include_tasks:
    file: validate_fault_arguments.yaml

- name: Create ConfigMaps to pressure etcd storage
  kubernetes.core.k8s:
    kubeconfig: "{{ faults_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "etcd-fill-{{ item }}"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
        labels:
          app: etcd-storage-fill
      data:
        payload: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_lowercase,digits length=102400') }}"
    state: present
  loop: "{{ range(1, 51) | list }}"
  loop_control:
    label: "etcd-fill-{{ item }}"

- name: Verify ConfigMaps were created
  kubernetes.core.k8s_info:
    kubeconfig: "{{ faults_cluster.kubeconfig }}"
    api_version: v1
    kind: ConfigMap
    namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
    label_selectors:
      - app=etcd-storage-fill
  register: faults_etcd_fill_result
  until:
    - faults_etcd_fill_result.resources | length >= 50
  retries: 5
  delay: 10
