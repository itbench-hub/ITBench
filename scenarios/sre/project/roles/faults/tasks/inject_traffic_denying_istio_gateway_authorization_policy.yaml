---
- name: Include fault argument validation tasks
  ansible.builtin.include_tasks:
    file: validate_fault_arguments.yaml

- name: Create authorization policy for gateway
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      metadata:
        labels: "{{ labels }}"
        name: "{{ faults_kubernetes_object.metadata.name }}-policy"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      spec:
        action: DENY
        rules:
          - to:
              - operation:
                  methods:
                    - GET
                    - POST
                    - PUT
                    - DELETE
                    - PATCH
                    - HEAD
                    - OPTIONS
        targetRef:
          group: gateway.networking.k8s.io
          kind: Gateway
          name: "{{ faults_kubernetes_object.metadata.name }}"
    state: present
  vars:
    labels: >-
      {{
        faults_kubernetes_object.metadata.labels |
        ansible.builtin.default({}) |
        ansible.builtin.combine({"app.kubernetes.io/name": faults_kubernetes_object.metadata.name ~ "-policy"})
      }}
