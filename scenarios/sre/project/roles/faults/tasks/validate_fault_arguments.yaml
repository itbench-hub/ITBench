---
- name: Fail playbook due to unsupported number of `targets`
  ansible.builtin.fail:
    msg: "{{ injection_task.id }} supports a single target but {{ fault_args.targets | ansible.builtin.length }} were given."
  when:
    - fault_args.targets | ansible.builtin.default([]) | ansible.builtin.length > 1

- name: Validate `targets` fault argument
  when:
    - fault_args.targets | ansible.builtin.default([]) | ansible.builtin.length == 1
  vars:
    faults_target: "{{ (fault_args.targets | ansible.builtin.first).kubernetes }}"
  block:
    - name: Retrieve {{ faults_target.kind | ansible.builtin.lower }}
      kubernetes.core.k8s_info:
        api_version: "{{ faults_target.apiVersion }}"
        kind: "{{ faults_target.kind }}"
        name: "{{ faults_target.name }}"
        namespace: "{{ faults_target.namespace | ansible.builtin.default(omit, true) }}"
      register: faults_args_kubernetes_object

    - name: Fail playbook due to `kubernetes object not found` error
      ansible.builtin.fail:
        msg: "{{ object.kind }}/{{ object.name }} not found. please ensure object exists before injecting this fault."
      vars:
        object:
          kind: "{{ faults_target.kind }}"
          name: "{{ faults_target.name }}"
      when:
        - not faults_args_kubernetes_object.api_found
        - faults_args_kubernetes_object.resources | ansible.builtin.length != 1

    - name: Extract object information from output
      ansible.builtin.set_fact:
        faults_kubernetes_object: "{{ faults_args_kubernetes_object.resources | ansible.builtin.first }}"
