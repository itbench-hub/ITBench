---
- name: Include fault argument validation tasks
  ansible.builtin.include_tasks:
    file: validate_fault_arguments.yaml

- name: Create PersistentVolumeClaim
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels: >-
          {{
            faults_kubernetes_object.metadata.labels |
            ansible.builtin.default({}) |
            ansible.builtin.combine({"app.kubernetes.io/name": faults_kubernetes_object.metadata.name ~ "-data-storage"})
          }}
        name: "{{ faults_kubernetes_object.metadata.name }}-data-storage"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 25Mi
        storageClassName: aws-gp2
    state: present

- name: Update workload containers
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: "{{ faults_kubernetes_object.apiVersion }}"
      kind: "{{ faults_kubernetes_object.kind }}"
      metadata:
        name: "{{ faults_kubernetes_object.metadata.name }}"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      spec:
        template:
          spec:
            containers:
              - name: "{{ container.name }}"
                volumeMounts:
                  - mountPath: /data/database
                    name: database
            securityContext:
              fsGroup: 1000
            volumes:
              - name: database
                persistentVolumeClaim:
                  claimName: "{{ faults_kubernetes_object.metadata.name }}-data-storage"
    state: patched
  vars:
    container: "{{ faults_kubernetes_object.spec.template.spec.containers | ansible.builtin.random }}"
