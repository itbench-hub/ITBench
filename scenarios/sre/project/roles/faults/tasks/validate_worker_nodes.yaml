---
- name: Retrieve worker nodes
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    label_selectors:
      - "!node-role.kubernetes.io/control-plane"
  register: faults_worker_nodes

- name: Reset sandbox nodes
  ansible.builtin.set_fact:
    faults_sandbox_nodes: []

- name: Select worker nodes with the sandbox taint
  ansible.builtin.set_fact:
    faults_sandbox_nodes: "{{ faults_sandbox_nodes + [item] }}"
  loop: "{{ faults_worker_nodes.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - >-
      'itbench.io/sandbox' in
      (item.spec.taints | ansible.builtin.default([]) | ansible.builtin.map(attribute='key') | ansible.builtin.list)

- name: Fail playbook due to `suitable worker nodes not found` error
  ansible.builtin.fail:
    msg: >-
      suitable worker nodes could not be found. please ensure worker nodes are tainted with
      itbench.io/sandbox=true:NoSchedule (`itbench configure environment`).
  when:
    - faults_sandbox_nodes | ansible.builtin.length == 0
