---
- name: Include fault argument validation tasks
  ansible.builtin.include_tasks:
    file: validate_fault_arguments.yaml

- name: Include worker nodes validation tasks
  ansible.builtin.include_tasks:
    file: validate_worker_nodes.yaml

- name: Select an available worker node randomly
  ansible.builtin.set_fact:
    faults_node: "{{ faults_worker_nodes.resources | ansible.builtin.random }}"

- name: Create PriorityClass (high priority)
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: scheduling.k8s.io/v1
      kind: PriorityClass
      metadata:
        labels:
          "app.kubernetes.io/managed-by": ansible
          "app.kubernetes.io/part-of": itbench
          "itbench.io/layer": application
        name: application-critical
      description: High priority class for application workloads
      globalDefault: false
      value: 10000
    state: present

- name: Create PriorityClass (lower priority)
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: scheduling.k8s.io/v1
      kind: PriorityClass
      metadata:
        labels:
          "app.kubernetes.io/managed-by": ansible
          "app.kubernetes.io/part-of": itbench
          "itbench.io/layer": application
        name: application-non-critical
      description: Lower priority class for application workloads
      globalDefault: false
      value: 1
    state: present

- name: Patch workload with priority class and assign to node
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: "{{ faults_kubernetes_object.apiVersion }}"
      kind: "{{ faults_kubernetes_object.kind }}"
      metadata:
        name: "{{ faults_kubernetes_object.metadata.name }}"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      spec:
        template:
          spec:
            nodeSelector:
              "kubernetes.io/hostname": "{{ faults_node.metadata.name }}"
            priorityClassName: application-non-critical
    state: patched

- name: Wait for workload to update
  delay: 15
  kubernetes.core.k8s_info:
    api_version: "{{ faults_kubernetes_object.apiVersion }}"
    kind: "{{ faults_kubernetes_object.kind }}"
    name: "{{ faults_kubernetes_object.metadata.name }}"
    namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
  register: faults_patched_workload
  retries: 20
  until:
    - faults_patched_workload.api_found
    - faults_patched_workload.resources | ansible.builtin.length == 1
    - faults_patched_workload.resources[0].status.availableReplicas == faults_patched_workload.resources[0].status.replicas

- name: Create priority workload
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels: "{{ labels }}"
        name: critical-data-collector
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      spec:
        replicas: "{{ replicas + 1 }}"
        selector:
          matchLabels: "{{ labels }}"
        template:
          metadata:
            labels: "{{ labels }}"
          spec:
            containers:
              - args:
                  - -c
                  - "sleep infinity"
                command:
                  - /bin/sh
                image: registry.access.redhat.com/ubi10/ubi-minimal@sha256:ab67cd02caf8706e34a695a1432ebe965934f6128ec352a6c3f4048b43a4fb5e
                name: worker
                resources:
                  requests:
                    cpu: "{{ ((((faults_node.status.allocatable.cpu | int) - 1) / replicas) * 1000) }}m"
                    memory: 1Mi
            nodeSelector:
              "kubernetes.io/hostname": "{{ faults_node.metadata.name }}"
            priorityClassName: application-critical
    state: present
    wait: true
  vars:
    labels: >-
      {{
        faults_kubernetes_object.metadata.labels |
        ansible.builtin.default({}) |
        ansible.builtin.combine({"app.kubernetes.io/name": "critical-data-collector"})
      }}
    replicas: 20
