---
- name: Include fault argument validation tasks
  ansible.builtin.include_tasks:
    file: validate_fault_arguments.yaml

- name: Build list of modified with shifted target ports
  ansible.builtin.set_fact:
    faults_modified_ports: >-
      {{
        (
          faults_modified_ports | default([])
        ) +
        [
          port | ansible.builtin.combine({
            "targetPort": port.targetPort + modifier if (port.targetPort is ansible.builtin.number) else "http-" ~ modifier
          })
        ]
      }}
  loop: "{{ faults_kubernetes_object.spec.ports }}"
  loop_control:
    label: port/{{ port.port }}
    loop_var: port
  vars:
    modifier: "{{ range(1, 11) | ansible.builtin.list | ansible.builtin.random }}"

- name: Update service ports
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: "{{ faults_kubernetes_object.apiVersion }}"
      kind: "{{ faults_kubernetes_object.kind }}"
      metadata:
        name: "{{ faults_kubernetes_object.metadata.name }}"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      spec:
        ports: "{{ faults_modified_ports }}"
    state: patched
