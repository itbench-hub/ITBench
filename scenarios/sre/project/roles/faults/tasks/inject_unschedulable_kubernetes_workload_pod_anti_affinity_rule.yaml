---
- name: Include fault argument validation tasks
  ansible.builtin.include_tasks:
    file: validate_fault_arguments.yaml

- name: Create DaemonSet
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        labels: "{{ labels }}"
        name: application-operator
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      spec:
        selector:
          matchLabels: "{{ labels }}"
        template:
          metadata:
            labels: "{{ labels }}"
          spec:
            containers:
              - args:
                  - -c
                  - "sleep infinity"
                command:
                  - /bin/sh
                image: registry.access.redhat.com/ubi10/ubi-minimal@sha256:ab67cd02caf8706e34a695a1432ebe965934f6128ec352a6c3f4048b43a4fb5e
                name: worker
    state: present
    wait: true
  vars:
    labels: >-
      {{
        faults_kubernetes_object.metadata.labels |
        ansible.builtin.default({}) |
        ansible.builtin.combine({"app.kubernetes.io/name": "application-operator"})
      }}

- name: Update workload containers
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: "{{ faults_kubernetes_object.apiVersion }}"
      kind: "{{ faults_kubernetes_object.kind }}"
      metadata:
        name: "{{ faults_kubernetes_object.metadata.name }}"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      spec:
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                        - key: app.kubernetes.io/name
                          operator: In
                          values:
                            - application-operator
                    topologyKey: kubernetes.io/hostname
    state: patched
