---
- name: Run fault injection test
  hosts:
    - localhost
  tasks:
    - name: Import faults role
      ansible.builtin.import_role:
        name: faults
      vars:
        faults_cluster:
        faults_injection_tasks:
          - id: unassigned-kubernetes-workload-container-resource-limits
            args:
              kubernetesObject:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: compromised-workload
                  namespace: unassigned-k8-container-resource-limits-test
              container:
                name: server
