---
- name: Create test resources
  hosts:
    - localhost
  tasks:
    - name: Install Istio Base (CRDs only)
      kubernetes.core.helm:
        chart_ref: "oci://registry.istio.io/release/charts/base"
        chart_version: "1.30.3"
        create_namespace: true
        kubeconfig: "{{ cluster.kubeconfig }}"
        release_name: istio-base
        release_namespace: istio-system
        release_state: present
        wait: true

    - name: Create test namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.kubeconfig }}"
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            labels:
              "istio.io/dataplane-mode": ambient
            name: strict-mtls-test
        state: present

    - name: Create test deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.kubeconfig }}"
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-workload
            namespace: strict-mtls-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                "app.kubernetes.io/name": test-workload
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": test-workload
              spec:
                containers:
                  - name: server
                    image: registry.access.redhat.com/ubi10-minimal:10.2-1785332632@sha256:ceaad73890ea88685eeb1b40a502b7983f2cfac6f1aa10915d1176d51eb90124
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - "sleep infinity"
        state: present
        wait: true
