---
- name: Create test resources
  hosts:
    - localhost
  tasks:
    - name: Install Istio Base (CRDs only)
      kubernetes.core.helm:
        chart_ref: "oci://ghcr.io/istio/release/charts/base"
        chart_version: "1.31.2"
        create_namespace: true
        release_name: istio-base
        release_namespace: istio-system
        release_state: present
        wait: true

    - name: Create test namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            labels:
              "istio.io/dataplane-mode": ambient
            name: strict-mtls-test
        state: present

    - name: Create test deployment
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-workload
            namespace: strict-mtls-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                "app.kubernetes.io/name": test-workload
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": test-workload
              spec:
                containers:
                  - name: server
                    image: registry.access.redhat.com/ubi10/ubi-minimal@sha256:ab67cd02caf8706e34a695a1432ebe965934f6128ec352a6c3f4048b43a4fb5e
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - "sleep infinity"
        state: present
        wait: true
