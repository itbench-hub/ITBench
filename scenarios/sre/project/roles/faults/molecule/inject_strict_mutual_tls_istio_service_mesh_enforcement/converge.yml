---
- name: Run fault injection test
  hosts:
    - localhost
  tasks:
    - name: Import faults role
      ansible.builtin.import_role:
        name: faults
      vars:
        faults_injection_tasks:
          - id: strict-mutual-tls-istio-service-mesh-enforcement
            targets:
              - kubernetes:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: test-workload
                  namespace: strict-mtls-test
