---
- name: Run fault injection test
  hosts:
    - localhost
  tasks:
    - name: Import faults role
      ansible.builtin.import_role:
        name: faults
      vars:
        faults_injection_tasks:
          - id: ingress-port-blocking-network-policy
            targets:
              - kubernetes:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: compromised-workload
                  namespace: ingress-port-blocking-network-policy-test
