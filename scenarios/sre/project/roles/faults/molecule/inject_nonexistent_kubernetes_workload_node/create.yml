---
- name: Create Kubernetes objects
  hosts:
    - localhost
  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.kubeconfig }}"
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: nonexistent-kubernetes-workload-node-test
        state: present

    - name: Create deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.kubeconfig }}"
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: compromised-workload
            namespace: nonexistent-kubernetes-workload-node-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                "app.kubernetes.io/name": compromised-workload
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": compromised-workload
              spec:
                containers:
                  - name: server
                    image: registry.access.redhat.com/ubi10/ubi-minimal@sha256:552f8cc1ddb0bc9e411065c78499aa4dbc2c4ea9bd057aa0e6e44940db13acb5
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - "sleep infinity"
        state: present
        wait: true
