---
- name: Run fault injection test
  hosts:
    - localhost
  tasks:
    - name: Import faults role
      ansible.builtin.import_role:
        name: faults
      vars:

        faults_injection_tasks:
          - id: degredated-etcd-database-storage
            args:
              kubernetesObject:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: test-workload
                  namespace: degredated-etcd-database-storage-test
