---
- name: Run fault injection test
  hosts:
    - localhost
  tasks:
    - name: Import faults role
      ansible.builtin.import_role:
        name: faults
      vars:
        faults_cluster:
        faults_injection_tasks:
          - id: unsupported-architecture-kubernetes-workload-container-image
            args:
              kubernetesObject:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: compromised-workload
                  namespace: unsupported-architecture-k8s-container-image-test
              container:
                name: server
