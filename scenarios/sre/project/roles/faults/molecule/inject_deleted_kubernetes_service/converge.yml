---
- name: Run fault injection test
  hosts:
    - localhost
  tasks:
    - name: Import faults role
      ansible.builtin.import_role:
        name: faults
      vars:
        faults_injection_tasks:
          - id: deleted-kubernetes-service
            targets:
              - kubernetes:
                  apiVersion: v1
                  kind: Service
                  name: test-service
                  namespace: deleted-service-test
