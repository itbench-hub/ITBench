---
- name: Verify that fault injection succeeded
  hosts:
    - localhost
  tasks:
    - name: Retrieve ConfigMaps
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        namespace: degraded-etcd-database-storage-test
        label_selectors:
          - app.kubernetes.io/managed-by=ansible
          - app.kubernetes.io/part-of=itbench
      register: faults_configmaps

    - name: Validate ConfigMaps were created
      ansible.builtin.assert:
        that:
          - faults_configmaps.resources | length >= 50
        fail_msg: Expected at least 50 ConfigMaps to be created. Fault injection may have failed.
        success_msg: ConfigMaps created successfully.
