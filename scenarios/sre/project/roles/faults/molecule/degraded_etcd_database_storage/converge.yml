---
- name: Run fault injection test
  hosts:
    - localhost
  tasks:
    - name: Import faults role
      ansible.builtin.import_role:
        name: faults
      vars:
        faults_injection_tasks:
          - id: degraded-etcd-database-storage
            targets:
              - kubernetes:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: test-workload
                  namespace: degraded-etcd-database-storage-test
