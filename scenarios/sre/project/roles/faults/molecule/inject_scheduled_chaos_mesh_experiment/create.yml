---
- name: Create test resources
  hosts:
    - localhost
  tasks:
    - name: Install Chaos Mesh
      kubernetes.core.helm:
        chart_ref: "{{ packages.helm_charts.chaos_mesh.name }}"
        chart_repo_url: "{{ packages.helm_charts.chaos_mesh.repository }}"
        chart_version: "{{ packages.helm_charts.chaos_mesh.version }}"
        create_namespace: true
        kubeconfig: "{{ cluster.kubeconfig }}"
        release_name: chaos-mesh
        release_namespace: chaos-mesh
        release_state: present
        wait: true

    - name: Create test namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.kubeconfig }}"
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: scheduled-chaos-test
        state: present

    - name: Create test deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.kubeconfig }}"
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-workload
            namespace: scheduled-chaos-test
          spec:
            replicas: 2
            selector:
              matchLabels:
                "app.kubernetes.io/name": test-workload
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": test-workload
              spec:
                containers:
                  - name: server
                    image: registry.access.redhat.com/ubi10-minimal:10.2-1785215492
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - "sleep infinity"
        state: present
        wait: true
