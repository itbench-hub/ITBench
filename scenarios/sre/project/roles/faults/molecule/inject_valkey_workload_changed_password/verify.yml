---
- name: Verify that fault injection succeeded
  hosts:
    - localhost
  tasks:
    - name: Retrieve valkey-credentials secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: valkey-credentials
        namespace: valkey-workload-changed-password-test
      register: faults_secret

    - name: Validate Secret exists and password key is present
      ansible.builtin.assert:
        that:
          - faults_secret.resources | ansible.builtin.length == 1
          - faults_secret.resources[0].data['valkey-password'] is ansible.builtin.defined
        fail_msg: Secret not found or password key missing. Fault injection failed.
        success_msg: Secret found with password key.

    - name: Validate password was changed from the original empty value
      ansible.builtin.assert:
        that:
          - faults_secret.resources[0].data['valkey-password'] != "" | ansible.builtin.b64encode
        fail_msg: Password was not changed from original value. Fault injection failed.
        success_msg: Password was changed successfully.
