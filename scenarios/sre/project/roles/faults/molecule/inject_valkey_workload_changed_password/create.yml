---
- name: Create Kubernetes objects
  hosts:
    - localhost
  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.kubeconfig }}"
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: valkey-workload-changed-password-test
        state: present

    - name: Create deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.kubeconfig }}"
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: compromised-workload
            namespace: valkey-workload-changed-password-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                "app.kubernetes.io/name": compromised-workload
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": compromised-workload
              spec:
                containers:
                  - name: valkey
                    image: docker.io/valkey/valkey:9.1.2-alpine3.24@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
                    ports:
                      - containerPort: 6379
                        name: valkey
        state: present
        wait: true
