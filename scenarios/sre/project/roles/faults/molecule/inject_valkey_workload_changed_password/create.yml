---
- name: Create Kubernetes objects
  hosts:
    - localhost
  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: valkey-workload-changed-password-test
        state: present

    - name: Create valkey-credentials secret
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: valkey-credentials
            namespace: valkey-workload-changed-password-test
          stringData:
            valkey-password: "" # pragma: allowlist secret
        state: present
