---
- name: Run fault injection test
  hosts:
    - localhost
  tasks:
    - name: Import faults role
      ansible.builtin.import_role:
        name: faults
      vars:
        faults_injection_tasks:
          - id: valkey-workload-changed-password
            targets:
              - kubernetes:
                  apiVersion: v1
                  kind: Secret
                  name: valkey-credentials
                  namespace: valkey-workload-changed-password-test
