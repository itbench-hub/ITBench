---
- name: Create OpenTelemetry Demo Application
  hosts:
    - localhost
  tasks:
    - name: Install OpenTelemetry Demo (Astronomy Shop)
      kubernetes.core.helm:
        chart_ref: "{{ packages.helm_charts.opentelemetry_demo.registry }}"
        chart_version: "{{ packages.helm_charts.opentelemetry_demo.version }}"
        create_namespace: true
        kubeconfig: "{{ cluster.kubeconfig }}"
        release_name: opentelemetry-demo-feature-flag-release
        release_namespace: opentelemetry-demo-feature-flag-test
        release_state: present
        timeout: 10m0s
        values:
          opentelemetry-collector:
            enabled: false
          jaeger:
            enabled: false
          prometheus:
            enabled: false
          grafana:
            enabled: false
          opensearch:
            enabled: false
        wait: true
