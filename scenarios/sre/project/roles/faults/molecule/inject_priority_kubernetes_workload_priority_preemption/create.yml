---
- name: Create Kubernetes objects
  hosts:
    - localhost
  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: priority-k8s-workload-priority-preemption-test
        state: present

    - name: Create deployment
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: compromised-workload
            namespace: priority-k8s-workload-priority-preemption-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                "app.kubernetes.io/name": compromised-workload
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": compromised-workload
              spec:
                containers:
                  - name: server
                    image: registry.access.redhat.com/ubi10/ubi-minimal@sha256:cc3d766e796fbb50d6fcd599f4bad4c231aeae41822c6e86e7da664a996221ca
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - "sleep infinity"
                tolerations:
                  - effect: NoSchedule
                    key: itbench.io/sandbox
                    operator: Equal
                    value: "true"
        state: present
        wait: true
