---
- name: Create test resources
  hosts:
    - localhost
  tasks:
    - name: Import cluster role
      ansible.builtin.import_role:
        name: cluster
        
    - name: Import tools role
      ansible.builtin.import_role:
        name: tools
        tasks_from: install_kubernetes_gateway_api.yaml
      vars:
        tools_cluster:
          platform: "{{ cluster_platform }}"
          provider: "{{ cluster_provider }}"

    - name: Install Istio Base (CRDs)
      kubernetes.core.helm:
        chart_ref: "oci://registry.istio.io/release/charts/base"
        chart_version: "1.30.4"
        create_namespace: true
        release_name: istio-base
        release_namespace: istio-system
        release_state: present
        wait: true

    - name: Install Istio Istiod (Control Plane)
      kubernetes.core.helm:
        chart_ref: "oci://registry.istio.io/release/charts/istiod"
        chart_version: "1.30.4"
        release_name: istiod
        release_namespace: istio-system
        release_state: present
        wait: true

    - name: Create test namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: gateway-authz-test
        state: present

    - name: Create Gateway
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: test-gateway
            namespace: gateway-authz-test
          spec:
            gatewayClassName: istio
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: Same
        state: present
        wait: true
        wait_condition:
          reason: Accepted
          status: "True"
          type: Accepted

    - name: Create test deployment
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-workload
            namespace: gateway-authz-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                "app.kubernetes.io/name": test-workload
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": test-workload
              spec:
                containers:
                  - name: server
                    image: registry.access.redhat.com/ubi10-minimal:10.2-1788940913@sha256:26dc3089ab24491c1ba01ab92a7d502d181425b6021e362a07484daee696a3aa
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - "sleep infinity"
        state: present
        wait: true

    - name: Create test service
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: test-service
            namespace: gateway-authz-test
          spec:
            selector:
              "app.kubernetes.io/name": test-workload
            ports:
              - port: 80
                targetPort: 8080
                protocol: TCP
        state: present
