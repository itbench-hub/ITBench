---
- name: Verify that fault injection succeeded
  hosts:
    - localhost
  tasks:
    - name: Retrieve injector job
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.kubeconfig }}"
        api_version: batch/v1
        kind: Job
        name: valkey-memory-manager
        namespace: valkey-workload-out-of-memory-test
      register: faults_job

    - name: Validate injector job completed successfully
      ansible.builtin.assert:
        that:
          - faults_job.resources | ansible.builtin.length == 1
          - faults_job.resources[0].status.succeeded == 1
        fail_msg: Injector job did not complete successfully. Fault injection failed.
        success_msg: Injector job completed successfully.

    - name: Wait for workload to become unavailable
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.kubeconfig }}"
        api_version: apps/v1
        kind: Deployment
        name: compromised-workload
        namespace: valkey-workload-out-of-memory-test
        wait: true
        wait_condition:
          type: Available
          status: "False"
        wait_timeout: 120
