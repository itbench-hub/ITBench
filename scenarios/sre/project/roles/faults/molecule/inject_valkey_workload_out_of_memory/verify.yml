---
- name: Verify that fault injection succeeded
  hosts:
    - localhost
  tasks:
    - name: Retrieve Valkey service
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: valkey
        namespace: valkey-workload-out-of-memory-test
      register: faults_service

    - name: Validate that Valkey service exists
      ansible.builtin.assert:
        that:
          - faults_service.resources | ansible.builtin.length == 1
        fail_msg: Valkey service not found. Fault injection failed.
        success_msg: Valkey service found.
