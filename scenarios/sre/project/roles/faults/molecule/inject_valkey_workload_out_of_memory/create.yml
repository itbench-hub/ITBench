---
- name: Create Kubernetes objects
  hosts:
    - localhost
  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: valkey-workload-out-of-memory-test
        state: present

    - name: Create deployment
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: valkey
            namespace: valkey-workload-out-of-memory-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                "app.kubernetes.io/name": valkey
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": valkey
              spec:
                containers:
                  - name: valkey
                    image: docker.io/valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
                    ports:
                      - containerPort: 6379
                        name: valkey
                    resources:
                      limits:
                        memory: 128Mi
                      requests:
                        memory: 64Mi
        state: present
        wait: true

    - name: Create service
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: valkey
            namespace: valkey-workload-out-of-memory-test
          spec:
            selector:
              "app.kubernetes.io/name": valkey
            ports:
              - protocol: TCP
                port: 6379
                targetPort: 6379
        state: present
