---
- name: Run fault injection test
  hosts:
    - localhost
  tasks:
    - name: Import faults role
      ansible.builtin.import_role:
        name: faults
      vars:
        faults_injection_tasks:
          - id: valkey-workload-out-of-memory
            targets:
              - kubernetes:
                  apiVersion: v1
                  kind: Service
                  name: valkey
                  namespace: valkey-workload-out-of-memory-test
