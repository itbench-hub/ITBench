---
- name: Create Kubernetes objects
  hosts:
    - localhost
  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: insufficient-kubernetes-resource-quota-test
        state: present

    - name: Create deployment
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: compromised-workload
            namespace: insufficient-kubernetes-resource-quota-test
          spec:
            replicas: 2
            selector:
              matchLabels:
                "app.kubernetes.io/name": compromised-workload
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": compromised-workload
              spec:
                containers:
                  - name: server
                    image: registry.access.redhat.com/ubi10/ubi-minimal@sha256:fb2f7f857cc60d88e3fad19da505083a682ca4569d7b55a61f64aaa43641f741
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - "sleep infinity"
                    resources:
                      requests:
                        memory: "512Mi"
                      limits:
                        memory: "512Mi"
        state: present
        wait: true
