---
- name: Create ServiceAccount for prometheus-recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        labels:
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.prometheus_data_recorder.name }}"
        name: "{{ recorders_instances.prometheus_data_recorder.name }}"
        namespace: "{{ recorders_namespaces.data_recorders }}"
    state: present

- name: Bind prometheus-recorder ServiceAccount to cluster-monitoring-view
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        labels:
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.prometheus_data_recorder.name }}"
        name: "{{ recorders_instances.prometheus_data_recorder.name }}-cluster-monitoring-view"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-monitoring-view
      subjects:
        - kind: ServiceAccount
          name: "{{ recorders_instances.prometheus_data_recorder.name }}"
          namespace: "{{ recorders_namespaces.data_recorders }}"
    state: present
  when:
    - recorders_cluster.platform == "openshift"

- name: Create PersistentVolumeClaim for prometheus-recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.prometheus_data_recorder.name }}-records"
        name: "{{ recorders_instances.prometheus_data_recorder.name }}-records"
        namespace: "{{ recorders_namespaces.data_recorders }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        volumeMode: Filesystem
    state: present

- name: Install Kubernetes Job for prometheus-recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          "app.kubernetes.io/component": "{{ recorders_instances.prometheus_data_recorder.name }}"
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.prometheus_data_recorder.name }}-init"
        name: "{{ recorders_instances.prometheus_data_recorder.name }}-init"
        namespace: "{{ recorders_namespaces.data_recorders }}"
      spec:
        template:
          metadata:
            labels:
              "app.kubernetes.io/managed-by": ITBench
              "app.kubernetes.io/name": "{{ recorders_instances.prometheus_data_recorder.name }}"
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.itbench.io/sandbox
                          operator: DoesNotExist
            containers:
              - name: recorder
                image: quay.io/it-bench/prometheus-recorder:1.0.0
                env:
                  - name: PROMETHEUS_ENDPOINT
                    value: "{{ tools_prometheus_endpoint.http }}"
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    memory: 512Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - name: records
                    mountPath: /root/records
            restartPolicy: Never
            securityContext:
              fsGroup: 0
              runAsNonRoot: false
              seccompProfile:
                type: RuntimeDefault
            serviceAccountName: "{{ recorders_instances.prometheus_data_recorder.name }}"
            volumes:
              - name: records
                persistentVolumeClaim:
                  claimName: "{{ recorders_instances.prometheus_data_recorder.name }}-records"
    state: present

- name: Install Kubernetes CronJob for prometheus-recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        labels:
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.prometheus_data_recorder.name }}"
        name: "{{ recorders_instances.prometheus_data_recorder.name }}"
        namespace: "{{ recorders_namespaces.data_recorders }}"
      spec:
        schedule: "* * * * *"
        jobTemplate:
          spec:
            template:
              metadata:
                labels:
                  "app.kubernetes.io/managed-by": ITBench
                  "app.kubernetes.io/name": "{{ recorders_instances.prometheus_data_recorder.name }}"
              spec:
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: node-role.itbench.io/sandbox
                              operator: DoesNotExist
                containers:
                  - name: recorder
                    image: quay.io/it-bench/prometheus-recorder:1.0.0
                    env:
                      - name: PROMETHEUS_ENDPOINT
                        value: "{{ tools_prometheus_endpoint.http }}"
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        memory: 512Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    volumeMounts:
                      - name: records
                        mountPath: /root/records
                restartPolicy: Never
                securityContext:
                  fsGroup: 0
                  runAsNonRoot: false
                  seccompProfile:
                    type: RuntimeDefault
                serviceAccountName: "{{ recorders_instances.prometheus_data_recorder.name }}"
                volumes:
                  - name: records
                    persistentVolumeClaim:
                      claimName: "{{ recorders_instances.prometheus_data_recorder.name }}-records"
    state: present
