---
- name: Delete ClusterRoleBindings for recorders
  kubernetes.core.k8s:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    label_selectors:
      - "app.kubernetes.io/managed-by=ansible"
      - "app.kubernetes.io/part-of=itbench"
      - "itbench.io/recorder"
    state: absent
    wait: true

- name: Delete ClusterRoles for recorders
  kubernetes.core.k8s:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    label_selectors:
      - "app.kubernetes.io/managed-by=ansible"
      - "app.kubernetes.io/part-of=itbench"
      - "itbench.io/recorder"
    state: absent
    wait: true

- name: Delete the namespace
  kubernetes.core.k8s:
    api_version: v1
    delete_all: true
    kind: Namespace
    label_selectors:
      - "itbench.io/recorder"
    state: absent
    wait: true
