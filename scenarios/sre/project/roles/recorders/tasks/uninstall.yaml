---
- name: Retrieve CronJobs
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: CronJob
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    namespace: "{{ recorders_namespaces.data_recorders }}"
  register: recorders_cronjobs

- name: Suspend all CronJobs
  kubernetes.core.k8s:
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: "{{ cronjob.apiVersion }}"
      kind: "{{ cronjob.kind }}"
      metadata:
        name: "{{ cronjob.metadata.name }}"
        namespace: "{{ cronjob.metadata.namespace }}"
      spec:
        suspend: true
    state: patched
  loop: "{{ recorders_cronjobs.resources }}"
  loop_control:
    label: cronjob/{{ cronjob.metadata.name }}
    loop_var: cronjob

- name: Retrieve Jobs
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    namespace: "{{ recorders_namespaces.data_recorders }}"
  register: recorders_jobs

- name: Wait for all jobs to finish running
  kubernetes.core.k8s_info:
    api_version: "{{ job.apiVersion }}"
    kind: "{{ job.kind }}"
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    name: "{{ job.metadata.name }}"
    namespace: "{{ job.metadata.namespace }}"
  loop: "{{ recorders_jobs.resources }}"
  loop_control:
    label: job/{{ job.metadata.name }}
    loop_var: job
  register: recorders_job
  until:
    - (
        recorders_job.resources | ansible.builtin.length == 0
      ) or
      (
        recorders_job.resources[0].status.conditions |
        ansible.builtin.default([]) |
        ansible.builtin.length > 0
      )
  retries: 12
  delay: 30

- name: Import recorder export tasks for ClickHouse
  ansible.builtin.import_tasks:
    file: copy_recorder_files.yaml
  vars:
    export:
      directory: observability_information_from_clickhouse
    recorder: "{{ recorders_instances.clickhouse_data_recorder }}"

- name: Import recorder export tasks for Jaeger
  ansible.builtin.import_tasks:
    file: copy_recorder_files.yaml
  vars:
    export:
      directory: trace_information
    recorder: "{{ recorders_instances.jaeger_data_recorder }}"

- name: Import recorder export tasks for Kubernetes Topology Monitor
  ansible.builtin.import_tasks:
    file: copy_recorder_files.yaml
  vars:
    export:
      directory: topology_information
    recorder: "{{ recorders_instances.kubernetes_topology_monitor_data_recorder }}"

- name: Import recorder export tasks for Prometheus
  ansible.builtin.import_tasks:
    file: copy_recorder_files.yaml
  vars:
    export:
      directory: alerts
    recorder: "{{ recorders_instances.prometheus_data_recorder }}"

- name: Delete the namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ recorders_namespaces.data_recorders }}"
    state: absent
    wait: true
