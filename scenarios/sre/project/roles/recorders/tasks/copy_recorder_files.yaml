---
- name: Copy files from volume
  block:
    - name: Create Pod to export records from {{ recorders_instance_name }}
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Pod
          metadata:
            labels:
              "app.kubernetes.io/component": data-exporter
              "app.kubernetes.io/managed-by": ansible
              "app.kubernetes.io/name": "{{ recorders_instance_name }}-exporter"
              "app.kubernetes.io/part-of": itbench
            name: "{{ recorders_instance_name }}-exporter"
            namespace: "{{ recorders_namespace }}"
          spec:
            containers:
              - args:
                  - -c
                  - "sleep 600"
                command:
                  - /bin/sh
                image: registry.access.redhat.com/ubi10/ubi@sha256:7495bfa53ae7a81a58aeface0bb4858d12741832c542c29dc690d67b183b73b0
                name: exporter
                resources:
                  limits:
                    memory: 100Mi
                  requests:
                    cpu: 10m
                    memory: 50Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - mountPath: /opt/app-root/src/records
                    name: records
            securityContext:
              fsGroup: 1001
              runAsNonRoot: true
              runAsUser: 1001
              seccompProfile:
                type: RuntimeDefault
            volumes:
              - name: records
                persistentVolumeClaim:
                  claimName: "{{ recorders_instance_name }}-records"
        state: present
        wait: true
        wait_condition:
          status: "True"
          type: Ready

    - name: Copy records from pod
      kubernetes.core.k8s_cp:
        local_path: "{{ recorders_export_directory.path }}"
        namespace: "{{ recorders_namespace }}"
        pod: "{{ recorders_instance_name }}-exporter"
        remote_path: /opt/app-root/src/records
        state: from_pod

  always:
    - name: Delete Pod
      kubernetes.core.k8s:
        kubeconfig: "{{ recorders_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: "{{ recorders_instance_name }}-exporter"
            namespace: "{{ recorders_namespace }}"
        state: absent
        wait: true

- name: Copy exported data into local directory
  when:
    - recorders_storage_local is ansible.builtin.defined
  block:
    - name: Create local directory for exported data
      ansible.builtin.file:
        mode: "0755"
        path: |-
          {{
            [
              recorders_storage_local.directory,
              recorders_instance_name
            ] |
            ansible.builtin.path_join
          }}
        state: directory
      register: recorders_local_directory

    - name: Copy exported data into local directory
      ansible.builtin.copy:
        dest: "{{ recorders_local_directory.path }}"
        mode: "0644"
        src: "{{ recorders_export_directory.path }}/"

- name: Copy exported data into S3
  when:
    - recorders_storage_s3 is ansible.builtin.defined
  block:
    - name: Retrieve all files in temporary directory for {{ recorders_instance_name }}
      ansible.builtin.find:
        path: "{{ recorders_export_directory.path }}"
      register: recorders_exported_files

    - name: Create AWS S3 bucket
      amazon.aws.s3_bucket:
        endpoint_url: "{{ recorders_storage_s3.endpoint }}"
        name: "{{ recorders_storage_s3.bucket }}"
        state: present

    - name: Upload exported data to S3 bucket
      amazon.aws.s3_object:
        bucket: "{{ recorders_storage_s3.bucket }}"
        endpoint_url: "{{ recorders_storage_s3.endpoint }}"
        mode: put
        object: |-
          {{
            [
              recorders_storage_s3.directory,
              recorders_instance_name,
              (record.path | ansible.builtin.basename)
            ] |
            ansible.builtin.path_join
          }}
        src: "{{ record.path }}"
      loop: "{{ recorders_exported_files.files }}"
      loop_control:
        label: file/{{ record.path | ansible.builtin.basename }}
        loop_var: record
