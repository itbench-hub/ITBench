---
- name: Create PersistentVolumeClaim for kubernetes-topology-monitor-recorder
  kubernetes.core.k8s:
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          "app.kubernetes.io/component": kubernetes-topology-monitor-recorder
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.kubernetes_topology_monitor_data_recorder.name }}-records"
          "app.kubernetes.io/part-of": data-collection
        name: "{{ recorders_instances.kubernetes_topology_monitor_data_recorder.name }}-records"
        namespace: "{{ recorders_namespaces.data_recorders }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        volumeMode: Filesystem
    state: present

- name: Install Kubernetes Job for kubernetes-topology-monitor-recorder
  kubernetes.core.k8s:
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          "app.kubernetes.io/component": kubernetes-topology-monitor-recorder
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.kubernetes_topology_monitor_data_recorder.name }}"
          "app.kubernetes.io/part-of": data-collection
        name: "{{ recorders_instances.kubernetes_topology_monitor_data_recorder.name ~ recorders_export_phase }}"
        namespace: "{{ recorders_namespaces.data_recorders }}"
      spec:
        template:
          metadata:
            labels:
              "app.kubernetes.io/component": kubernetes-topology-monitor-recorder
              "app.kubernetes.io/managed-by": ITBench
              "app.kubernetes.io/name": "{{ recorders_instances.kubernetes_topology_monitor_data_recorder.name }}"
              "app.kubernetes.io/part-of": data-collection
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.itbench.io/sandbox
                          operator: DoesNotExist
            containers:
              - name: recorder
                image: quay.io/it-bench/kubernetes-topology-monitor-recorder:1.0.0
                env:
                  - name: FILENAME_ANNOTATION
                    value: "{{ file_name_prefixes[recorders_export_phase] }}"
                  - name: KUBERNETES_TOPOLOGY_MONITOR_ENDPOINT
                    value: "{{ tools_kubernetes_topology_monitor_endpoint.http }}"
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    memory: 512Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - name: records
                    mountPath: /root/records
            restartPolicy: Never
            securityContext:
              fsGroup: 0
              runAsNonRoot: false
              seccompProfile:
                type: RuntimeDefault
            volumes:
              - name: records
                persistentVolumeClaim:
                  claimName: "{{ recorders_instances.kubernetes_topology_monitor_data_recorder.name }}-records"
    state: present
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Complete
      status: "True"
  vars:
    file_name_prefixes:
      pre-fault-injection: init
      pre-agent-injection: post_fault_injection
      post-agent-execution: end

- name: Import copy tasks
  ansible.builtin.import_tasks:
    file: copy_recorder_files.yaml
  vars:
    export:
      directory: topology_information
    recorder: "{{ recorders_instances.kubernetes_topology_monitor_data_recorder }}"
