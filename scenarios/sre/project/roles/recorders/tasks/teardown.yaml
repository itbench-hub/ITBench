---
- name: Delete ClusterRoleBindings for topology collector
  kubernetes.core.k8s:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    label_selectors:
      - "itbench.io/record-type=topology"
    state: absent

- name: Delete ClusterRoles for topology collector
  kubernetes.core.k8s:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    label_selectors:
      - "itbench.io/record-type=topology"
    state: absent

- name: Delete the namespace
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ recorders_namespaces.data_recorders }}"
    state: absent
    wait: true
