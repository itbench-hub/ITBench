---
- name: Create ServiceAccount for Prometheus recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        labels:
          "app.kubernetes.io/component": data-recorder
          "app.kubernetes.io/managed-by": ansible
          "app.kubernetes.io/name": itbench-prometheus-alert-recorder
          "app.kubernetes.io/part-of": itbench
        name: itbench-prometheus-alert-recorder
        namespace: "{{ recorders_namespace }}"
    state: present

- name: Create ClusterRoleBinding for Prometheus recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        labels:
          "app.kubernetes.io/component": data-recorder
          "app.kubernetes.io/managed-by": ansible
          "app.kubernetes.io/name": "{{ recorders_instance_prometheus_name }}-recorder"
          "app.kubernetes.io/part-of": itbench
          "itbench.io/recorder": ""
        name: "{{ recorders_instance_prometheus_name }}-recorder"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: monitoring-alertmanager-api-reader
      subjects:
        - kind: ServiceAccount
          name: itbench-prometheus-alert-recorder
          namespace: "{{ recorders_namespace }}"
    state: present
  when:
    - recorders_cluster.platform == "openshift"

- name: Create PersistentVolumeClaim for Prometheus Recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          "app.kubernetes.io/component": data-recorder
          "app.kubernetes.io/managed-by": ansible
          "app.kubernetes.io/name": "{{ recorders_instance_prometheus_name }}-records"
          "app.kubernetes.io/part-of": itbench
        name: "{{ recorders_instance_prometheus_name }}-records"
        namespace: "{{ recorders_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        volumeMode: Filesystem
    state: present

- name: Install Kubernetes Job for Prometheus Recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          "app.kubernetes.io/component": data-recorder
          "app.kubernetes.io/managed-by": ansible
          "app.kubernetes.io/name": itbench-prometheus-alert-recorder
          "app.kubernetes.io/part-of": itbench
        name: itbench-prometheus-alert-recorder
        namespace: "{{ recorders_namespace }}"
      spec:
        template:
          metadata:
            labels:
              "app.kubernetes.io/component": data-recorder
              "app.kubernetes.io/managed-by": ansible
              "app.kubernetes.io/name": itbench-prometheus-alert-recorder
              "app.kubernetes.io/part-of": itbench
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.itbench.io/sandbox
                          operator: DoesNotExist
            containers:
              - env:
                  - name: OUTPUT_DIR
                    value: /records
                  - name: PROMETHEUS_ENDPOINT
                    value: "{{ tools_prometheus_endpoint.http }}"
                  - name: RECORDING_START_TIMESTAMP
                    value: "{{ '%Y-%m-%dT%H:%M:%SZ' | ansible.builtin.strftime(now(utc=true).timestamp() - (recorders_duration_minutes * 60)) }}"
                  - name: RECORDING_END_TIMESTAMP
                    value: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
                  - name: RECORDING_INTERVAL_SECONDS
                    value: "60"
                image: quay.io/it-bench/prometheus-recorder:1.0.0@sha256:57b130b1c89f0f000235aba279cfda0d064aec03d225ef6d5a6a0ad06eb0aad4
                name: recorder
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - mountPath: /records
                    name: records
            restartPolicy: Never
            securityContext:
              fsGroup: 1001
              runAsNonRoot: true
              runAsUser: 1001
              seccompProfile:
                type: RuntimeDefault
            serviceAccountName: itbench-prometheus-alert-recorder
            volumes:
              - name: records
                persistentVolumeClaim:
                  claimName: "{{ recorders_instance_prometheus_name }}-records"
    state: present
    wait: true
    wait_condition:
      status: "True"
      type: Complete
    wait_timeout: 300

- name: Export Prometheus records
  block:
    - name: Create temporary directory for Prometheus records
      ansible.builtin.tempfile:
        prefix: prometheus
        state: directory
      register: recorders_export_directory

    - name: Import copy tasks
      ansible.builtin.import_tasks:
        file: copy_recorder_files.yaml
      vars:
        recorders_instance_name: itbench-prometheus-alert-recorder

  always:
    - name: Delete temporary directory for Prometheus records
      ansible.builtin.file:
        path: "{{ recorders_export_directory.path }}"
        state: absent
