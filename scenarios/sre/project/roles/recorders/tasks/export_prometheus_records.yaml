---
- name: Add Prometheus Bearer Token
  when:
    - recorders_cluster.platform == "openshift"
  block:
    - name: Import Prometheus credential variable setting tasks
      ansible.builtin.import_role:
        name: tools
        tasks_from: set_credentials_prometheus
      vars:
        tools_cluster:
          kubeconfig: "{{ recorders_cluster.kubeconfig }}"
          platform: "{{ recorders_cluster.platform }}"

    - name: Create Secret for Prometheus Bearer Token
      kubernetes.core.k8s:
        kubeconfig: "{{ recorders_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ recorders_instances.prometheus_data_recorder.name }}-token"
            namespace: "{{ recorders_namespaces.data_recorders }}"
          data:
            token: "{{ tools_prometheus_bearer_token }}"
        state: present

- name: Create PersistentVolumeClaim for Prometheus Recorder
  kubernetes.core.k8s:
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          "app.kubernetes.io/component": prometheus-recorder
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.prometheus_data_recorder.name }}-records"
          "app.kubernetes.io/part-of": data-collection
        name: "{{ recorders_instances.prometheus_data_recorder.name }}-records"
        namespace: "{{ recorders_namespaces.data_recorders }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        volumeMode: Filesystem
    state: present

- name: Install Kubernetes Job for Prometheus Recorder
  kubernetes.core.k8s:
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          "app.kubernetes.io/component": prometheus-recorder
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.prometheus_data_recorder.name }}"
          "app.kubernetes.io/part-of": data-collection
        name: "{{ recorders_instances.prometheus_data_recorder.name }}"
        namespace: "{{ recorders_namespaces.data_recorders }}"
      spec:
        template:
          metadata:
            labels:
              "app.kubernetes.io/component": prometheus-recorder
              "app.kubernetes.io/managed-by": ITBench
              "app.kubernetes.io/name": "{{ recorders_instances.prometheus_data_recorder.name }}"
              "app.kubernetes.io/part-of": data-collection
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.itbench.io/sandbox
                          operator: DoesNotExist
            containers:
              - name: recorder
                image: quay.io/it-bench/prometheus-recorder:1.0.0@sha256:d9d7a866b41a8d20df3da966f92bb34abeb69084aa941d217a39cc6e0928289b
                env:
                  - name: PROMETHEUS_ENDPOINT
                    value: "{{ tools_prometheus_endpoint.http }}"
                  - name: PROMETHEUS_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: "{{ recorders_instances.prometheus_data_recorder.name }}-token"
                        key: token
                        optional: true
                  - name: RECORDING_START_TIMESTAMP
                    valueFrom:
                      configMapKeyRef:
                        name: "{{ recorders_instances.prometheus_data_recorder.name }}-config"
                        key: start
                  - name: RECORDING_END_TIMESTAMP
                    value: "{{ recorders_timestamps.end }}"
                  - name: RECORDING_INTERVAL_SECONDS
                    value: "60"
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    memory: 512Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - name: records
                    mountPath: /root/records
            restartPolicy: Never
            securityContext:
              fsGroup: 0
              runAsNonRoot: false
              seccompProfile:
                type: RuntimeDefault
            volumes:
              - name: records
                persistentVolumeClaim:
                  claimName: "{{ recorders_instances.prometheus_data_recorder.name }}-records"
    state: present
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Complete
      status: "True"
