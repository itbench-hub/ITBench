---
- name: Create PersistentVolumeClaim for jaeger-recorder
  kubernetes.core.k8s:
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.jaeger_data_recorder.name }}-records"
        name: "{{ recorders_instances.jaeger_data_recorder.name }}-records"
        namespace: "{{ recorders_namespaces.data_recorders }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        volumeMode: Filesystem
    state: present

- name: Install Kubernetes StatefulSet for jaeger-recorder
  kubernetes.core.k8s:
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        labels:
          "app.kubernetes.io/component": recorder
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.jaeger_data_recorder.name }}"
          "app.kubernetes.io/part-of": data-collection
        name: "{{ recorders_instances.jaeger_data_recorder.name }}"
        namespace: "{{ recorders_namespaces.data_recorders }}"
      spec:
        replicas: 1
        serviceName: "{{ recorders_instances.jaeger_data_recorder.name }}"
        selector:
          matchLabels:
            "app.kubernetes.io/component": recorder
            "app.kubernetes.io/managed-by": ITBench
            "app.kubernetes.io/name": "{{ recorders_instances.jaeger_data_recorder.name }}"
            "app.kubernetes.io/part-of": data-collection
        template:
          metadata:
            labels:
              "app.kubernetes.io/component": recorder
              "app.kubernetes.io/managed-by": ITBench
              "app.kubernetes.io/name": "{{ recorders_instances.jaeger_data_recorder.name }}"
              "app.kubernetes.io/part-of": data-collection
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.itbench.io/sandbox
                          operator: DoesNotExist
            containers:
              - name: recorder
                image: quay.io/it-bench/jaeger-recorder:1.0.0@sha256:4b2485cacaa17b0581cb3ec7de23482f3d8ce5f0650e87cedce3a297bf46abce
                env:
                  - name: JAEGER_ENDPOINT
                    value: "{{ tools_jaeger_endpoint.querier.grpc }}"
                  - name: INTERVAL_SECONDS
                    value: "300"
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    memory: 512Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - name: records
                    mountPath: /root/records
            securityContext:
              fsGroup: 0
              runAsNonRoot: false
              seccompProfile:
                type: RuntimeDefault
            volumes:
              - name: records
                persistentVolumeClaim:
                  claimName: "{{ recorders_instances.jaeger_data_recorder.name }}-records"
    state: present
