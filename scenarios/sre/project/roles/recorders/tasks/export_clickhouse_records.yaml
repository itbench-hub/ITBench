---
- name: Import variable setting tasks
  ansible.builtin.import_role:
    name: tools
    tasks_from: set_credentials_clickhouse
  vars:
    tools_cluster:
      kubeconfig: "{{ recorders_cluster.kubeconfig }}"

- name: Create PersistentVolumeClaim for Clickhouse Recorder
  kubernetes.core.k8s:
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          "app.kubernetes.io/component": clickhouse-recorder
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.clickhouse_data_recorder.name }}-records"
          "app.kubernetes.io/part-of": data-collection
        name: "{{ recorders_instances.clickhouse_data_recorder.name }}-records"
        namespace: "{{ recorders_namespaces.data_recorders }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 3Gi
        volumeMode: Filesystem
    state: present

- name: Install Kubernetes Job for Clickhouse Recorder
  kubernetes.core.k8s:
    kubeconfig: "{{ recorders_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          "app.kubernetes.io/component": clickhouse-recorder
          "app.kubernetes.io/managed-by": ITBench
          "app.kubernetes.io/name": "{{ recorders_instances.clickhouse_data_recorder.name }}"
          "app.kubernetes.io/part-of": data-collection
        name: "{{ recorders_instances.clickhouse_data_recorder.name }}"
        namespace: "{{ recorders_namespaces.data_recorders }}"
      spec:
        template:
          metadata:
            labels:
              "app.kubernetes.io/component": clickhouse-recorder
              "app.kubernetes.io/managed-by": ITBench
              "app.kubernetes.io/name": "{{ recorders_instances.clickhouse_data_recorder.name }}"
              "app.kubernetes.io/part-of": data-collection
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.itbench.io/sandbox
                          operator: DoesNotExist
            containers:
              - name: recorder
                image: quay.io/it-bench/clickhouse-recorder:1.0.0@sha256:b863526972abd0cf04065a0014eba69ef7974b9837384a3739ff62618e76fa16
                env:
                  - name: CLICKHOUSE_HOST
                    value: "{{ tools_clickhouse_endpoint.tcp }}"
                  - name: CLICKHOUSE_USERNAME
                    value: "{{ tools_clickhouse_username }}"
                  - name: CLICKHOUSE_PASSWORD
                    value: "{{ tools_clickhouse_password }}"
                  - name: RECORDING_START_TIMESTAMP
                    valueFrom:
                      configMapKeyRef:
                        name: "{{ recorders_instances.clickhouse_data_recorder.name }}-config"
                        key: start
                  - name: RECORDING_END_TIMESTAMP
                    value: "{{ recorders_timestamps.end }}"
                  - name: RECORDING_INTERVAL_SECONDS
                    value: "300"
                resources:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    memory: 1024Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - name: records
                    mountPath: /root/records
            restartPolicy: Never
            securityContext:
              fsGroup: 0
              runAsNonRoot: false
              seccompProfile:
                type: RuntimeDefault
            volumes:
              - name: records
                persistentVolumeClaim:
                  claimName: "{{ recorders_instances.clickhouse_data_recorder.name }}-records"
    state: present
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Complete
      status: "True"

- name: Import copy tasks
  ansible.builtin.import_tasks:
    file: copy_recorder_files.yaml
  vars:
    export:
      directory: observability_information_from_clickhouse
    recorder: "{{ recorders_instances.clickhouse_data_recorder }}"
