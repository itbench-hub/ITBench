---
argument_specs:
  main:
    author:
      - Gerard Vanloo
    options:
      recorders_cluster:
        required: true
        type: dict
        options:
          kubeconfig:
            required: true
            type: str
          platform:
            choices:
              - kubernetes
              - openshift
            required: true
            type: str
      recorders_export_phase:
        choices:
          - pre-fault-injection
          - pre-agent-injection
          - post-agent-execution
        required: false
        type: str
      recorders_export_type:
        choices:
          - full
          - telemetry-only
          - topology-only
        required: false
        type: str
      recorders_storage_local:
        required: false
        type: dict
        options:
          directory:
            required: true
            type: str
      recorders_storage_s3:
        required: false
        type: dict
        options:
          bucket:
            required: true
            type: str
          directory:
            required: true
            type: str
          endpoint:
            required: true
            type: str
