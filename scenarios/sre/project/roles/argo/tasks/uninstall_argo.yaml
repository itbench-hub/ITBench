---
- name: Uninstall Argo Events Helm release
  kubernetes.core.helm:
    release_name: "{{ argo_helm_release_argo_events }}"
    release_namespace: "{{ argo_namespace }}"
    release_state: absent
    wait: true

- name: Uninstall Argo Workflows Helm release
  kubernetes.core.helm:
    release_name: "{{ argo_helm_release_argo_workflows }}"
    release_namespace: "{{ argo_namespace }}"
    release_state: absent
    wait: true

- name: Delete Argo namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ argo_namespace }}"
    state: absent
    wait: true

- name: Retrieve all CustomResourceDefinitions
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
  register: argo_custom_resource_definitions

- name: Uninstall Argo Custom Resource Definitions
  kubernetes.core.k8s:
    resource_definition: "{{ definitions }}"
    state: absent
    wait: true
  vars:
    _regex: "{{ '(' ~ ('argoproj.io' | ansible.builtin.regex_escape) ~ ')$' }}"
    definitions: >-
      {{
        argo_custom_resource_definitions.resources |
        ansible.builtin.selectattr("spec.group", "search", _regex)
      }}
  when:
    - definitions | ansible.builtin.length > 0
