---
- name: Create Secrets for environment cluster kubeconfigs
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Secret
      metadata:
        labels:
          "itbench.io/ansible-role": argo
          "itbench.io/benchmark-role": environment
          "itbench.io/layer": orchestration
        name: "environment-{{ kubeconfig_index + 1 }}-kubeconfig"
        namespace: "{{ argo_namespace }}"
      stringData:
        kubeconfig: "{{ lookup('ansible.builtin.file', cluster_kubeconfig) }}"
      type: Opaque
    state: present
  loop: "{{ argo_environment_kubeconfigs | ansible.builtin.default([]) }}"
  loop_control:
    index_var: kubeconfig_index
    label: cluster/{{ kubeconfig_index + 1 }}
    loop_var: cluster_kubeconfig
  no_log: true
  when:
    - argo_environment_kubeconfigs is ansible.builtin.defined
    - argo_environment_kubeconfigs | ansible.builtin.length > 0

- name: Create Secret for AWS (S3) credentials
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Secret
      metadata:
        labels:
          "itbench.io/ansible-role": argo
          "itbench.io/benchmark-role": storage
          "itbench.io/layer": orchestration
        name: aws-credentials
        namespace: "{{ argo_namespace }}"
      stringData:
        ITBENCH_S3_PASSWORD: "{{ aws_secret_access_key | ansible.builtin.default('') }}" # pragma: allowlist secret
        ITBENCH_S3_USERNAME: "{{ aws_access_key_id | ansible.builtin.default('') }}"
      type: Opaque
    state: present
  no_log: true
  when:
    - aws_access_key_id is ansible.builtin.defined
    - aws_secret_access_key is ansible.builtin.defined
