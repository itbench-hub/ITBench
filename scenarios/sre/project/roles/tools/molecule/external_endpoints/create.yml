---
- name: Install SRE tools
  hosts:
    - localhost
  tasks:
    - name: Import cluster role to set platform and provider variables
      ansible.builtin.import_role:
        name: cluster

    - name: Import tools role
      ansible.builtin.import_role:
        name: tools
        tasks_from: install.yaml
      vars:
        tools_cluster:
          platform: "{{ cluster_platform }}"
          provider: "{{ cluster_provider }}"
        tools_configuration:
          finops:
            enabled: true
          sre:
            enabled: true
