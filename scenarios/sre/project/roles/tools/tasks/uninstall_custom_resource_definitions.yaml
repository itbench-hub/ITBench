---
- name: Uninstall Prometheus Operator Custom Resource Definitions
  kubernetes.core.helm:
    release_name: "{{ tools_helm_release_prometheus_operator_crds }}"
    release_namespace: "{{ tools_namespace_itbench_observability }}"
    release_state: absent
    wait: true
  when:
    - tools_cluster.platform == "kubernetes"

- name: Retrieve all CustomResourceDefinitions
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
  register: tools_custom_resource_definitions

- name: Uninstall CustomResourceDefinitions for ITBench resources
  kubernetes.core.k8s:
    resource_definition: "{{ definitions }}"
    state: absent
    wait: true
  vars:
    _group_kubernetes:
      - "cert-manager.io"
      - "gateway.networking.k8s.io"
      - "gateway.nginx.org"
      - "monitoring.coreos.com"
      - "opentelemetry.io"
    _group_universal:
      - "altinity.com"
      - "istio.io"
      - "kyverno.io"
      - "wgpolicyk8s.io"
    _regex: >-
      {{
        "(" ~
        (
          (tools_cluster.platform == "kubernetes") |
          ansible.builtin.ternary(
            (_group_kubernetes + _group_universal),
            _group_universal
          ) |
          map("ansible.builtin.regex_escape") |
          ansible.builtin.join("|")
        ) ~
        ")$"
      }}
    definitions: >-
      {{
        tools_custom_resource_definitions.resources |
        ansible.builtin.selectattr("spec.group", "search", _regex)
      }}
  when:
    - definitions | ansible.builtin.length > 0
