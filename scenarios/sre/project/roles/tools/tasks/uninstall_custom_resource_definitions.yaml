---
- name: Retrieve all CustomResourceDefinitions
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
  register: tools_custom_resource_definitions

- name: Uninstall CustomResourceDefinitions for ITBench resources
  kubernetes.core.k8s:
    resource_definition: "{{ definitions }}"
    state: absent
    wait: true
  vars:
    definitions: >-
      {{
        tools_custom_resource_definitions.resources |
        ansible.builtin.selectattr(
          "spec.group",
          "search",
          "(^|\.)(altinity\.com|istio\.io|kyverno\.io|wgpolicyk8s\.io)$"
        )
      }}
  when:
    - definitions | ansible.builtin.length > 0

- name: Remove CustomResourceDefinitions not managed by OpenShift
  when:
    - tools_cluster.platform != "openshift"
  block:
    - name: Uninstall Prometheus Operator Custom Resource Definitions
      kubernetes.core.helm:
        release_name: "{{ tools_helm_release_prometheus_operator_crds }}"
        release_namespace: "{{ tools_namespace_itbench_observability }}"
        release_state: absent
        wait: true

    - name: Uninstall CustomResourceDefinitions for ITBench resources
      kubernetes.core.k8s:
        resource_definition: "{{ definitions }}"
        state: absent
        wait: true
      vars:
        definitions: >-
          {{
            tools_custom_resource_definitions.resources |
            ansible.builtin.selectattr(
              "spec.group",
              "search",
              "(^|\.)(gateway\.networking\.k8s\.io|gateway\.nginx\.org|opentelemetry\.io|cert-manager\.io|monitoring\.coreos\.com)$"
            )
          }}
      when:
        - definitions | ansible.builtin.length > 0
