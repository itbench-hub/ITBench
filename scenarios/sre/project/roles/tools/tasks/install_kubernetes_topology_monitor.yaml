---
- name: Create temporary directory for Git checkout
  ansible.builtin.tempfile:
    prefix: topology_monitor
    state: directory
  register: tools_temporary_directory

- name: Checkout Kubernetes Topology Monitor repository using Git
  ansible.builtin.git:
    depth: 1
    dest: "{{ tools_temporary_directory.path }}"
    repo: "{{ tools_sources.kubernetes_topology_monitor.git.repository }}"
    version: "{{ tools_sources.kubernetes_topology_monitor.git.branch }}"

- name: Create Namespace for Kubernetes Topology Monitor
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        labels:
          "itbench.io/gateway-access": shared
        name: "{{ tools_releases.kubernetes_topology_monitor.namespace }}"
    state: present
    wait: true

- name: Install Kubernetes Topology Monitor
  kubernetes.core.helm:
    chart_ref: "{{ tools_temporary_directory.path }}/scenarios/sre/tools/kubernetes-topology-monitor/charts/kubernetes-topology-monitor"
    release_name: "{{ tools_releases.kubernetes_topology_monitor.name }}"
    release_namespace: "{{ tools_releases.kubernetes_topology_monitor.namespace }}"
    release_state: present
    timeout: 10m0s
    wait: true

- name: Create HTTPRoute for Kubernetes Topology Monitor
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: "{{ tools_releases.kubernetes_topology_monitor.name }}"
        namespace: "{{ tools_releases.kubernetes_topology_monitor.namespace }}"
      spec:
        parentRefs:
          - name: "{{ tools_kubernetes_gateways.istio.name }}"
            namespace: "{{ tools_kubernetes_gateways.istio.namespace }}"
        rules:
          - backendRefs:
              - name: topology-monitor-svc
                port: 8080
            matches:
              - path:
                  type: PathPrefix
                  value: /topology/
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  add: "{{ tools_response_headers.http_route }}"
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
    state: present
  when:
    - tools_cluster.platform == "kubernetes"

- name: Create Route for Kubernetes Topology Monitor
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: "{{ tools_releases.kubernetes_topology_monitor.name }}"
        namespace: "{{ tools_releases.kubernetes_topology_monitor.namespace }}"
      spec:
        httpHeaders:
          actions:
            response: "{{ tools_response_headers.route }}"
        port:
          targetPort: 8080
        to:
          kind: Service
          name: topology-monitor-svc
    state: present
  when:
    - tools_cluster.platform == "openshift"

- name: Delete the temporary directory
  ansible.builtin.file:
    path: "{{ tools_temporary_directory.path }}"
    state: absent
