---
- name: Install Alinity Clickhouse Operator
  kubernetes.core.helm:
    chart_ref: "oci://ghcr.io/altinity/clickhouse-operator-helm-chart/altinity-clickhouse-operator"
    chart_version: "0.27.4"
    release_name: "{{ tools_helm_release_alinity_clickhouse_operator }}"
    release_namespace: "{{ tools_namespace_itbench_observability }}"
    release_state: present
    release_values:
      serviceMonitor:
        enabled: true
    timeout: 10m0s
    wait: true

- name: Create Secrets for Clickhouse users
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "user-{{ clickhouse_user.name }}-credentials"
        namespace: "{{ tools_namespace_itbench_observability }}"
      stringData:
        CLICKHOUSE_PASSWORD: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=32') }}" # pragma: allowlist secret
        CLICKHOUSE_USER: "{{ clickhouse_user.name }}"
      type: Opaque
    state: present
  loop:
    - name: admin
    - name: agent
    - name: ingest
    - name: jaeger
    - name: recorder
    - name: topology
  loop_control:
    label: secret/user-{{ clickhouse_user.name }}-credentials
    loop_var: clickhouse_user

- name: Create Clickhouse Installation
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: clickhouse.altinity.com/v1
      kind: ClickHouseInstallation
      metadata:
        labels:
          "app.kubernetes.io/name": clickhouse
          app.kubernetes.io/version: 26.3.33.10001
        name: main
        namespace: "{{ tools_namespace_itbench_observability }}"
      spec:
        configuration:
          clusters:
            - layout:
                replicasCount: 1
                shardsCount: 1
              name: main
          profiles:
            default/http_connection_timeout: 30
          settings:
            prometheus/asynchronous_metrics: "true"
            prometheus/endpoint: "/metrics"
            prometheus/errors: "true"
            prometheus/events: "true"
            prometheus/metrics: "true"
          users:
            admin/access_management: 1
            admin/named_collection_control: 1
            admin/networks/ip: 0.0.0.0/0
            admin/password:
              valueFrom:
                secretKeyRef:
                  key: CLICKHOUSE_PASSWORD
                  name: user-admin-credentials
            admin/show_named_collections: 1
            admin/show_named_collections_secrets: 1
            agent/grants/query:
              - GRANT SELECT ON jaeger.spans
              - GRANT SELECT ON kubernetes.events
              - GRANT SELECT ON kubernetes.infrastructure
              - GRANT SELECT ON kubernetes.topology
              - GRANT SELECT ON kubernetes.topology_graph
              - GRANT SELECT ON opentelemetry_demo.logs
            agent/networks/ip: 0.0.0.0/0
            agent/password:
              valueFrom:
                secretKeyRef:
                  key: CLICKHOUSE_PASSWORD
                  name: user-agent-credentials
            ingest/grants/query:
              - GRANT CREATE, INSERT ON istio.*
              - GRANT CREATE, INSERT ON kubernetes.*
              - GRANT CREATE, INSERT ON opentelemetry_demo.*
            ingest/networks/ip: 0.0.0.0/0
            ingest/password:
              valueFrom:
                secretKeyRef:
                  key: CLICKHOUSE_PASSWORD
                  name: user-ingest-credentials
            jaeger/grants/query:
              - GRANT ALL ON jaeger.*
            jaeger/networks/ip: 0.0.0.0/0
            jaeger/password:
              valueFrom:
                secretKeyRef:
                  key: CLICKHOUSE_PASSWORD
                  name: user-jaeger-credentials
            recorder/grants/query:
              - GRANT SELECT ON jaeger.*
              - GRANT SELECT ON kubernetes.*
              - GRANT SELECT ON opentelemetry_demo.*
            recorder/networks/ip: 0.0.0.0/0
            recorder/password:
              valueFrom:
                secretKeyRef:
                  key: CLICKHOUSE_PASSWORD
                  name: user-recorder-credentials
            topology/grants/query:
              - GRANT CREATE, INSERT, SELECT ON kubernetes.*
            topology/networks/ip: 0.0.0.0/0
            topology/password:
              valueFrom:
                secretKeyRef:
                  key: CLICKHOUSE_PASSWORD
                  name: user-topology-credentials
        defaults:
          templates:
            dataVolumeClaimTemplate: data-volume-template
            podTemplate: pod-template
            serviceTemplate: service-template
        templates:
          podTemplates:
            - metadata:
                labels:
                  "app.kubernetes.io/name": clickhouse
                  app.kubernetes.io/version: 26.3.33.10001
              name: pod-template
              spec:
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: node-role.itbench.io/sandbox
                              operator: DoesNotExist
                containers:
                  - image: altinity/clickhouse-server:26.3.33.10001.altinitystable@sha256:5bd62b50208bae1d065de7685b0b0a1812f267d1a179aabb15f97c78aed47d1a
                    imagePullPolicy: IfNotPresent
                    name: clickhouse
                    ports:
                      - containerPort: 8123
                        name: http
                      - containerPort: 9000
                        name: tcp
                    resources:
                      limits:
                        memory: 6Gi
                      requests:
                        cpu: 100m
                        memory: 2Gi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                securityContext:
                  fsGroup: 101
                  runAsGroup: 101
                  runAsNonRoot: true
                  runAsUser: 101
                  seccompProfile:
                    type: RuntimeDefault
          serviceTemplates:
            - metadata:
                labels:
                  "app.kubernetes.io/name": clickhouse
                  app.kubernetes.io/version: 26.3.33.10001
              name: service-template
              spec:
                ports:
                  - name: http
                    port: 8123
                    targetPort: 8123
                  - name: tcp
                    port: 9000
                    targetPort: 9000
                selector:
                  "app.kubernetes.io/name": clickhouse
                type: ClusterIP
          volumeClaimTemplates:
            - name: data-volume-template
              reclaimPolicy: Retain
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Gi
    state: present

- name: Wait for Clickhouse installation to complete
  delay: 30
  kubernetes.core.k8s_info:
    api_version: clickhouse.altinity.com/v1
    kind: ClickHouseInstallation
    name: main
    namespace: "{{ tools_namespace_itbench_observability }}"
  register: tools_chi
  retries: 10
  until:
    - tools_chi.resources[0].status is ansible.builtin.defined
    - tools_chi.resources[0].status.status is ansible.builtin.defined
    - tools_chi.resources[0].status.status == 'Completed'

- name: Create Job for Clickhouse database initialization
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          "app.kubernetes.io/name": clickhouse-init
        name: clickhouse-init
        namespace: "{{ tools_namespace_itbench_observability }}"
      spec:
        backoffLimit: 5
        template:
          metadata:
            labels:
              "app.kubernetes.io/name": clickhouse-init
          spec:
            containers:
              - args:
                  - >-
                    clickhouse-client
                    --host "$CLICKHOUSE_HOST"
                    --user "$CLICKHOUSE_USER"
                    --password "$CLICKHOUSE_PASSWORD"
                    --multiquery
                    --query "
                      CREATE DATABASE IF NOT EXISTS jaeger;
                      CREATE DATABASE IF NOT EXISTS istio;
                      CREATE DATABASE IF NOT EXISTS kubernetes;
                      CREATE DATABASE IF NOT EXISTS opentelemetry_demo;
                    "
                command:
                  - /bin/sh
                  - -c
                env:
                  - name: CLICKHOUSE_HOST
                    value: clickhouse-main
                  - name: CLICKHOUSE_USER
                    valueFrom:
                      secretKeyRef:
                        key: CLICKHOUSE_USER
                        name: user-admin-credentials
                  - name: CLICKHOUSE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        key: CLICKHOUSE_PASSWORD
                        name: user-admin-credentials
                image: altinity/clickhouse-server:26.3.33.10001.altinitystable@sha256:5bd62b50208bae1d065de7685b0b0a1812f267d1a179aabb15f97c78aed47d1a
                imagePullPolicy: IfNotPresent
                name: init
                resources:
                  limits:
                    memory: 256Mi
                  requests:
                    cpu: 50m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
            restartPolicy: Never
            securityContext:
              runAsGroup: 101
              runAsNonRoot: true
              runAsUser: 101
              seccompProfile:
                type: RuntimeDefault
    state: present
    wait: true
    wait_condition:
      status: "True"
      type: Complete
    wait_timeout: 600

- name: Create ServiceMonitor for Clickhouse Installation
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: main
        namespace: "{{ tools_namespace_itbench_observability }}"
      spec:
        endpoints:
          - interval: 30s
            port: http
        selector:
          matchLabels:
            "app.kubernetes.io/name": clickhouse
    state: present

- name: Create HTTPRoute for Clickhouse
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: clickhouse
        namespace: "{{ tools_namespace_itbench_observability }}"
      spec:
        parentRefs:
          - name: "{{ tools_gateway }}"
            namespace: "{{ tools_namespace_itbench_kubernetes_gateway }}"
        rules:
          - backendRefs:
              - name: clickhouse-main
                port: 8123
            filters:
              - responseHeaderModifier:
                  add: "{{ tools_response_headers_http }}"
                type: ResponseHeaderModifier
              - type: URLRewrite
                urlRewrite:
                  path:
                    replacePrefixMatch: /
                    type: ReplacePrefixMatch
            matches:
              - path:
                  type: PathPrefix
                  value: /observability/clickhouse/
    state: present
