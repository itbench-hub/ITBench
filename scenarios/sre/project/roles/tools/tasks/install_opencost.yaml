---
- name: Create ClusterRoleBinding for OpenCost
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": infrastructure
        name: opencost-prometheus
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ 'monitoring-alertmanager-api-reader' if tools_cluster.platform == 'openshift' else 'monitoring-prometheus-api-reader' }}"
      subjects:
        - kind: ServiceAccount
          name: opencost
          namespace: "{{ tools_namespace_opencost }}"
    state: present

- name: Install OpenCost
  kubernetes.core.helm:
    chart_ref: "oci://ghcr.io/opencost/charts/opencost"
    chart_version: "2.5.34"
    release_name: "{{ tools_helm_release_opencost }}"
    release_namespace: "{{ tools_namespace_opencost }}"
    release_state: present
    release_values:
      opencost:
        customPricing:
          costModel:
            CPU: 10.00
            GPU: 50.00
            RAM: 5.00
            description: Modified pricing configuration.
            internetNetworkEgress: 1.00
            regionNetworkEgress: 1.00
            spotCPU: 7.50
            spotRAM: 2.50
            storage: 2.50
            zoneNetworkEgress: 1.00
          createConfigmap: true
          enabled: true
          provider: custom
        exporter:
          extraEnv:
            USE_CUSTOM_PROVIDER: true
        metrics:
          serviceMonitor:
            enabled: true
        mcp:
          httpRoute:
            enabled: true
            parentRefs:
              - name: "{{ tools_itbench_gateway_kubernetes }}"
                namespace: "{{ tools_namespace_kubernetes_gateway_system }}"
            rules:
              - backendRefs:
                  - name: ""
                filters:
                  - responseHeaderModifier:
                      add: "{{ tools_response_headers_http }}"
                    type: ResponseHeaderModifier
                matches:
                  - path:
                      type: PathPrefix
                      value: /mcp/opencost
        platforms:
          openshift:
            enabled: "{{ tools_cluster.platform == 'openshift' }}"
        prometheus:
          insecureSkipVerify: true
          internal:
            enabled: true
            namespaceName: >-
              {{
                (tools_cluster.platform == "openshift") |
                ansible.builtin.ternary(
                  tools_openshift_namespace_monitoring,
                  tools_itbench_namespace_observability
                )
              }}
            port: >-
              {{
                (tools_cluster.platform == "openshift") |
                ansible.builtin.ternary(
                  tools_openshift_prometheus_port,
                  tools_itbench_prometheus_proxy_port
                )
              }}
            scheme: https
            serviceName: >-
              {{
                (tools_cluster.platform == "openshift") |
                ansible.builtin.ternary(
                  tools_openshift_prometheus,
                  tools_helm_release_kube_prometheus_stack ~ "-prometheus"
                )
              }}
          kubeRBACProxy: true
        thanos:
          enabled: "{{ tools_cluster.platform == 'openshift' }}"
          internal:
            namespaceName: "{{ tools_openshift_namespace_monitoring }}"
            port: 9091
            scheme: https
            serviceName: "{{ tools_openshift_thanos_querier }}"
    timeout: 10m0s
    wait: true

- name: Create PrometheusRules
  kubernetes.core.k8s:
    state: present
    template: templates/kubernetes/opencost/prometheusrules.j2
