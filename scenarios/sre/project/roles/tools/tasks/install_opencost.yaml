---
- name: Create ServiceAccount for OpenCost
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        labels:
          "app.kubernetes.io/component": opencost
          "app.kubernetes.io/managed-by": ansible
          "app.kubernetes.io/name": opencost
          "app.kubernetes.io/part-of": opencost
        name: opencost
        namespace: "{{ tools_namespace_itbench_observability }}"
    state: present

- name: Create ClusterRoleBinding for Prometheus recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        labels:
          "app.kubernetes.io/component": opencost
          "app.kubernetes.io/managed-by": ansible
          "app.kubernetes.io/name": opencost
          "app.kubernetes.io/part-of": opencost
          "itbench.io/layer": infrastructure
        name: opencost
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: monitoring-alertmanager-api-reader
      subjects:
        - kind: ServiceAccount
          name: opencost
          namespace: "{{ tools_namespace_itbench_observability }}"
    state: present
  when:
    - tools_cluster.platform == "openshift"

- name: Import Prometheus endpoint variable setting tasks
  ansible.builtin.import_tasks:
    file: set_internal_endpoints_prometheus.yaml
  when:
    - tools_prometheus_endpoint.http is ansible.builtin.undefined

- name: Install OpenCost
  kubernetes.core.helm:
    chart_ref: "oci://ghcr.io/opencost/charts/opencost"
    chart_version: "2.5.33"
    release_name: "{{ tools_helm_release_opencost }}"
    release_namespace: "{{ tools_namespace_itbench_observability }}"
    release_state: present
    timeout: 10m0s
    values:
      opencost:
        customPricing:
          costModel:
            CPU: 10.00
            GPU: 50.00
            RAM: 5.00
            description: Modified pricing configuration.
            internetNetworkEgress: 1.00
            regionNetworkEgress: 1.00
            spotCPU: 7.50
            spotRAM: 2.50
            storage: 2.50
            zoneNetworkEgress: 1.00
          createConfigmap: true
          enabled: true
          provider: custom
        exporter:
          extraEnv:
            USE_CUSTOM_PROVIDER: true
        metrics:
          serviceMonitor:
            enabled: true
        platforms:
          openshift:
            enabled: "{{ tools_cluster.platform == 'openshift' }}"
        prometheus:
          bearer_token: "{{ tools_prometheus_bearer_token | default(omit) }}"
          external:
            enabled: true
            url: "{{ tools_prometheus_endpoint.http }}"
          insecureSkipVerify: "{{ tools_cluster.platform == 'openshift' }}"
          internal:
            enabled: false
      serviceAccount:
        create: false
        name: opencost
    wait: true

- name: Create HTTPRoute for OpenCost
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: "{{ tools_helm_release_opencost }}"
        namespace: "{{ tools_namespace_itbench_observability }}"
      spec:
        parentRefs:
          - name: "{{ tools_gateway }}"
            namespace: "{{ tools_namespace_itbench_kubernetes_gateway }}"
        rules:
          - backendRefs:
              - name: "{{ tools_helm_release_opencost }}"
                port: 9090
            filters:
              - responseHeaderModifier:
                  add: "{{ tools_response_headers_http }}"
                type: ResponseHeaderModifier
    state: present

- name: Create PrometheusRules
  kubernetes.core.k8s:
    state: present
    template: templates/kubernetes/opencost/prometheusrules.j2
