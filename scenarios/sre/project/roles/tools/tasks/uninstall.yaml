---
# Vendor cleanup runs unconditionally and idempotently: the tasks no-op when the
# vendor namespace is absent, so disabling a vendor still removes its resources
# during Undeploy-Tools (rather than orphaning them).
#
# ORDERING NOTE: Dynatrace is uninstalled LAST (just before CRD removal), not
# here. Dynatrace's OneAgent injects a `csi.oneagent.dynatrace.com` volume into
# pods across other tool namespaces (e.g. Prometheus). If the Dynatrace operator
# / CSI DaemonSet is removed first, those injected pods can no longer unmount
# their CSI volume when their own namespace is later deleted, so they hang in
# Terminating and block namespace deletion (600s timeout). Tearing Dynatrace
# down after the injected workloads keeps the CSI driver available for a clean
# unmount. Datadog uses a DaemonSet agent (no injected CSI volumes) and is safe
# to remove early.
- name: Import Datadog uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_datadog.yaml

- name: Import Kubernetes Topology Monitor uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_kubernetes_topology_monitor.yaml

- name: Import Chaos Mesh uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_chaos_mesh.yaml

- name: Import OpenCost uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_opencost.yaml

- name: Import OpenTelemetry uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_opentelemetry.yaml

- name: Import Prometheus uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_prometheus.yaml

- name: Import Clickhouse installation tasks
  ansible.builtin.import_tasks:
    file: uninstall_clickhouse.yaml

- name: Import OpenSearch uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_opensearch.yaml

- name: Import Istio uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_istio.yaml

- name: Import cert-manager uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_cert_manager.yaml

- name: Import Kubernetes Metrics Server uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_kubernetes_metrics_server.yaml
  when:
    - tools_cluster.platform == "kubernetes"

- name: Import Kubernetes Gateway API uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_kubernetes_gateway.yaml

# Dynatrace is torn down here (after all other tools) so its OneAgent CSI driver
# remains available while Dynatrace-injected pods in other namespaces terminate.
# See the ORDERING NOTE at the top of this file.
- name: Import Dynatrace uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_dynatrace.yaml

- name: Import Custom Resource Definition removal tasks
  ansible.builtin.import_tasks:
    file: remove_custom_resource_definitions.yaml
