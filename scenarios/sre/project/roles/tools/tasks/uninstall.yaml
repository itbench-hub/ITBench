---
- name: Import Istio uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_istio.yaml

- name: Import Kubernetes Gateway uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_kubernetes_gateway.yaml

- name: Uninstall OpenCost Helm release
  kubernetes.core.helm:
    release_name: "{{ tools_helm_release_opencost }}"
    release_namespace: "{{ tools_namespace_itbench_observability }}"
    release_state: absent
    wait: true

- name: Import OpenTelemetry uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_opentelemetry.yaml

- name: Import Prometheus uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_prometheus.yaml

- name: Import Clickhouse uninstallation tasks
  ansible.builtin.import_tasks:
    file: uninstall_clickhouse.yaml

- name: Uninstall Kubernetes Metrics Server Helm release
  kubernetes.core.helm:
    release_name: "{{ tools_helm_release_kubernetes_metrics_server }}"
    release_namespace: "{{ tools_namespace_kubernetes_metrics_server }}"
    release_state: absent
    wait: true
  when:
    - tools_cluster.platform == "kubernetes"

- name: Uninstall cert-manager Helm release
  kubernetes.core.helm:
    release_name: "{{ tools_helm_release_cert_manager }}"
    release_namespace: "{{ tools_namespace_itbench }}"
    release_state: absent
    wait: true
  when:
    - tools_cluster.platform == "kubernetes"

- name: Uninstall Kyverno Helm release
  kubernetes.core.helm:
    release_name: "{{ tools_helm_release_kyverno }}"
    release_namespace: "{{ tools_namespace_kyverno }}"
    release_state: absent
    wait: true

- name: Delete all OpenShift Operators
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Retrieve all ITBench related OpenShift Subscriptions
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        label_selectors:
          - "itbench.io/layer={{ layer.name }}"
      loop:
        - name: infrastructure
        - name: networking
        - name: observability
      loop_control:
        label: layer/{{ layer.name }}
        loop_var: layer
      register: tools_openshift_subscriptions

    - name: Delete all ITBench related OpenShift Subscriptions
      kubernetes.core.k8s:
        resource_definition: >-
          {{
            tools_openshift_subscriptions.results |
            map(attribute='resources') |
            ansible.builtin.flatten(1)
          }}
        state: absent
        wait: true
      when:
        - tools_openshift_subscriptions.results | ansible.builtin.length > 0

    - name: Delete all ITBench related OpenShift ClusterServiceVersions
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: ClusterServiceVersion
          metadata:
            name: "{{ subscription.status.currentCSV }}"
            namespace: "{{ subscription.metadata.namespace }}"
        state: absent
        wait: true
      loop: >-
        {{
          tools_openshift_subscriptions.results |
          map(attribute='resources') |
          ansible.builtin.flatten(1) |
          ansible.builtin.selectattr("status.currentCSV", "ansible.builtin.defined")
        }}
      loop_control:
        label: clusterserviceversion/{{ subscription.status.currentCSV }}
        loop_var: subscription

- name: Delete ClusterRoleBindings for recorders
  kubernetes.core.k8s:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    label_selectors:
      - "itbench.io/layer=infrastructure"
    state: absent
    wait: true

- name: Delete all infrastructure namespaces
  kubernetes.core.k8s:
    api_version: v1
    delete_all: true
    kind: Namespace
    label_selectors:
      - "itbench.io/layer={{ layer.name }}"
    state: absent
    wait: true
  loop:
    - name: infrastructure
    - name: governance
    - name: networking
    - name: observability
  loop_control:
    label: layer/{{ layer.name }}
    loop_var: layer

- name: Import Custom Resource Definition removal tasks
  ansible.builtin.import_tasks:
    file: uninstall_custom_resource_definitions.yaml
