---
- name: Create PersistentVolumeClaim for Clickhouse Recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: itbench-clickhouse-records
        namespace: "{{ tools_itbench_namespace_observability }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        volumeMode: Filesystem
    state: present

- name: Install Kubernetes Job for Clickhouse Recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: itbench-clickhouse-recorder
        namespace: "{{ tools_itbench_namespace_observability }}"
      spec:
        template:
          spec:
            containers:
              - env:
                  - name: CLICKHOUSE_HOST
                    value: "{{ tools_itbench_fqdn_clickhouse_observability_tcp }}"
                  - name: NAMESPACES
                    value: >-
                      {{
                        tools_recordable_namespaces.resources |
                        map(attribute='metadata.name') |
                        ansible.builtin.join(',')
                      }}
                  - name: OUTPUT_DIR
                    value: /records
                  - name: RECORDING_START_TIMESTAMP
                    value: "{{ '%Y-%m-%dT%H:%M:%SZ' | ansible.builtin.strftime(now(utc=true).timestamp() - (tools_benchmark_duration_minutes * 60)) }}"
                  - name: RECORDING_END_TIMESTAMP
                    value: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
                  - name: RECORDING_INTERVAL_SECONDS
                    value: "300"
                envFrom:
                  - secretRef:
                      name: user-recorder-credentials
                image: quay.io/it-bench/clickhouse-recorder:1.0.0@sha256:45245ec29c053ca3f0014f21493c006974494712bdd6d04a888fa8eba6d7f6fc
                name: recorder
                resources:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    memory: 1024Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - mountPath: /records
                    name: records
            restartPolicy: Never
            securityContext:
              fsGroup: 1001
              runAsNonRoot: true
              runAsUser: 1001
              seccompProfile:
                type: RuntimeDefault
            volumes:
              - name: records
                persistentVolumeClaim:
                  claimName: itbench-clickhouse-records
    state: present
    wait: true
    wait_condition:
      status: "True"
      type: Complete
    wait_timeout: 600

- name: Export Clickhouse records
  ansible.builtin.import_tasks:
    file: export_records.yaml
  vars:
    recorder_persistent_volume_claim: itbench-clickhouse-records
