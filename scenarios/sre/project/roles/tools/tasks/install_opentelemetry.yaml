---
- name: Install OpenTelemetry Operator on Kubernetes
  kubernetes.core.helm:
    chart_ref: "oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-operator"
    chart_version: "0.128.0"
    release_name: "{{ tools_helm_release_opentelemetry_operator }}"
    release_namespace: "{{ tools_namespace_itbench_observability }}"
    release_state: present
    release_values:
      admissionWebhooks:
        autoGenerateCert:
          enabled: true
        certManager:
          enabled: false
      manager:
        serviceMonitor:
          enabled: true
    timeout: 10m0s
    wait: true
  when:
    - tools_cluster.platform == "kubernetes"

- name: Install OpenTelemetry Operator on OpenShift
  vars:
    operator_namespace: openshift-opentelemetry-operator
    subscription: opentelemetry-product
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Create the project for RH build of OpenTelemetry Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: project.openshift.io/v1
          kind: Project
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": observability
              "itbench.io/monitor": "true"
            name: "{{ operator_namespace }}"
          state: present

    - name: Create the operator group for RH build of OpenTelemetry Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-opentelemetry-operator
            namespace: "{{ operator_namespace }}"
          spec:
            upgradeStrategy: Default
        state: present

    - name: Create the subscription for RH build of OpenTelemetry Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": observability
            name: "{{ subscription }}"
            namespace: "{{ operator_namespace }}"
          spec:
            channel: stable
            installPlanApproval: Automatic
            name: "{{ subscription }}"
            source: redhat-operators
            sourceNamespace: openshift-marketplace
        state: present
        wait: true
        wait_condition:
          status: "False"
          type: CatalogSourcesUnhealthy
        wait_timeout: 300

- name: Import Clickhouse endpoint variable setting tasks
  ansible.builtin.import_tasks:
    file: set_internal_endpoints_clickhouse.yaml

# NOTE: The gateway is the only Clickhouse writer for OTLP logs. Each source has its own
#       named receiver (and port) with a dedicated pipeline, so no routing is required.

- name: Install OpenTelemetry Collector for OTLP gateway
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: itbench-otel-gateway
        namespace: "{{ tools_namespace_itbench_observability }}"
      spec:
        config:
          exporters:
            clickhouse/istio:
              database: istio
              endpoint: "{{ tools_clickhouse_endpoint.http }}"
              logs_table_name: access_logs
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              username: ${env:CLICKHOUSE_USER}
            clickhouse/kubernetes_events:
              database: kubernetes
              endpoint: "{{ tools_clickhouse_endpoint.http }}"
              logs_table_name: events
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              username: ${env:CLICKHOUSE_USER}
            clickhouse/kubernetes_infrastructure:
              database: kubernetes
              endpoint: "{{ tools_clickhouse_endpoint.http }}"
              logs_table_name: infrastructure
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              username: ${env:CLICKHOUSE_USER}
            clickhouse/kubernetes_topology:
              database: kubernetes
              endpoint: "{{ tools_clickhouse_endpoint.http }}"
              logs_table_name: topology
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              username: ${env:CLICKHOUSE_USER}
            clickhouse/opentelemetry_demo:
              database: opentelemetry_demo
              endpoint: "{{ tools_clickhouse_endpoint.http }}"
              logs_table_name: logs
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              username: ${env:CLICKHOUSE_USER}
            debug: {}
          processors:
            batch:
              send_batch_size: 8192
              timeout: 1s
          receivers:
            otlp/istio:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4319
            otlp/kubernetes_events:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4322
            otlp/kubernetes_infrastructure:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4323
            otlp/kubernetes_topology:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4321
            otlp/opentelemetry_demo:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4320
          service:
            pipelines:
              logs/kubernetes_events:
                exporters:
                  - debug
                  - clickhouse/kubernetes_events
                processors:
                  - batch
                receivers:
                  - otlp/kubernetes_events
              logs/kubernetes_infrastructure:
                exporters:
                  - debug
                  - clickhouse/kubernetes_infrastructure
                processors:
                  - batch
                receivers:
                  - otlp/kubernetes_infrastructure
              logs/kubernetes_topology:
                exporters:
                  - debug
                  - clickhouse/kubernetes_topology
                processors:
                  - batch
                receivers:
                  - otlp/kubernetes_topology
              logs/istio:
                exporters:
                  - debug
                  - clickhouse/istio
                processors:
                  - batch
                receivers:
                  - otlp/istio
              logs/opentelemetry_demo:
                exporters:
                  - debug
                  - clickhouse/opentelemetry_demo
                processors:
                  - batch
                receivers:
                  - otlp/opentelemetry_demo
        envFrom:
          - secretRef:
              name: user-ingest-credentials
        image: quay.io/it-bench/opentelemetry-collector:2.0.0@sha256:462554b62b47c688bae8a7beb9196fb5afe2695cb761e25dcab698237072e27c
        mode: deployment
        observability:
          metrics:
            enableMetrics: true
        ports:
          - name: istio-grpc
            port: 4319
          - name: demo-grpc
            port: 4320
          - name: topology-grpc
            port: 4321
          - name: events-grpc
            port: 4322
          - name: infra-grpc
            port: 4323
    state: present
    wait: true
    wait_condition:
      reason: Reconciled
      status: "True"
      type: Ready

- name: Install OpenTelemetry Collector for Jaeger
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: jaeger
        namespace: "{{ tools_namespace_itbench_observability }}"
      spec:
        config:
          exporters:
            debug: {}
            jaeger_storage_exporter:
              trace_storage: traces_store
          extensions:
            jaeger_query:
              base_path: /jaeger
              storage:
                traces: traces_store
            jaeger_storage:
              backends:
                traces_store:
                  clickhouse:
                    addresses:
                      - "{{ tools_clickhouse_endpoint.tcp }}"
                    auth:
                      basic:
                        password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
                        username: ${env:CLICKHOUSE_USER}
                    create_schema: true
          processors:
            batch:
              send_batch_size: 8192
              timeout: 1s
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          service:
            extensions:
              - jaeger_storage
              - jaeger_query
            pipelines:
              traces:
                exporters:
                  - debug
                  - jaeger_storage_exporter
                processors:
                  - batch
                receivers:
                  - otlp
        envFrom:
          - secretRef:
              name: user-jaeger-credentials
        image: quay.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
        mode: deployment
        observability:
          metrics:
            enableMetrics: true
        ports:
          - name: query-grpc
            port: 16685
          - name: query-http
            port: 16686
    state: present
    wait: true
    wait_condition:
      reason: Reconciled
      status: "True"
      type: Ready

- name: Create HTTPRoute for Jaeger
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: jaeger
        namespace: "{{ tools_namespace_itbench_observability }}"
      spec:
        parentRefs:
          - name: "{{ tools_gateway }}"
            namespace: "{{ tools_namespace_itbench_kubernetes_gateway }}"
        rules:
          - backendRefs:
              - name: jaeger-collector
                port: 16686
            filters:
              - responseHeaderModifier:
                  add: "{{ tools_response_headers_http }}"
                type: ResponseHeaderModifier
            matches:
              - path:
                  type: PathPrefix
                  value: /observability/jaeger/
    state: present
