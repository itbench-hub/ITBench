---
- name: Install OpenTelemetry Operator on Kubernetes
  kubernetes.core.helm:
    chart_ref: "oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-operator"
    chart_version: "0.129.0"
    release_name: "{{ tools_helm_release_opentelemetry_operator }}"
    release_namespace: "{{ tools_itbench_namespace_observability }}"
    release_state: present
    release_values:
      admissionWebhooks:
        autoGenerateCert:
          enabled: true
        certManager:
          enabled: false
      manager:
        serviceMonitor:
          enabled: true
    timeout: 10m0s
    wait: true
  when:
    - tools_cluster.platform == "kubernetes"

- name: Install OpenTelemetry Operator on OpenShift
  vars:
    operator_namespace: openshift-opentelemetry-operator
    subscription: opentelemetry-product
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Create the project for RH build of OpenTelemetry Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: project.openshift.io/v1
          kind: Project
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": observability
              "itbench.io/monitor": "true"
            name: "{{ operator_namespace }}"
          state: present

    - name: Create the operator group for RH build of OpenTelemetry Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-opentelemetry-operator
            namespace: "{{ operator_namespace }}"
          spec:
            upgradeStrategy: Default
        state: present

    - name: Create the subscription for RH build of OpenTelemetry Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": observability
            name: "{{ subscription }}"
            namespace: "{{ operator_namespace }}"
          spec:
            channel: stable
            installPlanApproval: Automatic
            name: "{{ subscription }}"
            source: redhat-operators
            sourceNamespace: openshift-marketplace
        state: present
        wait: true
        wait_condition:
          status: "False"
          type: CatalogSourcesUnhealthy
        wait_timeout: 300

- name: Install OpenTelemetry Collector for Jaeger
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: "{{ tools_itbench_jaeger }}"
        namespace: "{{ tools_itbench_namespace_observability }}"
      spec:
        config:
          exporters:
            jaeger_storage_exporter:
              trace_storage: traces_store
          extensions:
            jaeger_query:
              ai:
                mcp: {}
              storage:
                traces: traces_store
            jaeger_storage:
              backends:
                traces_store:
                  clickhouse:
                    addresses:
                      - "{{ tools_itbench_fqdn_clickhouse_observability_tcp }}"
                    auth:
                      basic:
                        password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
                        username: ${env:CLICKHOUSE_USER}
                    create_schema: true
                    table_engine:
                      merge_tree: {}
          processors:
            batch:
              send_batch_size: 8192
              timeout: 1s
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ tools_itbench_jaeger_collector_port }}
          service:
            extensions:
              - jaeger_storage
              - jaeger_query
            pipelines:
              traces:
                exporters:
                  - jaeger_storage_exporter
                processors:
                  - batch
                receivers:
                  - otlp
        envFrom:
          - secretRef:
              name: user-jaeger-credentials
        image: quay.io/jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
        mode: deployment
        observability:
          metrics:
            enableMetrics: true
        ports:
          - name: query-http
            port: "{{ tools_itbench_jaeger_querier_port }}"
    state: present
    wait: true
    wait_condition:
      reason: Reconciled
      status: "True"
      type: Ready

- name: Install HTTPRoute for Jaeger MCP
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: "{{ tools_itbench_jaeger ~ '-mcp' }}"
        namespace: "{{ tools_itbench_namespace_observability }}"
      spec:
        parentRefs:
          - name: "{{ tools_itbench_gateway_kubernetes }}"
            namespace: "{{ tools_namespace_kubernetes_gateway_system }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp/jaeger
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /api/ai/mcp/
            backendRefs:
              - name: "{{ tools_itbench_jaeger ~ '-collector' }}"
                port: "{{ tools_itbench_jaeger_querier_port }}"
    state: present

# NOTE: The two gateways are the only Clickhouse writers for OTLP logs. Each source has its own
#       named receiver (and port) with a dedicated pipeline, so no routing is required.
#         - infrastructure: Kubernetes recorders and Istio (fixed volume, one replica)
#         - applications: Bank of Anthos, Microservices Demo and OpenTelemetry Demo
#       Ports are only unique within a gateway, as each gateway is its own Service.

- name: Install OpenTelemetry Collector for OTLP infrastructure gateway
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: "{{ tools_itbench_gateway_opentelemetry_infrastructure }}"
        namespace: "{{ tools_itbench_namespace_observability }}"
      spec:
        config:
          exporters:
            clickhouse/istio:
              database: istio
              endpoint: "{{ 'tcp://' ~ tools_itbench_fqdn_clickhouse_observability_tcp }}"
              logs_table_name: access_logs
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            clickhouse/kubernetes_events:
              database: kubernetes
              endpoint: "{{ 'tcp://' ~ tools_itbench_fqdn_clickhouse_observability_tcp }}"
              logs_table_name: events
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            clickhouse/kubernetes_infrastructure:
              database: kubernetes
              endpoint: "{{ 'tcp://' ~ tools_itbench_fqdn_clickhouse_observability_tcp }}"
              logs_table_name: infrastructure
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            clickhouse/kubernetes_topology:
              database: kubernetes
              endpoint: "{{ 'tcp://' ~ tools_itbench_fqdn_clickhouse_observability_tcp }}"
              logs_table_name: topology
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            otlp_grpc/jaeger:
              endpoint: "{{ tools_itbench_fqdn_jaeger_collector }}"
              retry_on_failure:
                enabled: true
              sending_queue:
                enabled: true
              tls:
                insecure: true
          processors:
            batch:
              send_batch_max_size: 16384
              send_batch_size: 8192
              timeout: 1s
            memory_limiter:
              check_interval: 1s
              limit_mib: 400
              spike_limit_mib: 100
          receivers:
            otlp/istio:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ tools_itbench_gateway_opentelemetry_infrastructure_port_istio }}
            otlp/kubernetes_events:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ tools_itbench_gateway_opentelemetry_infrastructure_port_kubernetes_events }}
            otlp/kubernetes_infrastructure:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ tools_itbench_gateway_opentelemetry_infrastructure_port_kubernetes_infrastructure }}
            otlp/kubernetes_topology:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ tools_itbench_gateway_opentelemetry_infrastructure_port_kubernetes_topology }}
            otlp/traces:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ tools_itbench_gateway_opentelemetry_infrastructure_port_traces }}
          service:
            pipelines:
              logs/istio:
                exporters:
                  - clickhouse/istio
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/istio
              logs/kubernetes_events:
                exporters:
                  - clickhouse/kubernetes_events
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/kubernetes_events
              logs/kubernetes_infrastructure:
                exporters:
                  - clickhouse/kubernetes_infrastructure
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/kubernetes_infrastructure
              logs/kubernetes_topology:
                exporters:
                  - clickhouse/kubernetes_topology
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/kubernetes_topology
              traces/jaeger:
                exporters:
                  - otlp_grpc/jaeger
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/traces
        envFrom:
          - secretRef:
              name: user-ingest-credentials
        image: quay.io/it-bench/opentelemetry-collector:2.0.0@sha256:84e6613316b1c0455382e8ccdc658b71a5fb1954e7f8b947bc344b1a573628ef
        mode: deployment
        observability:
          metrics:
            enableMetrics: true
        ports:
          - name: istio
            port: "{{ tools_itbench_gateway_opentelemetry_infrastructure_port_istio }}"
          - name: k8s-events
            port: "{{ tools_itbench_gateway_opentelemetry_infrastructure_port_kubernetes_events }}"
          - name: k8s-infra
            port: "{{ tools_itbench_gateway_opentelemetry_infrastructure_port_kubernetes_infrastructure }}"
          - name: k8s-topology
            port: "{{ tools_itbench_gateway_opentelemetry_infrastructure_port_kubernetes_topology }}"
          - name: traces
            port: "{{ tools_itbench_gateway_opentelemetry_infrastructure_port_traces }}"
        resources:
          limits:
            memory: 512Mi
          requests:
            memory: 256Mi
    state: present
    wait: true
    wait_condition:
      reason: Reconciled
      status: "True"
      type: Ready

- name: Install OpenTelemetry Collector for OTLP applications gateway
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: "{{ tools_itbench_gateway_opentelemetry_applications }}"
        namespace: "{{ tools_itbench_namespace_observability }}"
      spec:
        config:
          exporters:
            clickhouse/bank_of_anthos:
              database: bank_of_anthos
              endpoint: "{{ 'tcp://' ~ tools_itbench_fqdn_clickhouse_observability_tcp }}"
              logs_table_name: logs
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            clickhouse/microservices_demo:
              database: microservices_demo
              endpoint: "{{ 'tcp://' ~ tools_itbench_fqdn_clickhouse_observability_tcp }}"
              logs_table_name: logs
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            clickhouse/opentelemetry_demo:
              database: opentelemetry_demo
              endpoint: "{{ 'tcp://' ~ tools_itbench_fqdn_clickhouse_observability_tcp }}"
              logs_table_name: logs
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            otlp_grpc/jaeger:
              endpoint: "{{ tools_itbench_fqdn_jaeger_collector }}"
              retry_on_failure:
                enabled: true
              sending_queue:
                enabled: true
              tls:
                insecure: true
            prometheus:
              endpoint: 0.0.0.0:8889
          processors:
            batch:
              send_batch_max_size: 16384
              send_batch_size: 8192
              timeout: 1s
            memory_limiter:
              check_interval: 1s
              limit_mib: 800
              spike_limit_mib: 200
          receivers:
            otlp/bank_of_anthos:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ tools_itbench_gateway_opentelemetry_applications_port_bank_of_anthos }}
            otlp/metrics:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ tools_itbench_gateway_opentelemetry_applications_port_metrics }}
            otlp/microservices_demo:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ tools_itbench_gateway_opentelemetry_applications_port_microservices_demo }}
            otlp/opentelemetry_demo:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ tools_itbench_gateway_opentelemetry_applications_port_opentelemetry_demo }}
            otlp/traces:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ tools_itbench_gateway_opentelemetry_applications_port_traces }}
          service:
            pipelines:
              logs/bank_of_anthos:
                exporters:
                  - clickhouse/bank_of_anthos
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/bank_of_anthos
              logs/microservices_demo:
                exporters:
                  - clickhouse/microservices_demo
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/microservices_demo
              logs/opentelemetry_demo:
                exporters:
                  - clickhouse/opentelemetry_demo
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/opentelemetry_demo
              metrics:
                exporters:
                  - prometheus
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/metrics
              traces/jaeger:
                exporters:
                  - otlp_grpc/jaeger
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/traces
        envFrom:
          - secretRef:
              name: user-ingest-credentials
        image: quay.io/it-bench/opentelemetry-collector:2.0.0@sha256:84e6613316b1c0455382e8ccdc658b71a5fb1954e7f8b947bc344b1a573628ef
        mode: deployment
        observability:
          metrics:
            enableMetrics: true
        ports:
          - name: bank-of-anthos
            port: "{{ tools_itbench_gateway_opentelemetry_applications_port_bank_of_anthos }}"
          - name: metrics
            port: "{{ tools_itbench_gateway_opentelemetry_applications_port_metrics }}"
          - name: micro-demo
            port: "{{ tools_itbench_gateway_opentelemetry_applications_port_microservices_demo }}"
          - name: otel-demo
            port: "{{ tools_itbench_gateway_opentelemetry_applications_port_opentelemetry_demo }}"
          - name: prometheus
            port: 8889
          - name: traces
            port: "{{ tools_itbench_gateway_opentelemetry_applications_port_traces }}"
        resources:
          limits:
            memory: 1Gi
          requests:
            memory: 512Mi
    state: present
    wait: true
    wait_condition:
      reason: Reconciled
      status: "True"
      type: Ready
