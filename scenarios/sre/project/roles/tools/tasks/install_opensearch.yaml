---
- name: Create Namespace for OpenSearch
  kubernetes.core.k8s:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    state: present
    template: templates/kubernetes/opensearch/namespace.j2

- name: Install OpenSearch
  kubernetes.core.helm:
    chart_ref: opensearch
    chart_repo_url: "https://opensearch-project.github.io/helm-charts"
    chart_version: "3.7.0"
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    release_name: "{{ tools_releases.opensearch.name }}"
    release_namespace: "{{ tools_releases.opensearch.namespace }}"
    release_state: present
    timeout: 10m
    values: |-
      {{
        lookup('ansible.builtin.template', 'templates/helm/opensearch/values.j2') |
        ansible.builtin.from_yaml
      }}
    wait: true
