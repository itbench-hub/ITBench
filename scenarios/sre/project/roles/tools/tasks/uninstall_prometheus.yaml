---
- name: Uninstall Prometheus Operator and Prometheus Helm release
  kubernetes.core.helm:
    release_name: "{{ tools_helm_release_kube_prometheus_stack }}"
    release_namespace: "{{ tools_namespace_itbench_observability }}"
    release_state: absent
    timeout: "600s"
    wait: true
  when:
    - tools_cluster.platform == "kubernetes"

- name: Uninstall Prometheus on OpenShift
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Delete User Workload ConfigMap
      kubernetes.core.k8s:
        api_version: v1
        kind: ConfigMap
        name: user-workload-monitoring-config
        namespace: "{{ tools_namespace_openshift_user_workload_monitoring }}"
        state: absent

    - name: Delete Cluster Monitoring ConfigMap
      kubernetes.core.k8s:
        api_version: v1
        kind: ConfigMap
        name: cluster-monitoring-config
        namespace: "{{ tools_namespace_openshift_monitoring }}"
        state: absent
