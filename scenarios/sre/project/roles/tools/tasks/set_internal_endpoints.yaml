---
- name: Retrieve all namespaces
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
  register: tools_k8s_namespaces

- name: Validate that namespaces exists
  ansible.builtin.assert:
    fail_msg: No namespaces were found. Please ensure that tool installation completed successfully.
    success_msg: Namespaces found.
    that:
      - tools_k8s_namespaces.api_found
      - tools_k8s_namespaces.resources | ansible.builtin.length > 0

- name: Map resources to names list
  ansible.builtin.set_fact:
    tools_namespace_names: "{{ tools_k8s_namespaces.resources | map(attribute='metadata.name') }}"

- name: Import Clickhouse variable setting tasks
  ansible.builtin.import_tasks:
    file: set_internal_endpoints_clickhouse.yaml
  when:
    - tools_namespace_itbench_observability in tools_namespace_names

- name: Import OTLP gateway variable setting tasks
  ansible.builtin.import_tasks:
    file: set_internal_endpoints_opentelemetry_gateway.yaml
  when:
    - tools_namespace_itbench_observability in tools_namespace_names

- name: Import Jaeger variable setting tasks
  ansible.builtin.import_tasks:
    file: set_internal_endpoints_jaeger.yaml
  when:
    - tools_namespace_itbench_observability in tools_namespace_names

- name: Import Prometheus variable setting tasks
  ansible.builtin.import_tasks:
    file: set_internal_endpoints_prometheus.yaml
  when:
    - tools_namespace_openshift_monitoring in tools_namespace_names or tools_namespace_itbench_observability in tools_namespace_names
