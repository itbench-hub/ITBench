---
- name: Install cert-manager on Kubernetes
  kubernetes.core.helm:
    chart_ref: "oci://quay.io/jetstack/charts/cert-manager"
    chart_version: "v1.21.2"
    release_name: "{{ tools_helm_release_cert_manager }}"
    release_namespace: "{{ tools_namespace_itbench }}"
    release_state: present
    release_values:
      crds:
        enabled: true
      prometheus:
        enabled: true
        servicemonitor:
          enabled: true
    timeout: 10m0s
    wait: true
  when:
    - tools_cluster.platform == "kubernetes"

- name: Install cert-manager Operator on OpenShift
  vars:
    operator_namespace: cert-manager-operator
    subscription: openshift-cert-manager-operator
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Create Project for cert-manager Operator for Red Hat OpenShift
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: project.openshift.io/v1
          kind: Project
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/inject": false
              "itbench.io/layer": infrastructure
              "itbench.io/monitor": "true"
            name: "{{ operator_namespace }}"
        state: present

    - name: Create the operator group for RH cert-manager Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-cert-manager-operator
            namespace: "{{ operator_namespace }}"
        state: present

    - name: Create the subscription for RH cert-manager Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": infrastructure
            name: "{{ subscription }}"
            namespace: "{{ operator_namespace }}"
          spec:
            channel: stable
            installPlanApproval: Automatic
            name: "{{ subscription }}"
            source: redhat-operators
            sourceNamespace: openshift-marketplace
        state: present
        wait: true
        wait_condition:
          status: "False"
          type: CatalogSourcesUnhealthy
        wait_timeout: 300
