---
- name: Install cert-manager on Kubernetes
  when:
    - tools_cluster.platform == "kubernetes"
  block:
    - name: Create Namespace for cert-manager
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            labels:
              "prometheus.itbench.io/monitor": "true"
            name: "{{ tools_releases.cert_manager.namespace }}"
        state: present

    - name: Install cert-manager
      kubernetes.core.helm:
        chart_ref: "oci://quay.io/jetstack/charts/cert-manager"
        chart_version: "v1.21.2"
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        release_name: "{{ tools_releases.cert_manager.name }}"
        release_namespace: "{{ tools_releases.cert_manager.namespace }}"
        release_state: present
        timeout: 10m0s
        values:
          crds:
            enabled: true
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.itbench.io/sandbox
                        operator: DoesNotExist
          webhook:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.itbench.io/sandbox
                          operator: DoesNotExist
          cainjector:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.itbench.io/sandbox
                          operator: DoesNotExist
          startupapicheck:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.itbench.io/sandbox
                          operator: DoesNotExist
          prometheus:
            enabled: true
            servicemonitor:
              enabled: true
        wait: true

- name: Install RedHat cert-manager Operator on OpenShift
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Create the project for RH cert-manager Operator
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: project.openshift.io/v1
          kind: Project
          metadata:
            name: cert-manager-operator
            labels:
              kubernetes.io/metadata.name: cert-manager-operator
              openshift.io/cluster-monitoring: "true"
        state: present

    - name: Create the operator group for RH cert-manager Operator
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-cert-manager-operator
            namespace: cert-manager-operator
          spec:
            targetNamespaces:
              - cert-manager-operator
        state: present

    - name: Create the subscription for RH cert-manager Operator
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: openshift-cert-manager-operator
            namespace: cert-manager-operator
          spec:
            channel: stable-v1
            installPlanApproval: Automatic
            name: openshift-cert-manager-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace
        state: present
        wait: true
        wait_condition:
          type: CatalogSourcesUnhealthy
          status: "False"
        wait_timeout: 300
