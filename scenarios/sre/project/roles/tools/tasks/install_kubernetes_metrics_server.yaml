---
- name: Create Namespace for Kubernetes Metrics Server
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        labels:
          "prometheus.itbench.io/monitor": "true"
        name: "{{ tools_releases.kubernetes_metrics_server.namespace }}"
    state: present

- name: Install Kubernetes Metrics Server
  kubernetes.core.helm:
    chart_ref: metrics-server
    chart_repo_url: "https://kubernetes-sigs.github.io/metrics-server/"
    chart_version: "3.14.0"
    release_name: "{{ tools_releases.kubernetes_metrics_server.name }}"
    release_namespace: "{{ tools_releases.kubernetes_metrics_server.namespace }}"
    release_state: present
    timeout: 10m0s
    values:
      apiService:
        insecureSkipTLSVerify: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.itbench.io/sandbox
                    operator: DoesNotExist
      tls:
        type: cert-manager
      serviceMonitor:
        enabled: true
    wait: true
