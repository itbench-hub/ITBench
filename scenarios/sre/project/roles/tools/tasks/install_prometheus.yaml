---
- name: Install Prometheus on Kubernetes
  when:
    - tools_cluster.platform == "kubernetes"
  block:
    - name: Install Prometheus Operator and Prometheus
      kubernetes.core.helm:
        chart_ref: "oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack"
        chart_version: "92.10.1"
        release_name: "{{ tools_helm_release_kube_prometheus_stack }}"
        release_namespace: "{{ tools_namespace_itbench_observability }}"
        release_state: present
        timeout: 10m0s
        values:
          alertmanager:
            enabled: false
          crds:
            enabled: false
          customRules:
            KubeContainerWaiting:
              for: 5m
            KubeDeploymentRolloutStuck:
              for: 5m
            KubeHpaMaxedOut:
              for: 5m
            KubePodCrashLooping:
              for: 5m
            KubePodNotReady:
              for: 5m
          defaultRules:
            rules:
              alertmanager: false
          grafana:
            enabled: false
          kube-state-metrics:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.itbench.io/sandbox
                          operator: DoesNotExist
          kubeControllerManager:
            enabled: "{{ tools_cluster.provider == 'kind' }}"
          kubeEtcd:
            enabled: "{{ tools_cluster.provider == 'kind' }}"
          kubeProxy:
            enabled: "{{ tools_cluster.provider == 'kind' }}"
          kubeScheduler:
            enabled: "{{ tools_cluster.provider == 'kind' }}"
          prometheus:
            prometheusSpec:
              enableOTLPReceiver: true
              podMonitorNamespaceSelector:
                matchLabels:
                  "itbench.io/monitor": "true"
              podMonitorSelectorNilUsesHelmValues: false
              remoteWrite:
                - basicAuth:
                    password:
                      key: password
                      name: user-default-credentials
                    username:
                      key: username
                      name: user-default-credentials
                  queueConfig:
                    batchSendDeadline: 10s
                    maxSamplesPerSend: 5000
                  url: "http://{{ tools_clickhouse_endpoint.prometheus }}/write"
              routePrefix: /observability/prometheus
              ruleNamespaceSelector:
                matchLabels:
                  "itbench.io/monitor": "true"
              ruleSelectorNilUsesHelmValues: false
              serviceMonitorNamespaceSelector:
                matchLabels:
                  "itbench.io/monitor": "true"
              serviceMonitorSelectorNilUsesHelmValues: false
        wait: true

    - name: Create HTTPRoute for Prometheus
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: "{{ tools_helm_release_kube_prometheus_stack }}"
            namespace: "{{ tools_namespace_itbench_observability }}"
          spec:
            parentRefs:
              - name: "{{ tools_gateway }}"
                namespace: "{{ tools_namespace_itbench_kubernetes_gateway }}"
            rules:
              - backendRefs:
                  - name: "{{ tools_helm_release_kube_prometheus_stack }}-prometheus"
                    port: 9090
                filters:
                  - responseHeaderModifier:
                      add: "{{ tools_response_headers_http }}"
                    type: ResponseHeaderModifier
                matches:
                  - path:
                      type: PathPrefix
                      value: /observability/prometheus/
        state: present

- name: Install Prometheus on OpenShift
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Import Clickhouse credential variable setting tasks
      ansible.builtin.import_tasks:
        file: set_credentials_clickhouse.yaml

    - name: Import Clickhouse endpoint variable setting tasks
      ansible.builtin.import_tasks:
        file: set_internal_endpoints_clickhouse.yaml

    - name: Redeploy Clickhouse credential to Prometheus namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: clickhouse-remote-write-credentials
            namespace: "{{ tools_namespace_openshift_user_workload_monitoring }}"
          stringData:
            password: "{{ tools_clickhouse_password }}" # pragma: allowlist secret
            username: "{{ tools_clickhouse_username }}"
          type: Opaque
        state: present

    - name: Create Cluster Monitoring ConfigMap
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          data:
            config.yaml: |
              enableUserWorkload: true
          kind: ConfigMap
          metadata:
            name: cluster-monitoring-config
            namespace: "{{ tools_namespace_openshift_monitoring }}"
        state: present

    - name: Create User Workload ConfigMap
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          data:
            config.yaml: |
              alertmanager:
                enabled: false
              prometheus:
                remoteWrite:
                  - basicAuth:
                      password:
                        name: clickhouse-remote-write-credentials
                        key: password
                      username:
                        name: clickhouse-remote-write-credentials
                        key: username
                    queueConfig:
                      maxSamplesPerSend: 5000
                      batchSendDeadline: 10s
                    url: "http://{{ tools_clickhouse_endpoint.prometheus }}/write"
          kind: ConfigMap
          metadata:
            name: user-workload-monitoring-config
            namespace: "{{ tools_namespace_openshift_user_workload_monitoring }}"
        state: present

    - name: Wait for Prometheus workload pods to start
      kubernetes.core.k8s_info:
        kind: Pod
        label_selectors:
          - app.kubernetes.io/component = prometheus
          - app.kubernetes.io/instance = user-workload
        namespace: "{{ tools_namespace_openshift_user_workload_monitoring }}"
        wait: true
        wait_condition:
          status: "True"
          type: Ready
        wait_timeout: 300

    # Note: OpenShift's built-in Prometheus does not include the community alert
    #       rules bundled with kube-prometheus-stack (used on Kubernetes). These
    #       rules are required for scenario evaluation consistency across platforms.
    #       The label openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
    #       is required for PrometheusRule objects to be picked up by the user
    #       workload Prometheus instance in OpenShift.
    - name: Install community Prometheus alert rules on OpenShift
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: monitoring.coreos.com/v1
          kind: PrometheusRule
          metadata:
            name: itbench-community-rules
            namespace: "{{ tools_releases.kube_prometheus_stack.namespace.openshift }}"
            labels:
              openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
          spec:
            groups:
              - name: kubernetes-resources
                rules:
                  - alert: KubePodNotReady
                    expr: |
                      sum by (namespace, pod) (
                        max by (namespace, pod, phase) (
                          kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}
                        ) * on(namespace, pod) group_left(owner_kind)
                        topk by(namespace, pod) (
                          1,
                          max by(namespace, pod, owner_kind) (
                            kube_pod_owner{owner_kind!="Job"}
                          )
                        )
                      ) > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      description: >-
                        Pod {{ $labels.namespace }}/{{ $labels.pod }} has been
                        in a non-ready state for more than 5 minutes.
                  - alert: KubePodCrashLooping
                    expr: |
                      max_over_time(
                        kube_pod_container_status_waiting_reason{
                          reason="CrashLoopBackOff"
                        }[5m]
                      ) >= 1
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      description: >-
                        Pod {{ $labels.namespace }}/{{ $labels.pod }}
                        ({{ $labels.container }}) is in CrashLoopBackOff.
                  - alert: KubeContainerWaiting
                    expr: |
                      sum by (namespace, pod, container) (
                        kube_pod_container_status_waiting_reason{
                          reason!~"ContainerCreating|PodInitializing|Completed"
                        }
                      ) > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      description: >-
                        Pod {{ $labels.namespace }}/{{ $labels.pod }}
                        ({{ $labels.container }}) has been in a waiting state
                        for more than 5 minutes.
                  - alert: KubeDeploymentRolloutStuck
                    expr: |
                      kube_deployment_status_condition{
                        condition="Progressing",
                        status="false"
                      } != 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      description: >-
                        Rollout of Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
                        is not progressing.
                  - alert: KubeHpaMaxedOut
                    expr: |
                      kube_horizontalpodautoscaler_status_current_replicas{
                        job="kube-state-metrics"
                      }
                        ==
                      kube_horizontalpodautoscaler_spec_max_replicas{
                        job="kube-state-metrics"
                      }
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      description: >-
                        HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }}
                        has been running at max replicas for longer than 5 minutes.
        state: present
