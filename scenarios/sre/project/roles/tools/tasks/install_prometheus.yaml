---
- name: Import tools role for variable setting tasks
  ansible.builtin.import_tasks:
    file: set_internal_endpoints_clickhouse.yaml

- name: Install Prometheus on Kubernetes
  when:
    - tools_cluster.platform == "kubernetes"
  block:
    - name: Install Issuer for Prometheus proxy
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: "{{ tools_helm_release_kube_prometheus_stack ~ '-proxy-issuer' }}"
            namespace: "{{ tools_namespace_itbench_observability }}"
          spec:
            selfSigned: {}
        state: present

    - name: Install Certificate for Prometheus proxy
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: "{{ tools_helm_release_kube_prometheus_stack ~ '-prometheus-proxy-tls' }}"
            namespace: "{{ tools_namespace_itbench_observability }}"
          spec:
            dnsNames:
              - "{{ tools_helm_release_kube_prometheus_stack ~ '-prometheus' }}"
              - >-
                {{
                    [
                      tools_helm_release_kube_prometheus_stack,
                      "-prometheus",
                      tools_namespace_itbench_observability
                    ] |
                    ansible.builtin.join(".")
                }}
              - >-
                {{
                    [
                      tools_helm_release_kube_prometheus_stack,
                      "-prometheus",
                      tools_namespace_itbench_observability,
                      "svc",
                      "cluster",
                      "local"
                    ] |
                    ansible.builtin.join(".")
                }}
            duration: 2160h
            isCA: false
            issuerRef:
              name: "{{ tools_helm_release_kube_prometheus_stack ~ '-proxy-issuer' }}"
              kind: Issuer
            privateKey:
              algorithm: RSA
              size: 2048
            renewBefore: 360h
            secretName: "{{ tools_helm_release_kube_prometheus_stack ~ '-proxy-cert' }}"
            usages:
              - server auth
              - client auth
        state: present

    - name: Install Prometheus Operator and Prometheus
      kubernetes.core.helm:
        chart_ref: "oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack"
        chart_version: "92.16.0"
        release_name: "{{ tools_helm_release_kube_prometheus_stack }}"
        release_namespace: "{{ tools_namespace_itbench_observability }}"
        release_state: present
        release_values:
          alertmanager:
            enabled: false
          crds:
            enabled: false
          customRules:
            KubeContainerWaiting:
              for: 5m
            KubeDeploymentRolloutStuck:
              for: 5m
            KubeHpaMaxedOut:
              for: 5m
            KubePodCrashLooping:
              for: 5m
            KubePodNotReady:
              for: 5m
          defaultRules:
            rules:
              alertmanager: false
          grafana:
            enabled: false
          kubeControllerManager:
            enabled: "{{ tools_cluster.provider == 'kind' }}"
          kubeEtcd:
            enabled: "{{ tools_cluster.provider == 'kind' }}"
          kubeProxy:
            enabled: "{{ tools_cluster.provider == 'kind' }}"
          kubeScheduler:
            enabled: "{{ tools_cluster.provider == 'kind' }}"
          prometheus:
            prometheusSpec:
              containers:
                - args:
                    - "--secure-listen-address=0.0.0.0:8443"
                    - "--upstream=http://127.0.0.1:9090/"
                    - "--tls-cert-file=/etc/tls/proxy/tls.crt"
                    - "--tls-private-key-file=/etc/tls/proxy/tls.key"
                    - "--v=10"
                  image: ghcr.io/kube-rbac-proxy/kube-rbac-proxy:v0.23.1@sha256:f723251bdd90a806b5331b6e9f9287cc2832d3dd9f9479378cdbbddb9856724f
                  name: kube-rbac-proxy
                  ports:
                    - containerPort: 8443
                      name: http-proxy
                  volumeMounts:
                    - name: proxy-certs
                      mountPath: /etc/tls/proxy
                      readOnly: true
              enableOTLPReceiver: true
              listenLocal: true
              podMonitorNamespaceSelector:
                matchLabels:
                  "itbench.io/monitor": "true"
              podMonitorSelectorNilUsesHelmValues: false
              remoteWrite:
                - basicAuth:
                    password:
                      key: CLICKHOUSE_PASSWORD
                      name: user-default-credentials
                    username:
                      key: CLICKHOUSE_USER
                      name: user-default-credentials
                  queueConfig:
                    batchSendDeadline: 15s
                    maxSamplesPerSend: 20000
                  url: "http://{{ tools_clickhouse_endpoint.prometheus }}/write"
              routePrefix: /observability/prometheus
              ruleNamespaceSelector:
                matchLabels:
                  "itbench.io/monitor": "true"
              ruleSelectorNilUsesHelmValues: false
              serviceMonitorNamespaceSelector:
                matchLabels:
                  "itbench.io/monitor": "true"
              serviceMonitorSelectorNilUsesHelmValues: false
              volumes:
                - name: proxy-certs
                  secret:
                    secretName: "{{ tools_helm_release_kube_prometheus_stack ~ '-proxy-cert' }}"
            service:
              additionalPorts:
                - name: http-proxy
                  port: 8443
                  targetPort: 8443
              # NOTE: This is a workaround due to this issue: https://github.com/prometheus-operator/prometheus-operator/issues/8605
              #       The following line can be safely removed should the connected PR be accepted by the community.
              publishNotReadyAddresses: true
        timeout: 10m0s
        wait: true

    - name: Create ClusterRoleBinding for bearer token validation
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            labels:
              "itbench.io/layer": observability
            name: "{{ tools_helm_release_kube_prometheus_stack ~ '-proxy-token-reviews' }}"
          subjects:
            - kind: ServiceAccount
              name: "{{ tools_helm_release_kube_prometheus_stack ~ '-prometheus' }}"
              namespace: itbench-observability
          roleRef:
            kind: ClusterRole
            name: "system:auth-delegator"
            apiGroup: rbac.authorization.k8s.io
        state: present

    - name: Create ClusterRole for reader access to Prometheus
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            labels:
              "itbench.io/layer": observability
              "itbench.io/install-role": tools
            name: monitoring-prometheus-api-reader
          rules:
            - apiGroups:
                - ""
              resources:
                - namespaces
                - pods
                - services
                - endpoints
              verbs:
                - get
                - list
                - watch
            - nonResourceURLs:
                - /metrics
                - /observability/prometheus*
              verbs:
                - get
                - create
        state: present

    - name: Create HTTPRoute for Prometheus
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: "{{ tools_helm_release_kube_prometheus_stack }}"
            namespace: "{{ tools_namespace_itbench_observability }}"
          spec:
            parentRefs:
              - name: "{{ tools_gateway }}"
                namespace: "{{ tools_namespace_itbench_kubernetes_gateway }}"
            rules:
              - backendRefs:
                  - name: "{{ tools_helm_release_kube_prometheus_stack }}-prometheus"
                    port: 8443
                filters:
                  - responseHeaderModifier:
                      add: "{{ tools_response_headers_http }}"
                    type: ResponseHeaderModifier
                matches:
                  - path:
                      type: PathPrefix
                      value: /observability/prometheus/
        state: present

- name: Install Prometheus on OpenShift
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Import Clickhouse credential variable setting tasks
      ansible.builtin.import_tasks:
        file: set_credentials_clickhouse.yaml

    - name: Import Clickhouse endpoint variable setting tasks
      ansible.builtin.import_tasks:
        file: set_internal_endpoints_clickhouse.yaml

    - name: Redeploy Clickhouse credential to Prometheus namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: clickhouse-remote-write-credentials
            namespace: "{{ tools_namespace_openshift_user_workload_monitoring }}"
          stringData:
            password: "{{ tools_clickhouse_password }}" # pragma: allowlist secret
            username: "{{ tools_clickhouse_username }}"
          type: Opaque
        state: present

    - name: Create Cluster Monitoring ConfigMap
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          data:
            config.yaml: |
              enableUserWorkload: true
          kind: ConfigMap
          metadata:
            name: cluster-monitoring-config
            namespace: "{{ tools_namespace_openshift_monitoring }}"
        state: present

    - name: Create User Workload ConfigMap
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          data:
            config.yaml: |
              alertmanager:
                enabled: false
              prometheus:
                remoteWrite:
                  - basicAuth:
                      password:
                        name: clickhouse-remote-write-credentials
                        key: password
                      username:
                        name: clickhouse-remote-write-credentials
                        key: username
                    queueConfig:
                      maxSamplesPerSend: 5000
                      batchSendDeadline: 10s
                    url: "http://{{ tools_clickhouse_endpoint.prometheus }}/write"
          kind: ConfigMap
          metadata:
            name: user-workload-monitoring-config
            namespace: "{{ tools_namespace_openshift_user_workload_monitoring }}"
        state: present

    - name: Wait for Prometheus workload pods to start
      kubernetes.core.k8s_info:
        kind: Pod
        label_selectors:
          - app.kubernetes.io/component = prometheus
          - app.kubernetes.io/instance = user-workload
        namespace: "{{ tools_namespace_openshift_user_workload_monitoring }}"
        wait: true
        wait_condition:
          status: "True"
          type: Ready
        wait_timeout: 300

