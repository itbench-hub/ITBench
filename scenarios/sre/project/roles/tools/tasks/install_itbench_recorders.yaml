---
- name: Import Clickhouse endpoint setting tasks
  ansible.builtin.import_tasks:
    file: set_internal_endpoints_clickhouse.yaml

- name: Import OTLP gateway endpoint setting tasks
  ansible.builtin.import_tasks:
    file: set_internal_endpoints_opentelemetry_gateway.yaml

# NOTE: The topology collector does not need Clickhouse credentials, as it writes through
#       the OTLP gateway. Only the topology writer and the Clickhouse recorder do, and each
#       uses its own scoped user Secret from the observability namespace in place.

- name: Create ServiceAccount for topology collector
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: kubernetes-topology
        namespace: "{{ tools_namespace_itbench_observability }}"
    state: present

- name: Create ClusterRole for topology collector
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: kubernetes-topology
      rules:
        - apiGroups: [""]
          resources:
            - pods
            - services
            - persistentvolumeclaims
            - configmaps
            - serviceaccounts
            - secrets
            - namespaces
            - nodes
            - persistentvolumes
            - events
          verbs: ["get", "list", "watch"]
        - apiGroups: ["events.k8s.io"]
          resources:
            - events
          verbs: ["get", "list", "watch"]
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources:
            - roles
            - rolebindings
            - clusterroles
            - clusterrolebindings
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apps"]
          resources:
            - deployments
            - daemonsets
            - statefulsets
            - replicasets
          verbs: ["get", "list", "watch"]
        - apiGroups: ["batch"]
          resources:
            - jobs
            - cronjobs
          verbs: ["get", "list", "watch"]
        - apiGroups: ["autoscaling"]
          resources:
            - horizontalpodautoscalers
          verbs: ["get", "list", "watch"]
        - apiGroups: ["networking.k8s.io"]
          resources:
            - ingresses
            - networkpolicies
          verbs: ["get", "list", "watch"]
        - apiGroups: ["discovery.k8s.io"]
          resources:
            - endpointslices
          verbs: ["get", "list", "watch"]
        - apiGroups: ["storage.k8s.io"]
          resources:
            - storageclasses
          verbs: ["get", "list", "watch"]
        - apiGroups: ["networking.istio.io"]
          resources:
            - virtualservices
            - destinationrules
            - serviceentries
            - gateways
          verbs: ["get", "list", "watch"]
        - apiGroups: ["security.istio.io"]
          resources:
            - authorizationpolicies
            - peerauthentications
          verbs: ["get", "list", "watch"]
        - apiGroups: ["gateway.networking.k8s.io"]
          resources:
            - httproutes
            - gateways
          verbs: ["get", "list", "watch"]
    state: present

- name: Create ClusterRoleBinding for topology collector
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: kubernetes-topology
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: kubernetes-topology
      subjects:
        - kind: ServiceAccount
          name: kubernetes-topology
          namespace: "{{ tools_namespace_itbench_observability }}"
    state: present

- name: Retrieve Namespaces with record labels
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    label_selectors:
      - "itbench.io/record=true"
  register: tools_recordable_namespaces

- name: Deploy topology collector
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: kubernetes-topology
        namespace: "{{ tools_namespace_itbench_observability }}"
      spec:
        config:
          exporters:
            otlp/kubernetes-events:
              endpoint: "{{ tools_otel_gateway_endpoint.kubernetes_events.grpc }}"
              retry_on_failure:
                enabled: true
              sending_queue:
                batch:
                  flush_timeout: 2s
                  min_size: 2500
                enabled: true
                num_consumers: 5
              tls:
                insecure: true
            otlp/kubernetes-infrastructure:
              endpoint: "{{ tools_otel_gateway_endpoint.kubernetes_infrastructure.grpc }}"
              retry_on_failure:
                enabled: true
              sending_queue:
                batch:
                  flush_timeout: 2s
                  min_size: 2500
                enabled: true
                num_consumers: 5
              tls:
                insecure: true
            otlp/kubernetes-topology:
              endpoint: "{{ tools_otel_gateway_endpoint.kubernetes_topology.grpc }}"
              retry_on_failure:
                enabled: true
              sending_queue:
                batch:
                  flush_timeout: 2s
                  min_size: 2500
                enabled: true
                num_consumers: 5
              tls:
                insecure: true
          processors:
            # Only record that a Secret exists, never its contents. The
            # last-applied-configuration annotation is also removed because
            # kubectl apply copies the full manifest, including data, into it.
            transform/strip-secrets:
              error_mode: ignore
              log_statements:
                - conditions:
                    - body["object"]["kind"] == "Secret"
                  context: log
                  statements:
                    - delete_key(body["object"], "data")
                    - delete_key(body["object"], "stringData")
                    - delete_key(body["object"]["metadata"]["annotations"], "kubectl.kubernetes.io/last-applied-configuration")
          receivers:
            k8sobjects/events:
              objects:
                - group: events.k8s.io
                  mode: watch
                  name: events
                - group: ""
                  mode: watch
                  name: events
            k8sobjects/infrastructure:
              include_initial_state: true
              kube_api_burst: 20
              kube_api_qps: 10
              objects:
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: pods
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: nodes
            # Cluster-scoped objects are mostly static, so without
            # include_initial_state they would never emit an event.
            k8sobjects/topology-cluster:
              include_initial_state: true
              kube_api_burst: 20
              kube_api_qps: 10
              objects:
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: namespaces
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: nodes
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: persistentvolumes
                - exclude_watch_type: [BOOKMARK]
                  group: storage.k8s.io
                  mode: watch
                  name: storageclasses
                - exclude_watch_type: [BOOKMARK]
                  group: rbac.authorization.k8s.io
                  mode: watch
                  name: clusterroles
                - exclude_watch_type: [BOOKMARK]
                  group: rbac.authorization.k8s.io
                  mode: watch
                  name: clusterrolebindings
            # CRD-backed kinds (Istio, Gateway API) live in their own receiver
            # so that they are kept apart from the core kinds above.
            k8sobjects/topology-crd:
              include_initial_state: true
              kube_api_burst: 20
              kube_api_qps: 10
              objects:
                - exclude_watch_type: [BOOKMARK]
                  group: networking.istio.io
                  mode: watch
                  name: virtualservices
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: networking.istio.io
                  mode: watch
                  name: destinationrules
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: networking.istio.io
                  mode: watch
                  name: serviceentries
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: networking.istio.io
                  mode: watch
                  name: gateways
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: security.istio.io
                  mode: watch
                  name: authorizationpolicies
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: security.istio.io
                  mode: watch
                  name: peerauthentications
                  namespaces: "{{ topology_required_namespaces }}"
                # The Gateway API CRDs are always installed, so these are not optional.
                - exclude_watch_type: [BOOKMARK]
                  group: gateway.networking.k8s.io
                  mode: watch
                  name: httproutes
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: gateway.networking.k8s.io
                  mode: watch
                  name: gateways
                  namespaces: "{{ topology_required_namespaces }}"
            k8sobjects/topology-namespaced:
              include_initial_state: true
              kube_api_burst: 40
              kube_api_qps: 20
              objects:
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: pods
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: services
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: discovery.k8s.io
                  mode: watch
                  name: endpointslices
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: persistentvolumeclaims
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: configmaps
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: serviceaccounts
                  namespaces: "{{ topology_required_namespaces }}"
                # Secret data is stripped by the transform/strip-secrets processor.
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: secrets
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: rbac.authorization.k8s.io
                  mode: watch
                  name: roles
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: rbac.authorization.k8s.io
                  mode: watch
                  name: rolebindings
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: apps
                  mode: watch
                  name: deployments
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: apps
                  mode: watch
                  name: daemonsets
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: apps
                  mode: watch
                  name: statefulsets
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: apps
                  mode: watch
                  name: replicasets
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: batch
                  mode: watch
                  name: jobs
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: batch
                  mode: watch
                  name: cronjobs
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: autoscaling
                  mode: watch
                  name: horizontalpodautoscalers
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: networking.k8s.io
                  mode: watch
                  name: ingresses
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: networking.k8s.io
                  mode: watch
                  name: networkpolicies
                  namespaces: "{{ topology_required_namespaces }}"
          service:
            pipelines:
              logs/events:
                exporters:
                  - otlp/kubernetes-events
                receivers:
                  - k8sobjects/events
              logs/infrastructure:
                exporters:
                  - otlp/kubernetes-infrastructure
                receivers:
                  - k8sobjects/infrastructure
              logs/topology:
                exporters:
                  - otlp/kubernetes-topology
                processors:
                  - transform/strip-secrets
                receivers:
                  - k8sobjects/topology-namespaced
                  - k8sobjects/topology-cluster
                  - k8sobjects/topology-crd
        image: quay.io/it-bench/opentelemetry-collector:2.0.0
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        serviceAccount: kubernetes-topology
    state: present
    wait: true
    wait_condition:
      reason: Reconciled
      status: "True"
      type: Ready
  vars:
    topology_required_namespaces: "{{ tools_recordable_namespaces.resources | map(attribute='metadata.name') }}"

- name: Deploy topology writer
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels:
          "app.kubernetes.io/name": itbench-topology-writer
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: itbench-topology-writer
        namespace: "{{ tools_namespace_itbench_observability }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            "app.kubernetes.io/name": itbench-topology-writer
            "itbench.io/ansible-role": tools
            "itbench.io/layer": data
        template:
          metadata:
            labels:
              "app.kubernetes.io/name": itbench-topology-writer
              "itbench.io/ansible-role": tools
              "itbench.io/layer": data
          spec:
            containers:
              - env:
                  - name: CLICKHOUSE_HOST
                    value: "{{ tools_clickhouse_endpoint.tcp }}"
                  - name: RECORDING_START_TIMESTAMP
                    value: "{{ '%Y-%m-%dT%H:%M:%SZ' | ansible.builtin.strftime(now(utc=true).timestamp() - (tools_benchmark_duration_minutes * 60)) }}"
                  - name: POLL_INTERVAL_SECONDS
                    value: "2"
                envFrom:
                  - secretRef:
                      name: user-topology-credentials
                image: quay.io/it-bench/topology-writer:1.0.0
                imagePullPolicy: IfNotPresent
                name: writer
                resources:
                  limits:
                    memory: 256Mi
                  requests:
                    cpu: 50m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
    state: present
    wait: true
