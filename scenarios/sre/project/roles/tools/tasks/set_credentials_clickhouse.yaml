---
- name: Retrieve secret containing Clickhouse admin user credentials
  kubernetes.core.k8s_info:
    kind: Secret
    name: user-admin-credentials
    namespace: "{{ tools_namespace_itbench_observability }}"
  register: tools_clickhouse_admin_user_secret

- name: Verify that object exists
  ansible.builtin.assert:
    fail_msg: Unable to find admin user secret for main Clickhouse cluster. Please verify that Clickhouse is installed.
    success_msg: Found admin user secret information for main Clickhouse cluster.
    that:
      - tools_clickhouse_admin_user_secret.api_found
      - tools_clickhouse_admin_user_secret.resources | ansible.builtin.length == 1

- name: Extract Clickhouse user credentials
  ansible.builtin.set_fact:
    tools_clickhouse_password: |- # pragma: allowlist secret
      {{
        tools_clickhouse_admin_user_secret.resources[0].data.CLICKHOUSE_PASSWORD |
        ansible.builtin.b64decode
      }}
    tools_clickhouse_username: |-
      {{
        tools_clickhouse_admin_user_secret.resources[0].data.CLICKHOUSE_USER |
        ansible.builtin.b64decode
      }}
