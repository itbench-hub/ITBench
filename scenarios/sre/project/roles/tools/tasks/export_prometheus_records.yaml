---
- name: Create ServiceAccount for Prometheus recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: itbench-prometheus-recorder
        namespace: "{{ tools_namespace_itbench_observability }}"
    state: present

- name: Create ClusterRoleBinding for Prometheus recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: itbench-prometheus-recorder
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ 'monitoring-alertmanager-api-reader' if tools_cluster.platform == 'openshift' else 'monitoring-prometheus-api-reader' }}"
      subjects:
        - kind: ServiceAccount
          name: itbench-prometheus-recorder
          namespace: "{{ tools_namespace_itbench_observability }}"
    state: present

- name: Create PersistentVolumeClaim for Prometheus Recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: itbench-prometheus-recorder-records
        namespace: "{{ tools_namespace_itbench_observability }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        volumeMode: Filesystem
    state: present

- name: Install Kubernetes Job for Prometheus Recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: itbench-prometheus-recorder
        namespace: "{{ tools_namespace_itbench_observability }}"
      spec:
        template:
          spec:
            containers:
              - env:
                  - name: OUTPUT_DIR
                    value: /records
                  - name: PROMETHEUS_ENDPOINT
                    value: "{{ tools_thanos_endpoint.http if tools_cluster.platform == 'openshift' else tools_prometheus_endpoint.http }}"
                  - name: RECORDING_START_TIMESTAMP
                    value: "{{ '%Y-%m-%dT%H:%M:%SZ' | ansible.builtin.strftime(now(utc=true).timestamp() - (tools_benchmark_duration_minutes * 60)) }}"
                  - name: RECORDING_END_TIMESTAMP
                    value: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
                  - name: NAMESPACES
                    value: >-
                      {{
                        tools_recordable_namespaces.resources |
                        map(attribute='metadata.name') |
                        ansible.builtin.join(',')
                      }}
                  - name: RECORDING_INTERVAL_SECONDS
                    value: "60"
                image: quay.io/it-bench/prometheus-recorder:1.0.0@sha256:57b130b1c89f0f000235aba279cfda0d064aec03d225ef6d5a6a0ad06eb0aad4
                name: recorder
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - mountPath: /records
                    name: records
            restartPolicy: Never
            securityContext:
              fsGroup: 1001
              runAsNonRoot: true
              runAsUser: 1001
              seccompProfile:
                type: RuntimeDefault
            serviceAccountName: itbench-prometheus-recorder
            volumes:
              - name: records
                persistentVolumeClaim:
                  claimName: itbench-prometheus-recorder-records
    state: present
    wait: true
    wait_condition:
      status: "True"
      type: Complete
    wait_timeout: 300

- name: Export Prometheus records
  block:
    - name: Create temporary directory for Prometheus records
      ansible.builtin.tempfile:
        prefix: prometheus
        state: directory
      register: tools_export_directory

    - name: Import copy tasks
      ansible.builtin.import_tasks:
        file: copy_recorder_files.yaml
      vars:
        tools_recorder_instance_name: itbench-prometheus-recorder
  always:
    - name: Delete temporary directory for Prometheus records
      ansible.builtin.file:
        path: "{{ tools_export_directory.path }}"
        state: absent
