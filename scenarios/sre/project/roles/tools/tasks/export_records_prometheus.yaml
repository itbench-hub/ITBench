---
- name: Create PersistentVolumeClaim for Prometheus Recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: itbench-prometheus-records
        namespace: "{{ tools_itbench_namespace_observability }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        volumeMode: Filesystem
    state: present

- name: Create ServiceAccount for Prometheus recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: itbench-prometheus-recorder
        namespace: "{{ tools_itbench_namespace_observability }}"
    state: present

- name: Create ClusterRoleBinding for Prometheus recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: itbench-prometheus-recorder
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ 'monitoring-alertmanager-api-reader' if tools_cluster.platform == 'openshift' else 'monitoring-prometheus-api-reader' }}"
      subjects:
        - kind: ServiceAccount
          name: itbench-prometheus-recorder
          namespace: "{{ tools_itbench_namespace_observability }}"
    state: present

- name: Create PersistentVolumeClaim for Prometheus Recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: itbench-prometheus-recorder-records
        namespace: "{{ tools_itbench_namespace_observability }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        volumeMode: Filesystem
    state: present

- name: Install Kubernetes Job for Prometheus Recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": data
        name: itbench-prometheus-recorder
        namespace: "{{ tools_itbench_namespace_observability }}"
      spec:
        template:
          spec:
            containers:
              - env:
                  - name: OUTPUT_DIR
                    value: /records
                  - name: PROMETHEUS_ENDPOINT
                    value: "{{ tools_openshift_fqdn_thanos_querier if tools_cluster.platform == 'openshift' else kubernetes_fqdn_prometheus }}"
                  - name: RECORDING_START_TIMESTAMP
                    value: "{{ '%Y-%m-%dT%H:%M:%SZ' | ansible.builtin.strftime(now(utc=true).timestamp() - (tools_benchmark_duration_minutes * 60)) }}"
                  - name: RECORDING_END_TIMESTAMP
                    value: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
                  - name: NAMESPACES
                    value: >-
                      {{
                        tools_recordable_namespaces.resources |
                        map(attribute='metadata.name') |
                        ansible.builtin.join(',')
                      }}
                  - name: RECORDING_INTERVAL_SECONDS
                    value: "60"
                image: quay.io/it-bench/prometheus-recorder:1.0.0@sha256:76d68496dde0ab2b1f5077dc7bdd6efc6c82a291cb5a3e1d6da1c51cf211d20d
                name: recorder
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - mountPath: /records
                    name: records
            restartPolicy: Never
            securityContext:
              fsGroup: 1001
              runAsNonRoot: true
              runAsUser: 1001
              seccompProfile:
                type: RuntimeDefault
            serviceAccountName: itbench-prometheus-recorder
            volumes:
              - name: records
                persistentVolumeClaim:
                  claimName: itbench-prometheus-records
    state: present
    wait: true
    wait_condition:
      status: "True"
      type: Complete
    wait_timeout: 300
  vars:
    kubernetes_fqdn_prometheus: >-
      {{
        "https://%s-prometheus.%s.svc.cluster.local:%i" |
        ansible.builtin.format(
          tools_helm_release_kube_prometheus_stack,
          tools_itbench_namespace_observability,
          tools_itbench_prometheus_proxy_port
        )
      }}

- name: Export Prometheus records
  ansible.builtin.import_tasks:
    file: export_records.yaml
  vars:
    recorder_persistent_volume_claim: itbench-prometheus-records
