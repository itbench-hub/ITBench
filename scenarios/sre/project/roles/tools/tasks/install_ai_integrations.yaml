---
- name: Create ServiceAccounts for agent diagnosis and remediation
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: ServiceAccount
      automountServiceAccountToken: false
      metadata:
        labels:
          "itbench.io/agent-mission": "{{ mission }}"
          "itbench.io/ansible-role": tools
          "itbench.io/layer": ai-integration
        name: "agent-{{ mission }}"
        namespace: "{{ tools_namespace_itbench_agents }}"
    state: present
  loop:
    - diagnosis
    - remediation
  loop_control:
    label: serviceaccount/{{ mission }}
    loop_var: mission

# Namespaced, read-only access. Intentionally excludes Secrets, pods/exec, RBAC objects and ServiceAccount tokens.
- name: Create ClusterRole for agent diagnosis
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        labels:
          "itbench.io/agent-mission": diagnosis
          "itbench.io/ansible-role": tools
          "itbench.io/layer": ai-integration
        name: agent-diagnosis
      rules:
        - apiGroups:
            - ""
          resources:
            - configmaps
            - endpoints
            - events
            - limitranges
            - persistentvolumeclaims
            - pods
            - pods/log
            - resourcequotas
            - services
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - apps
          resources:
            - daemonsets
            - deployments
            - replicasets
            - statefulsets
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - autoscaling
          resources:
            - horizontalpodautoscalers
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - batch
          resources:
            - cronjobs
            - jobs
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - discovery.k8s.io
          resources:
            - endpointslices
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - events.k8s.io
          resources:
            - events
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - gateway.networking.k8s.io
          resources:
            - httproutes
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - metrics.k8s.io
          resources:
            - pods
          verbs:
            - get
            - list
        - apiGroups:
            - networking.istio.io
          resources:
            - destinationrules
            - virtualservices
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - networking.k8s.io
          resources:
            - ingresses
            - networkpolicies
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - policy
          resources:
            - poddisruptionbudgets
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - security.istio.io
          resources:
            - authorizationpolicies
            - peerauthentications
          verbs:
            - get
            - list
            - watch
    state: present

