- name: Create ValidatingAdmissionPolicy restricting agent writes to fault injectable namespaces
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicy
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": ai-integration
        name: itbench-agent-inject-namespaces-only
      spec:
        failurePolicy: Fail
        matchConditions:
          - name: agent-service-accounts-only
            expression: >-
              request.userInfo.username.startsWith('system:serviceaccount:{{ tools_namespace_itbench_agents }}:agent-')
          # Reviews are cluster-scoped, read-only questions (`kubectl auth can-i`, `kubectl auth whoami`).
          - name: skip-reviews
            expression: >-
              !(request.resource.group in ['authentication.k8s.io', 'authorization.k8s.io'])
        matchConstraints:
          resourceRules:
            - apiGroups:
                - "*"
              apiVersions:
                - "*"
              operations:
                - CREATE
                - UPDATE
                - DELETE
                - CONNECT
              resources:
                - "*/*"
        validations:
          - expression: >-
              namespaceObject != null &&
              has(namespaceObject.metadata.labels) &&
              'itbench.io/inject' in namespaceObject.metadata.labels &&
              namespaceObject.metadata.labels['itbench.io/inject'] == 'true'
            message: Agents may only modify objects in namespaces labeled `itbench.io/inject=true`.
            reason: Forbidden
    state: present

- name: Create ValidatingAdmissionPolicyBinding for agent restrictions
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicyBinding
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": ai-integration
        name: itbench-agent-inject-namespaces-only
      spec:
        policyName: itbench-agent-inject-namespaces-only
        validationActions:
          - Deny
    state: present
