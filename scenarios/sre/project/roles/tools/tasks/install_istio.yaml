---
- name: Install Istio on Kubernetes
  when:
    tools_cluster.platform == "kubernetes"
  block:
    - name: Create Namespace for Istio
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        state: present
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            labels:
              "app.kubernetes.io/component": istio
              "app.kubernetes.io/managed-by": ITBench
              "prometheus.itbench.io/monitor": "true"
            name: "{{ tools_releases.istio_base.namespace }}"

    - name: Install Istio Base (CRDs)
      kubernetes.core.helm:
        chart_ref: "oci://ghcr.io/istio/release/charts/base"
        chart_version: "1.31.1"
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        release_name: "{{ tools_releases.istio_base.name }}"
        release_namespace: "{{ tools_releases.istio_base.namespace }}"
        release_state: present
        values:
          profile: ambient
        wait: true

    - name: Install Istiod Control Plane
      kubernetes.core.helm:
        chart_ref: "oci://ghcr.io/istio/release/charts/istiod"
        chart_version: "1.31.1"
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        release_name: "{{ tools_releases.istio_istiod.name }}"
        release_namespace: "{{ tools_releases.istio_istiod.namespace }}"
        release_state: present
        values:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: node-role.itbench.io/sandbox
                    operator: DoesNotExist
          meshConfig:
            enablePrometheusMerge: false
            enableTracing: true
            extensionProviders:
              - name: jaeger
                opentelemetry:
                  port: 4317
                  service: "{{ tools_operands.opentelemetry_collector.jaeger.name }}-collector.{{ tools_operands.opentelemetry_collector.jaeger.namespace }}.svc.cluster.local"
              - name: opentelemetry
                envoyOtelAls:
                  port: 4317
                  service: "{{ tools_operands.opentelemetry_collector.istio.name }}-collector.{{ tools_operands.opentelemetry_collector.istio.namespace }}.svc.cluster.local"
          profile: ambient
        wait: true

    - name: Create Telemetry
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: telemetry.istio.io/v1
          kind: Telemetry
          metadata:
            name: istio-telemetry
            namespace: "{{ tools_releases.istio_istiod.namespace }}"
          spec:
            accessLogging:
              - providers:
                  - name: opentelemetry
            tracing:
              - providers:
                  - name: jaeger
                randomSamplingPercentage: 0
        state: present

    - name: Create ServiceMonitor for Control Plane
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: "{{ tools_releases.istio_istiod.name }}"
            namespace: "{{ tools_releases.istio_istiod.namespace }}"
          spec:
            selector:
              matchLabels:
                "app.kubernetes.io/name": "{{ tools_releases.istio_istiod.name }}"
                "app.kubernetes.io/part-of": istio
            endpoints:
              - interval: 30s
                port: http-monitoring
        state: present

    - name: Install Istio CNI Node Agent
      kubernetes.core.helm:
        chart_ref: "oci://ghcr.io/istio/release/charts/cni"
        chart_version: "1.31.1"
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        release_name: "{{ tools_releases.istio_cni.name }}"
        release_namespace: "{{ tools_releases.istio_cni.namespace }}"
        release_state: present
        values:
          profile: ambient
        wait: true

    - name: Create PodMonitor for CNI Pods
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: monitoring.coreos.com/v1
          kind: PodMonitor
          metadata:
            name: "{{ tools_releases.istio_cni.name }}"
            namespace: "{{ tools_releases.istio_cni.namespace}}"
          spec:
            selector:
              matchLabels:
                "app.kubernetes.io/name": "{{ tools_releases.istio_cni.name }}"
                "app.kubernetes.io/part-of": istio
            podMetricsEndpoints:
              - interval: 30s
                port: metrics
        state: present

    - name: Install Istio ZTunnel
      kubernetes.core.helm:
        chart_ref: "oci://ghcr.io/istio/release/charts/ztunnel"
        chart_version: "1.31.1"
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        release_name: "{{ tools_releases.istio_ztunnel.name }}"
        release_namespace: "{{ tools_releases.istio_ztunnel.namespace }}"
        release_state: present
        values:
          profile: ambient
        wait: true

    - name: Create PodMonitor for ZTunnel Pods
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: monitoring.coreos.com/v1
          kind: PodMonitor
          metadata:
            name: "{{ tools_releases.istio_ztunnel.name }}"
            namespace: "{{ tools_releases.istio_ztunnel.namespace }}"
          spec:
            selector:
              matchLabels:
                "app.kubernetes.io/name": "{{ tools_releases.istio_ztunnel.name }}"
                "app.kubernetes.io/part-of": istio
            podMetricsEndpoints:
              - interval: 30s
                port: ztunnel-stats
        state: present

    - name: Create ConfigMap for Istio Gateway
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ tools_kubernetes_gateway_istio.name }}-options"
            namespace: "{{ tools_kubernetes_gateway_istio.namespace }}"
          data:
            deployment: |
              spec:
                template:
                  spec:
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                          - matchExpressions:
                            - key: node-role.itbench.io/sandbox
                              operator: DoesNotExist

    - name: Create Istio implemented Gateway
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: "{{ tools_kubernetes_gateway_istio.name }}"
            namespace: "{{ tools_kubernetes_gateway_istio.namespace }}"
          spec:
            infrastructure:
              parametersRef:
                group: ""
                kind: ConfigMap
                name: "{{ tools_kubernetes_gateway_istio.name }}-options"
            gatewayClassName: istio
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: Selector
                    selector:
                      matchLabels:
                        "itbench.io/gateway-access": shared
        state: present
        wait: true
        wait_condition:
          status: "True"
          type: Programmed

    - name: Create PodMonitor for Istio Kubernetes Gateway
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: monitoring.coreos.com/v1
          kind: PodMonitor
          metadata:
            name: "{{ tools_kubernetes_gateway_istio.name }}"
            namespace: "{{ tools_kubernetes_gateway_istio.namespace }}"
          spec:
            selector:
              matchLabels:
                "gateway.networking.k8s.io/gateway-name": "{{ tools_kubernetes_gateway_istio.name }}"
            podMetricsEndpoints:
              - interval: 30s
                port: metrics
        state: present

- name: Install Service Mesh 3 (Istio) on OpenShift
  when:
    tools_cluster.platform == "openshift"
  block:
    - name: Create the subscription for Service Mesh 3
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: servicemeshoperator3
            namespace: openshift-operators
          spec:
            channel: stable
            installPlanApproval: Automatic
            name: servicemeshoperator3
            source: redhat-operators
            sourceNamespace: openshift-marketplace
        state: present
        wait: true
        wait_condition:
          type: CatalogSourcesUnhealthy
          status: "False"
        wait_timeout: 300

    - name: Create Namespaces for Istio
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          - apiVersion: v1
            kind: Namespace
            metadata:
              labels:
                "app.kubernetes.io/component": istio
                "app.kubernetes.io/managed-by": ITBench
                "prometheus.itbench.io/monitor": "true"
              name: istio-system
          - apiVersion: v1
            kind: Namespace
            metadata:
              labels:
                "app.kubernetes.io/component": istio
                "app.kubernetes.io/managed-by": ITBench
                "prometheus.itbench.io/monitor": "true"
              name: istio-cni
          - apiVersion: v1
            kind: Namespace
            metadata:
              labels:
                "app.kubernetes.io/component": istio
                "app.kubernetes.io/managed-by": ITBench
                "prometheus.itbench.io/monitor": "true"
              name: ztunnel
        state: present

    - name: Install Istio
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: sailoperator.io/v1
          kind: Istio
          metadata:
            name: default
          spec:
            namespace: istio-system
            profile: ambient
            values:
              global:
                nativeNftables: true  # Add this line if deploying on RHEL 10 or RHCOS 10 nodes
              pilot:
                trustedZtunnelNamespace: ztunnel
              meshConfig:
                discoverySelectors:
                - matchLabels:
                    istio-discovery: enabled
        state: present

    - name: Install IstioCNI
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: sailoperator.io/v1
          kind: IstioCNI
          metadata:
            name: default
          spec:
            namespace: istio-cni
            profile: ambient
            values:
              global:
                nativeNftables: true  # Add this line if deploying on RHEL 10 or RHCOS 10 nodes
        state: present

    - name: Install Ztunnel
      kubernetes.core.k8s:
        kubeconfig: "{{ tools_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: sailoperator.io/v1alpha1
          kind: ZTunnel
          metadata:
            name: default
          spec:
            namespace: ztunnel
            profile: ambient
        state: present
