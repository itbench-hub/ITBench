---
- name: Install Istio Service Mesh on Kubernetes
  when:
    - tools_cluster.platform == "kubernetes"
  block:
    - name: Create Namespace for Istio
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/inject": "false"
              "itbench.io/layer": networking
              "itbench.io/monitor": "true"
            name: "{{ tools_namespace_istio }}"
        state: present

    - name: Install Istio Base (CRDs)
      kubernetes.core.helm:
        chart_ref: "oci://ghcr.io/istio/release/charts/base"
        chart_version: "1.31.2"
        release_name: "{{ tools_helm_release_istio_base }}"
        release_namespace: "{{ tools_namespace_istio }}"
        release_state: present
        release_values:
          profile: ambient
        wait: true

    - name: Install Istiod Control Plane
      kubernetes.core.helm:
        chart_ref: "oci://ghcr.io/istio/release/charts/istiod"
        chart_version: "1.31.2"
        release_name: "{{ tools_helm_release_istio_istiod }}"
        release_namespace: "{{ tools_namespace_istio_istiod }}"
        release_state: present
        release_values:
          meshConfig:
            enablePrometheusMerge: false
            enableTracing: true
            extensionProviders:
              - name: jaeger
                opentelemetry:
                  port: 4317
                  service: "jaeger-collector.{{ tools_namespace_itbench_observability }}.svc.cluster.local"
              - envoyOtelAls:
                  port: 4317
                  service: "istio-collector.{{ tools_namespace_itbench_observability }}.svc.cluster.local"
                name: opentelemetry
          profile: ambient
        wait: true

    - name: Install Istio CNI Node Agent
      kubernetes.core.helm:
        chart_ref: "oci://ghcr.io/istio/release/charts/cni"
        chart_version: "1.31.2"
        release_name: "{{ tools_helm_release_istio_cni }}"
        release_namespace: "{{ tools_namespace_istio_cni }}"
        release_state: present
        release_values:
          profile: ambient
          useAppArmorAnnotation: false
        wait: true

    - name: Install Istio ZTunnel
      kubernetes.core.helm:
        chart_ref: "oci://ghcr.io/istio/release/charts/ztunnel"
        chart_version: "1.31.2"
        release_name: "{{ tools_helm_release_istio_ztunnel }}"
        release_namespace: "{{ tools_namespace_istio_ztunnel }}"
        release_state: present
        release_values:
          profile: ambient
        wait: true

- name: Install Service Mesh on OpenShift
  vars:
    operator_namespace: openshift-operators
    subscription: servicemeshoperator3
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Create Projects for Istio
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: project.openshift.io/v1
          kind: Project
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/inject": "false"
              "itbench.io/layer": networking
              "itbench.io/monitor": "true"
            name: "{{ istio_namespace }}"
        state: present
      loop: >-
        {{
          [
            tools_namespace_istio_istiod,
            tools_namespace_istio_cni,
            tools_namespace_istio_ztunnel
          ] |
          ansible.builtin.unique
        }}
      loop_control:
        label: namespace/{{ istio_namespace }}
        loop_var: istio_namespace

    - name: Create Subscription for Service Mesh 3
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": networking
            name: "{{ subscription }}"
            namespace: "{{ operator_namespace }}"
          spec:
            channel: stable
            installPlanApproval: Automatic
            name: "{{ subscription }}"
            source: redhat-operators
            sourceNamespace: openshift-marketplace
        state: present
        wait: true
        wait_condition:
          status: "False"
          type: CatalogSourcesUnhealthy
        wait_timeout: 300

    - name: Install Istio
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: sailoperator.io/v1
          kind: Istio
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": networking
            name: default
          spec:
            namespace: "{{ tools_namespace_istio_istiod }}"
            profile: ambient
            values:
              global:
                nativeNftables: true
              meshConfig:
                discoverySelectors:
                  - matchLabels:
                      istio-discovery: enabled
              pilot:
                trustedZtunnelNamespace: "{{ tools_namespace_istio_ztunnel }}"
        state: present

    - name: Install IstioCNI
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: sailoperator.io/v1
          kind: IstioCNI
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": networking
            name: default
          spec:
            namespace: "{{ tools_namespace_istio_cni }}"
            profile: ambient
            values:
              global:
                nativeNftables: true
        state: present

    - name: Install Ztunnel
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: sailoperator.io/v1alpha1
          kind: ZTunnel
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": networking
            name: default
          spec:
            namespace: "{{ tools_namespace_istio_ztunnel }}"
            profile: ambient
        state: present

- name: Create Telemetry
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: telemetry.istio.io/v1
      kind: Telemetry
      metadata:
        name: istio-telemetry
        namespace: "{{ tools_namespace_istio_istiod }}"
      spec:
        accessLogging:
          - providers:
              - name: opentelemetry
        tracing:
          - providers:
              - name: jaeger
            randomSamplingPercentage: 10
    state: present
  when:
    - tools_observability_enabled

- name: Create ServiceMonitor for Control Plane
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: "{{ tools_helm_release_istio_istiod }}"
        namespace: "{{ tools_namespace_istio_istiod }}"
      spec:
        endpoints:
          - interval: 30s
            port: http-monitoring
        selector:
          matchLabels:
            "app.kubernetes.io/name": "{{ tools_helm_release_istio_istiod }}"
            "app.kubernetes.io/part-of": istio
    state: present

- name: Create PodMonitor for CNI Pods
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: "{{ tools_helm_release_istio_cni }}"
        namespace: "{{ tools_namespace_istio_cni }}"
      spec:
        podMetricsEndpoints:
          - interval: 30s
            port: metrics
        selector:
          matchLabels:
            "app.kubernetes.io/name": "{{ tools_helm_release_istio_cni }}"
            "app.kubernetes.io/part-of": istio
    state: present

- name: Create PodMonitor for ZTunnel Pods
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: "{{ tools_helm_release_istio_ztunnel }}"
        namespace: "{{ tools_namespace_istio_ztunnel }}"
      spec:
        podMetricsEndpoints:
          - interval: 30s
            port: ztunnel-stats
        selector:
          matchLabels:
            "app.kubernetes.io/name": "{{ tools_helm_release_istio_ztunnel }}"
            "app.kubernetes.io/part-of": istio
    state: present
