---
- name: Create Prometheus in-cluster endpoint on Kubernetes
  when:
    - tools_cluster.platform == "kubernetes"
  block:
    - name: Retrieve Service for Prometheus
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: "{{ tools_helm_release_kube_prometheus_stack }}-prometheus"
        namespace: "{{ tools_namespace_itbench_observability }}"
      register: tools_prometheus_service

    - name: Validate that Prometheus service exists
      ansible.builtin.assert:
        fail_msg: Prometheus service not found. Please verify that Prometheus was successfully installed.
        success_msg: Prometheus service found.
        that:
          - tools_prometheus_service.api_found
          - tools_prometheus_service.resources | ansible.builtin.length == 1

    - name: Create Prometheus in-cluster endpoints
      ansible.builtin.set_fact:
        tools_prometheus_endpoint:
          http: |-
            {{
              "https://" +
              (
                [
                  tools_prometheus_service.resources[0].metadata.name,
                  tools_prometheus_service.resources[0].metadata.namespace,
                  "svc",
                  "cluster",
                  "local"
                ] |
                ansible.builtin.join(".")
              ) +
              ":8443/observability/prometheus"
            }}
        tools_thanos_endpoint:
          http: ""

- name: Create Prometheus in-cluster endpoint on OpenShift
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Retrieve Service for Prometheus
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: prometheus-k8s
        namespace: "{{ tools_namespace_openshift_monitoring }}"
      register: tools_prometheus_service

    - name: Validate that Prometheus service exists
      ansible.builtin.assert:
        fail_msg: Prometheus service not found. Please verify that Prometheus was successfully installed.
        success_msg: Prometheus service found.
        that:
          - tools_prometheus_service.api_found
          - tools_prometheus_service.resources | ansible.builtin.length == 1

    - name: Create Prometheus in-cluster endpoints
      ansible.builtin.set_fact:
        tools_prometheus_endpoint:
          http: |-
            {{
              "https://" +
              (
                [
                  tools_prometheus_service.resources[0].metadata.name,
                  tools_prometheus_service.resources[0].metadata.namespace,
                  "svc",
                  "cluster",
                  "local"
                ] |
                ansible.builtin.join(".")
              ) +
              ":9090"
            }}

    - name: Retrieve Service for Thanos
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: thanos-querier
        namespace: openshift-monitoring
      register: tools_thanos_service

    - name: Validate that Thanos service exists
      ansible.builtin.assert:
        fail_msg: Thanos service not found. Please verify that Thanos was successfully installed.
        success_msg: Thanos service found.
        that:
          - tools_thanos_service.api_found
          - tools_thanos_service.resources | ansible.builtin.length == 1

    - name: Create Prometheus in-cluster endpoints
      ansible.builtin.set_fact:
        tools_thanos_endpoint:
          http: |-
            {{
              "https://" +
              (
                [
                  tools_thanos_service.resources[0].metadata.name,
                  tools_thanos_service.resources[0].metadata.namespace,
                  "svc",
                  "cluster",
                  "local"
                ] |
                ansible.builtin.join(".")
              ) +
              ":9091"
            }}
