---
- name: Create Namespace for OpenTelemetry Collectors
  kubernetes.core.k8s:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        labels:
          "itbench.io/gateway-access": shared
          "prometheus.itbench.io/monitor": "true"
        name: "{{ tools_namespaces.opentelemetry_collector }}"
    state: present

- name: Import variable setting task
  ansible.builtin.import_tasks:
    file: set_credentials_clickhouse.yaml
  when:
    - tools_clickhouse_username is not defined
    - tools_clickhouse_password is not defined

- name: Import Clickhouse endpoint variable setting tasks
  ansible.builtin.import_tasks:
    file: set_internal_endpoints_clickhouse.yaml
  when:
    - tools_clickhouse_endpoint.http is not defined

- name: Install OpenTelemetry Collector for Istio
  kubernetes.core.k8s:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: "{{ tools_operands.opentelemetry_collector.istio.name }}"
        namespace: "{{ tools_operands.opentelemetry_collector.istio.namespace }}"
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.itbench.io/sandbox
                      operator: DoesNotExist
        image: quay.io/it-bench/opentelemetry-collector:2.0.0@sha256:0389cbe6f81210cc799d52a77282b61339e049a8f4b907ad8556b1ae7bea7ec2
        mode: deployment
        observability:
          metrics:
            enableMetrics: true
        config:
          service:
            pipelines:
              logs:
                exporters:
                  - debug
                  - clickhouse
                receivers:
                  - otlp
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          exporters:
            clickhouse:
              username: "{{ tools_clickhouse_username }}"
              password: "{{ tools_clickhouse_password }}" # pragma: allowlist secret
              endpoint: "{{ tools_clickhouse_endpoint.http }}"
              logs_table_name: istio_access
            debug: {}
    state: present

- name: Install OpenTelemetry Collector for Jaeger
  kubernetes.core.k8s:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: "{{ tools_operands.opentelemetry_collector.jaeger.name }}"
        namespace: "{{ tools_operands.opentelemetry_collector.jaeger.namespace }}"
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.itbench.io/sandbox
                      operator: DoesNotExist
        image: quay.io/jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
        mode: deployment
        observability:
          metrics:
            enableMetrics: true
        ports:
          - name: query-grpc
            port: 16685
          - name: query-http
            port: 16686
        config:
          service:
            extensions:
              - jaeger_storage
              - jaeger_query
            pipelines:
              traces:
                receivers:
                  - otlp
                exporters:
                  - debug
                  - jaeger_storage_exporter
          extensions:
            jaeger_query:
              base_path: /jaeger
              storage:
                traces: traces_store
            jaeger_storage:
              backends:
                traces_store:
                  opensearch:
                    server_urls:
                      - http://opensearch-cluster-master.{{ tools_releases.opensearch.namespace }}.svc.cluster.local:9200
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          exporters:
            debug: {}
            jaeger_storage_exporter:
              trace_storage: traces_store
    state: present

- name: Create ServiceAccount for Kubernetes Telemetry Collector
  kubernetes.core.k8s:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ tools_operands.opentelemetry_collector.kubernetes.name }}"
        namespace: "{{ tools_namespaces.opentelemetry_collector }}"
    state: present

- name: Create ClusterRole for Kubernetes Telemetry Collector
  kubernetes.core.k8s:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        labels:
          "app.kubernetes.io/component": opentelemetry-collector
          "app.kubernetes.io/managed-by": ITBench
        name: "{{ tools_operands.opentelemetry_collector.kubernetes.name }}"
      rules:
        - apiGroups:
            - ""
          resources:
            - pods
            - services
            - endpoints
            - persistentvolumeclaims
            - persistentvolumes
            - configmaps
            - serviceaccounts
            - nodes
            - namespaces
            - resourcequotas
            - limitranges
            - replicationcontrollers
            - events
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - events.k8s.io
          resources:
            - events
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - apps
          resources:
            - deployments
            - daemonsets
            - statefulsets
            - replicasets
          verbs:
            - get
            - list
        - apiGroups:
            - batch
          resources:
            - jobs
            - cronjobs
          verbs:
            - get
            - list
        - apiGroups:
            - networking.k8s.io
          resources:
            - ingresses
            - networkpolicies
          verbs:
            - get
            - list
        - apiGroups:
            - rbac.authorization.k8s.io
          resources:
            - roles
            - rolebindings
            - clusterroles
            - clusterrolebindings
          verbs:
            - get
            - list
        - apiGroups:
            - storage.k8s.io
          resources:
            - storageclasses
            - volumeattachments
          verbs:
            - get
            - list
        - apiGroups:
            - autoscaling
          resources:
            - horizontalpodautoscalers
          verbs:
            - get
            - list
        - apiGroups:
            - policy
          resources:
            - poddisruptionbudgets
          verbs:
            - get
            - list
        - apiGroups:
            - apiextensions.k8s.io
          resources:
            - customresourcedefinitions
          verbs:
            - get
            - list
    state: present

- name: Create ClusterRoleBinding for Kubernetes Telemetry Collector
  kubernetes.core.k8s:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        labels:
          "app.kubernetes.io/component": opentelemetry-collector
          "app.kubernetes.io/managed-by": ITBench
        name: "{{ tools_operands.opentelemetry_collector.kubernetes.name }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ tools_operands.opentelemetry_collector.kubernetes.name }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ tools_operands.opentelemetry_collector.kubernetes.name }}"
          namespace: "{{ tools_namespaces.opentelemetry_collector }}"
    state: present

- name: Install OpenTelemetry Collector for Kubernetes Telemetry
  kubernetes.core.k8s:
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: "{{ tools_operands.opentelemetry_collector.kubernetes.name }}"
        namespace: "{{ tools_namespaces.opentelemetry_collector }}"
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.itbench.io/sandbox
                      operator: DoesNotExist
        image: quay.io/it-bench/opentelemetry-collector:2.0.0@sha256:0389cbe6f81210cc799d52a77282b61339e049a8f4b907ad8556b1ae7bea7ec2
        mode: deployment
        observability:
          metrics:
            enableMetrics: true
        serviceAccount: "{{ tools_operands.opentelemetry_collector.kubernetes.name }}"
        config:
          service:
            pipelines:
              logs/events:
                receivers:
                  - k8sobjects/events
                exporters:
                  - debug
                  - clickhouse/events
              logs/objects:
                receivers:
                  - k8sobjects/objects
                exporters:
                  - debug
                  - clickhouse/objects
          receivers:
            k8sobjects/events:
              objects:
                - name: events
                  mode: watch
                  group: events.k8s.io
                - name: events
                  mode: watch
                  group: ""
            k8sobjects/objects:
              objects:
                - name: pods
                  mode: pull
                  interval: 5m
                - name: services
                  mode: pull
                  interval: 5m
                - name: endpoints
                  mode: pull
                  interval: 5m
                - name: configmaps
                  mode: pull
                  interval: 5m
                - name: serviceaccounts
                  mode: pull
                  interval: 5m
                - name: namespaces
                  mode: pull
                  interval: 5m
                - name: nodes
                  mode: pull
                  interval: 5m
                - name: persistentvolumeclaims
                  mode: pull
                  interval: 5m
                - name: persistentvolumes
                  mode: pull
                  interval: 5m
                - name: resourcequotas
                  mode: pull
                  interval: 5m
                - name: limitranges
                  mode: pull
                  interval: 5m
                - name: replicationcontrollers
                  mode: pull
                  interval: 5m
                - name: deployments
                  mode: pull
                  interval: 5m
                  group: apps
                - name: daemonsets
                  mode: pull
                  interval: 5m
                  group: apps
                - name: statefulsets
                  mode: pull
                  interval: 5m
                  group: apps
                - name: replicasets
                  mode: pull
                  interval: 5m
                  group: apps
                - name: jobs
                  mode: pull
                  interval: 5m
                  group: batch
                - name: cronjobs
                  mode: pull
                  interval: 5m
                  group: batch
                - name: ingresses
                  mode: pull
                  interval: 5m
                  group: networking.k8s.io
                - name: networkpolicies
                  mode: pull
                  interval: 5m
                  group: networking.k8s.io
                - name: roles
                  mode: pull
                  interval: 5m
                  group: rbac.authorization.k8s.io
                - name: rolebindings
                  mode: pull
                  interval: 5m
                  group: rbac.authorization.k8s.io
                - name: clusterroles
                  mode: pull
                  interval: 5m
                  group: rbac.authorization.k8s.io
                - name: clusterrolebindings
                  mode: pull
                  interval: 5m
                  group: rbac.authorization.k8s.io
                - name: storageclasses
                  mode: pull
                  interval: 5m
                  group: storage.k8s.io
                - name: volumeattachments
                  mode: pull
                  interval: 5m
                  group: storage.k8s.io
                - name: horizontalpodautoscalers
                  mode: pull
                  interval: 5m
                  group: autoscaling
                - name: poddisruptionbudgets
                  mode: pull
                  interval: 5m
                  group: policy
                - name: customresourcedefinitions
                  mode: pull
                  interval: 5m
                  group: apiextensions.k8s.io
          exporters:
            clickhouse/events:
              username: "{{ tools_clickhouse_username }}"
              password: "{{ tools_clickhouse_password }}" # pragma: allowlist secret
              endpoint: "{{ tools_clickhouse_endpoint.http }}"
              logs_table_name: kubernetes_events
            clickhouse/objects:
              username: "{{ tools_clickhouse_username }}"
              password: "{{ tools_clickhouse_password }}" # pragma: allowlist secret
              endpoint: "{{ tools_clickhouse_endpoint.http }}"
              logs_table_name: kubernetes_objects_snapshot
            debug: {}
    state: present

- name: Wait for all OpenTelemetry Collectors to stabilize
  kubernetes.core.k8s_info:
    api_version: opentelemetry.io/v1beta1
    kind: OpenTelemetryCollector
    kubeconfig: "{{ tools_cluster.kubeconfig }}"
    namespace: "{{ tools_namespaces.opentelemetry_collector }}"
    wait: true
    wait_condition:
      reason: Reconciled
      status: "True"
      type: Ready
