---
tools_itbench_clickhouse_observability: observability
tools_itbench_clickhouse_observability_port_tcp: 9000

tools_itbench_gateway_kubernetes: itbench-gateway
tools_itbench_gateway_opentelemetry_applications: itbench-otel-gateway-applications
tools_itbench_gateway_opentelemetry_applications_port_bank_of_anthos: 4322
tools_itbench_gateway_opentelemetry_applications_port_metrics: 4319
tools_itbench_gateway_opentelemetry_applications_port_microservices_demo: 4321
tools_itbench_gateway_opentelemetry_applications_port_opentelemetry_demo: 4320
tools_itbench_gateway_opentelemetry_applications_port_traces: 4317
tools_itbench_gateway_opentelemetry_infrastructure: itbench-otel-gateway-infrastructure
tools_itbench_gateway_opentelemetry_infrastructure_port_istio: 4323
tools_itbench_gateway_opentelemetry_infrastructure_port_kubernetes_events: 4320
tools_itbench_gateway_opentelemetry_infrastructure_port_kubernetes_infrastructure: 4321
tools_itbench_gateway_opentelemetry_infrastructure_port_kubernetes_topology: 4322
tools_itbench_gateway_opentelemetry_infrastructure_port_traces: 4317

tools_itbench_jaeger: jaeger
tools_itbench_jaeger_collector_port: 4317
tools_itbench_jaeger_querier_port: 16686

tools_itbench_namespace: itbench-system
tools_itbench_namespace_agents: itbench-agents
tools_itbench_namespace_observability: itbench-observability

tools_itbench_prometheus_proxy_port: 8443

tools_itbench_fqdn_clickhouse_observability: >-
  {{
    "clickhouse-%s.%s.svc.cluster.local" |
    ansible.builtin.format(
      tools_itbench_clickhouse_observability,
      tools_itbench_namespace_observability
    )
  }}
tools_itbench_fqdn_clickhouse_observability_tcp: >-
  {{
    "%s:%i" |
    ansible.builtin.format(
      tools_itbench_fqdn_clickhouse_observability,
      tools_itbench_clickhouse_observability_port_tcp
    )
  }}
