---
- name: Clear OpenTelemetry Demo discovery output directory
  ansible.builtin.file:
    path: "{{ out_directory }}"
    state: absent

- name: Render OpenTelemetry Demo Helm templates
  kubernetes.core.helm_template:
    chart_ref: "oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo"
    chart_version: "0.42.4"
    output_dir: "{{ out_directory }}"
    release_name: "{{ applications_opentelemetry_demo_helm_release_name }}"
    release_namespace: "{{ applications_namespace_opentelemetry_demo }}"
    release_values:
      grafana:
        enabled: false
      jaeger:
        enabled: false
      opensearch:
        enabled: false
      prometheus:
        enabled: false
