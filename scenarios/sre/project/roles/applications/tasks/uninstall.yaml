---
- name: Uninstall OpenTelemetry Demo (Astronomy Shop)
  kubernetes.core.helm:
    release_name: "{{ applications_opentelemetry_demo_helm_release_name }}"
    release_namespace: "{{ applications_opentelemetry_demo_namespace }}"
    release_state: absent
    wait: true

- name: Delete all application namespaces
  kubernetes.core.k8s:
    api_version: v1
    delete_all: true
    kind: Namespace
    label_selectors:
      - "itbench.io/layer=application"
    state: absent
    wait: true
