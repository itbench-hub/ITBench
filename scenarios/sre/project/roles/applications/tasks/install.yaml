---
- name: Include ITBench variables
  ansible.builtin.include_vars:
    file: "{{ [playbook_dir, 'roles', 'tools', 'vars', 'main', 'itbench.yaml'] | ansible.builtin.path_join }}"

- name: Create Namespaces for applications
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: "{{ 'project.openshift.io/v1' if applications_cluster.platform == 'openshift' else 'v1' }}"
      kind: "{{ 'Project' if applications_cluster.platform == 'openshift' else 'Namespace' }}"
      metadata:
        labels:
          "itbench.io/ansible-role": applications
          "itbench.io/inject": "true"
          "itbench.io/layer": application
          "itbench.io/monitor": "true"
          "itbench.io/record": "true"
        name: "{{ itbench_namespace.name }}"
    state: present
  loop:
    - enabled: "{{ applications_bank_of_anthos_enabled }}"
      name: "{{ applications_bank_of_anthos_namespace }}"
    - enabled: "{{ applications_microservices_demo_enabled }}"
      name: "{{ applications_microservices_demo_namespace }}"
    - enabled: "{{ applications_opentelemetry_demo_enabled }}"
      name: "{{ applications_opentelemetry_demo_namespace }}"
  loop_control:
    label: namespace/{{ itbench_namespace.name }}
    loop_var: itbench_namespace
  when:
    - itbench_namespace.enabled

- name: Label Namespace for Istio service mesh enablement
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: "{{ 'project.openshift.io/v1' if applications_cluster.platform == 'openshift' else 'v1' }}"
      kind: "{{ 'Project' if applications_cluster.platform == 'openshift' else 'Namespace' }}"
      metadata:
        labels:
          "istio.io/dataplane-mode": ambient
        name: "{{ itbench_namespace.name }}"
    state: patched
  loop:
    - enabled: "{{ applications_bank_of_anthos_enabled and applications_bank_of_anthos_service_mesh_enabled }}"
      name: "{{ applications_bank_of_anthos_namespace }}"
    - enabled: "{{ applications_microservices_demo_enabled and applications_microservices_demo_service_mesh_enabled }}"
      name: "{{ applications_microservices_demo_namespace }}"
    - enabled: "{{ applications_opentelemetry_demo_enabled and applications_opentelemetry_demo_service_mesh_enabled }}"
      name: "{{ applications_opentelemetry_demo_namespace }}"
  loop_control:
    label: namespace/{{ itbench_namespace.name }}
    loop_var: itbench_namespace
  when:
    - itbench_namespace.enabled

- name: Import Bank of Anthos installation tasks
  ansible.builtin.import_tasks:
    file: install_bank_of_anthos.yaml
  when:
    - applications_bank_of_anthos_enabled

- name: Import Microservices Demo installation tasks
  ansible.builtin.import_tasks:
    file: install_microservices_demo.yaml
  when:
    - applications_microservices_demo_enabled

- name: Import OpenTelemetry Demo installation tasks
  ansible.builtin.import_tasks:
    file: install_opentelemetry_demo.yaml
  when:
    - applications_opentelemetry_demo_enabled

- name: Import agent RBAC installation tasks
  ansible.builtin.import_tasks:
    file: install_agent_rbac.yaml
