---
# Note: The Prometheus offered by OpenShift is v2, while the one installed
#       in the chart is v3. While otel-demo supports the `otlphttp` exporter,
#       this is not easily exposed in OpenShift. So, ITBench uses the `prometheus`
#       exporter instead to support both platforms until the functionality of
#       Prometheus is the same on both platforms.

- name: Create Namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ applications_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        labels:
          prometheus.itbench.io/monitor: "true"
        name: "{{ applications_managers.opentelemetry_demo.kubernetes.namespace }}"
    state: present

- name: Import tools role for variable setting tasks
  ansible.builtin.import_role:
    name: tools
    tasks_from: set_credentials_clickhouse
  vars:
    tools_cluster:
      kubeconfig: "{{ applications_cluster.kubeconfig }}"

- name: Import tools role for variable setting tasks
  ansible.builtin.import_role:
    name: tools
    tasks_from: set_internal_endpoints
  vars:
    tools_cluster:
      kubeconfig: "{{ applications_cluster.kubeconfig }}"
      platform: "{{ applications_cluster.platform }}"

- name: Create Service Account with `anyuid` access
  when:
    - applications_cluster.platform == "openshift"
  block:
    - name: Create ServiceAccount for OpenTelemetry Demo
      kubernetes.core.k8s:
        kubeconfig: "{{ applications_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: "{{ applications_managers.opentelemetry_demo.helm.release.name }}"
            namespace: "{{ applications_managers.opentelemetry_demo.kubernetes.namespace }}"
        state: present

    - name: Create RoleBinding for access to anyuid SecurityContextConstraint
      kubernetes.core.k8s:
        kubeconfig: "{{ applications_cluster.kubeconfig }}"
        resource_definition:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          metadata:
            name: "{{ applications_managers.opentelemetry_demo.helm.release.name }}"
            namespace: "{{ applications_managers.opentelemetry_demo.kubernetes.namespace }}"
          subjects:
            - kind: ServiceAccount
              name: "{{ applications_managers.opentelemetry_demo.helm.release.name }}"
              namespace: "{{ applications_managers.opentelemetry_demo.kubernetes.namespace }}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system:openshift:scc:anyuid
        state: present

# --- Dynatrace OTLP ingest (optional). ---------------------------------------
# When the Dynatrace vendor is enabled, route the otel-demo collector's OTLP
# traces/metrics/logs to Dynatrace in addition to the in-cluster backends. The
# dataIngestToken and apiUrl are reused from the same dynakube.yaml consumed by
# the tools role (roles/tools/tasks/install_dynatrace.yaml), so no new token is
# needed. Everything here is gated on the vendor flag; when disabled the demo
# renders and installs exactly as before.
- name: Configure Dynatrace OTLP ingest for OpenTelemetry Demo
  when:
    - observability_vendors.dynatrace.enabled | ansible.builtin.default(false)
  block:
    - name: Resolve the Dynatrace DynaKube manifest path
      ansible.builtin.set_fact:
        applications_dynatrace_dynakube_path: >-
          {{
            dynatrace_dynakube_path |
            ansible.builtin.default(observability_vendors.dynatrace.dynakube_path, true)
          }}

    # Relative paths are anchored to the SRE project root (parent of the playbook
    # directory), matching install_dynatrace.yaml; absolute paths are used as-is.
    - name: Anchor a relative Dynatrace manifest path to the project root
      ansible.builtin.set_fact:
        applications_dynatrace_dynakube_path: >-
          {{
            [playbook_dir, '..', applications_dynatrace_dynakube_path]
            | ansible.builtin.path_join | ansible.builtin.realpath
          }}
      when:
        - not (applications_dynatrace_dynakube_path is ansible.builtin.abs)

    - name: Parse the Dynatrace DynaKube manifest documents
      ansible.builtin.set_fact:
        applications_dynatrace_documents: >-
          {{
            lookup('ansible.builtin.file', applications_dynatrace_dynakube_path)
            | ansible.builtin.from_yaml_all | list | ansible.builtin.reject('none') | list
          }}
      no_log: true

    - name: Derive Dynatrace ingest facts from the manifest
      vars:
        applications_dynatrace_secret: >-
          {{
            applications_dynatrace_documents
            | selectattr('kind', 'equalto', 'Secret') | list | first
          }}
        applications_dynatrace_dynakube: >-
          {{
            applications_dynatrace_documents
            | selectattr('kind', 'equalto', 'DynaKube') | list | first
          }}
      ansible.builtin.set_fact:
        # dataIngestToken is base64-encoded in the Secret's data map; decode to
        # the raw token for the Authorization header value.
        applications_dynatrace_ingest_token: "{{ applications_dynatrace_secret.data.dataIngestToken | ansible.builtin.b64decode }}"
        # OTLP endpoint is the DynaKube apiUrl (…/api) plus the OTLP v2 path.
        applications_dynatrace_otlp_endpoint: "{{ applications_dynatrace_dynakube.spec.apiUrl }}/v2/otlp"
        # Cluster name for entity correlation: explicit override, else DynaKube name.
        applications_dynatrace_cluster_name: >-
          {{
            applications_dynatrace_cluster_name |
            ansible.builtin.default(applications_dynatrace_dynakube.metadata.name, true)
          }}
      no_log: true

    - name: Create the Dynatrace OTLP ingest Secret in the demo namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ applications_cluster.kubeconfig }}"
        resource_definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: dynatrace-otlp-ingest
            namespace: "{{ applications_managers.opentelemetry_demo.kubernetes.namespace }}"
            labels:
              app.kubernetes.io/managed-by: ITBench
              itbench.io/observability-vendor: dynatrace
          type: Opaque
          stringData:
            DT_ENDPOINT: "{{ applications_dynatrace_otlp_endpoint }}"
            DT_API_TOKEN: "{{ applications_dynatrace_ingest_token }}"
        state: present
      no_log: true

    - name: Enable Dynatrace ingest in the OpenTelemetry Demo values
      ansible.builtin.set_fact:
        applications_dynatrace_ingest_enabled: true

- name: Install OpenTelemetry Demo (Astronomy Shop)
  kubernetes.core.helm:
    chart_ref: "{{ applications_managers.opentelemetry_demo.helm.chart.reference }}"
    chart_version: "{{ applications_managers.opentelemetry_demo.helm.chart.version }}"
    kubeconfig: "{{ applications_cluster.kubeconfig }}"
    release_name: "{{ applications_managers.opentelemetry_demo.helm.release.name }}"
    release_namespace: "{{ applications_managers.opentelemetry_demo.kubernetes.namespace }}"
    release_state: present
    timeout: 10m0s
    values: |-
      {{
        lookup('ansible.builtin.template', 'templates/helm/otel_demo/values.j2') |
        ansible.builtin.from_yaml
      }}
    wait: true

- name: Retrieve all pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    kubeconfig: "{{ applications_cluster.kubeconfig }}"
    namespace: "{{ applications_managers.opentelemetry_demo.kubernetes.namespace }}"
  register: applications_otel_demo_pods

- name: Wait for pods to reach ready state
  kubernetes.core.k8s_info:
    api_version: "{{ pod.apiVersion }}"
    kind: "{{ pod.kind }}"
    kubeconfig: "{{ applications_cluster.kubeconfig }}"
    name: "{{ pod.metadata.name }}"
    namespace: "{{ pod.metadata.namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 300
  loop: "{{ applications_otel_demo_pods.resources }}"
  loop_control:
    label: "pod/{{ pod.metadata.name }}"
    loop_var: pod

- name: Retrieve all deployments
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    kubeconfig: "{{ applications_cluster.kubeconfig }}"
    namespace: "{{ applications_managers.opentelemetry_demo.kubernetes.namespace }}"
  register: applications_otel_demo_deployments

- name: Create HorizontalPodAutorscalers
  kubernetes.core.k8s:
    kubeconfig: "{{ applications_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: "{{ workload.metadata.name }}"
        namespace: "{{ workload.metadata.namespace }}"
      spec:
        scaleTargetRef:
          apiVersion: "{{ workload.apiVersion }}"
          kind: "{{ workload.kind }}"
          name: "{{ workload.metadata.name }}"
        minReplicas: 1
        maxReplicas: 10
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 70
          - type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 80
        behavior:
          scaleDown:
            policies:
              - type: Percent
                value: 50
                periodSeconds: 60
              - type: Pods
                value: 2
                periodSeconds: 60
            selectPolicy: Min
    state: present
  loop: |-
    {{
      applications_otel_demo_deployments.resources |
      ansible.builtin.rejectattr('metadata.name', '==', 'load-generator') |
      ansible.builtin.rejectattr('metadata.name', '==', 'opentelemetry-collector')
    }}
  loop_control:
    label: deployment/{{ workload.metadata.name }}
    loop_var: workload
  when:
    - applications_configuration.opentelemetryDemo.options.autoscaling.kubernetes.hpa | ansible.builtin.default(false)

- name: Create Common PrometheusRules
  kubernetes.core.k8s:
    kubeconfig: "{{ applications_cluster.kubeconfig }}"
    template:
      path: templates/kubernetes/common/prometheusrules.j2
      variable_end_string: "]]"
      variable_start_string: "[["
    state: present
  vars:
    application_namespace: "{{ applications_managers.opentelemetry_demo.kubernetes.namespace }}"
    group_name: opentelemetrydemo

- name: Create OpenTelemetry Demo PrometheusRules
  kubernetes.core.k8s:
    kubeconfig: "{{ applications_cluster.kubeconfig }}"
    template:
      path: templates/kubernetes/otel_demo/prometheusrules.j2
      variable_end_string: "]]"
      variable_start_string: "[["
    state: present
