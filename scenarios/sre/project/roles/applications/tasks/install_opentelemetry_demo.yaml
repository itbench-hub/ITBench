---
# Note: The Prometheus offered by OpenShift is v2, while the one installed
#       in the chart is v3. While otel-demo supports the `otlphttp` exporter,
#       this is not easily exposed in OpenShift. So, ITBench uses the `prometheus`
#       exporter instead to support both platforms until the functionality of
#       Prometheus is the same on both platforms.

- name: Create Namespace
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        labels:
          "itbench.io/ansible-role": applications
          "itbench.io/inject": "true"
          "itbench.io/layer": application
          "itbench.io/monitor": "true"
          "itbench.io/record": "true"
        name: "{{ applications_namespace_opentelemetry_demo }}"
    state: present

- name: Enable Istio service mesh for application
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        labels:
          "istio.io/dataplane-mode": ambient
        name: "{{ applications_namespace_opentelemetry_demo }}"
    state: patched
  when:
    - applications_opentelemetry_demo_service_mesh_enabled

- name: Create valkey-credentials Secret
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Secret
      metadata:
        labels:
          "app.kubernetes.io/managed-by": ansible
          "app.kubernetes.io/name": valkey-credentials
          "app.kubernetes.io/part-of": opentelemetry-demo
        name: valkey-credentials
        namespace: "{{ applications_namespace_opentelemetry_demo }}"
      stringData:
        PASSWORD: "" # pragma: allowlist secret
    state: present

- name: Import tools role for variable setting tasks
  ansible.builtin.import_role:
    name: tools
    tasks_from: set_credentials_clickhouse
  vars:
    tools_cluster:
      kubeconfig: "{{ applications_cluster.kubeconfig }}"

- name: Import tools role for variable setting tasks
  ansible.builtin.import_role:
    name: tools
    tasks_from: set_internal_endpoints
  vars:
    tools_cluster:
      kubeconfig: "{{ applications_cluster.kubeconfig }}"
      platform: "{{ applications_cluster.platform }}"

- name: Create RoleBinding for access to anyuid SecurityContextConstraint
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: otel-demo-scc
        namespace: "{{ applications_namespace_opentelemetry_demo }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:openshift:scc:anyuid
      subjects:
        - kind: ServiceAccount
          name: "{{ applications_helm_release_opentelemetry_demo }}"
          namespace: "{{ applications_namespace_opentelemetry_demo }}"
    state: present
  when:
    - applications_cluster.platform == "openshift"

- name: Install OpenTelemetry Demo (Astronomy Shop)
  kubernetes.core.helm:
    chart_ref: "oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo"
    chart_version: "0.42.6"
    release_name: "{{ applications_helm_release_opentelemetry_demo }}"
    release_namespace: "{{ applications_namespace_opentelemetry_demo }}"
    release_state: present
    release_values:
      components:
        load-generator:
          envOverrides:
            - name: LOCUST_BROWSER_TRAFFIC_ENABLED
              value: "{{ applications_opentelemetry_demo_load_generator_browser_enabled | ansible.builtin.string }}"
            - name: LOCUST_SPAWN_RATE
              value: "{{ applications_opentelemetry_demo_load_generator_spawn_rate | ansible.builtin.string }}"
            - name: LOCUST_USERS
              value: "{{ applications_opentelemetry_demo_load_generator_users | ansible.builtin.string }}"
        valkey-cart:
          command:
            - valkey-server
            - --requirepass
            - $(VALKEY_PASSWORD)
          envOverrides:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: PASSWORD
                  name: valkey-credentials
      grafana:
        enabled: false
      jaeger:
        enabled: false
      opensearch:
        enabled: false
      opentelemetry-collector:
        config:
          connectors:
            span_metrics:
              dimensions:
                - default: "{{ applications_namespace_opentelemetry_demo }}"
                  name: namespace
          exporters:
            clickhouse:
              database: opentelemetry_demo
              endpoint: "{{ tools_clickhouse_endpoint.http }}"
              logs_table_name: "logs"
              password: "{{ tools_clickhouse_password }}" # pragma: allowlist secret
              username: "{{ tools_clickhouse_username }}"
            otlp/jaeger:
              endpoint: "{{ tools_jaeger_endpoint.collector.grpc }}"
            prometheus:
              endpoint: 0.0.0.0:8888
          service:
            pipelines:
              logs:
                exporters:
                  - clickhouse
                  - debug
              metrics:
                exporters:
                  - debug
                  - prometheus
              traces:
                exporters:
                  - debug
                  - otlp/jaeger
                  - span_metrics
            telemetry:
              metrics:
                level: detailed
                readers:
                  - pull:
                      exporter:
                        prometheus:
                          host: 0.0.0.0
                          port: 8889
        mode: deployment
        ports:
          jaeger-compact:
            enabled: false
          jaeger-grpc:
            enabled: false
          jaeger-thrift:
            enabled: false
          metrics:
            enabled: true
          telemetry:
            containerPort: 8889
            enabled: true
            protocol: TCP
            servicePort: 8889
          zipkin:
            enabled: false
        presets:
          clusterMetrics:
            enabled: false
          hostMetrics:
            enabled: false
          kubeletMetrics:
            enabled: false
        serviceMonitor:
          enabled: true
          metricsEndpoints:
            - port: metrics
            - port: telemetry
      prometheus:
        enabled: false
    timeout: 10m0s
    wait: true

- name: Retrieve all pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ applications_namespace_opentelemetry_demo }}"
  register: applications_otel_demo_pods

- name: Wait for pods to reach ready state
  kubernetes.core.k8s_info:
    api_version: "{{ pod.apiVersion }}"
    kind: "{{ pod.kind }}"
    name: "{{ pod.metadata.name }}"
    namespace: "{{ pod.metadata.namespace }}"
    wait: true
    wait_condition:
      status: "True"
      type: Ready
    wait_timeout: 300
  loop: "{{ applications_otel_demo_pods.resources }}"
  loop_control:
    label: "pod/{{ pod.metadata.name }}"
    loop_var: pod

- name: Retrieve all deployments
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ applications_namespace_opentelemetry_demo }}"
  register: applications_otel_demo_deployments

- name: Create HorizontalPodAutorscalers
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        labels:
          "app.kubernetes.io/managed-by": ansible
          "app.kubernetes.io/name": "{{ workload.metadata.name }}"
          "app.kubernetes.io/part-of": opentelemetry-demo
        name: "{{ workload.metadata.name }}"
        namespace: "{{ workload.metadata.namespace }}"
      spec:
        behavior:
          scaleDown:
            policies:
              - periodSeconds: 60
                type: Percent
                value: 50
              - periodSeconds: 60
                type: Pods
                value: 2
            selectPolicy: Min
        maxReplicas: 10
        metrics:
          - resource:
              name: cpu
              target:
                averageUtilization: 70
                type: Utilization
            type: Resource
          - resource:
              name: memory
              target:
                averageUtilization: 80
                type: Utilization
            type: Resource
        minReplicas: 1
        scaleTargetRef:
          apiVersion: "{{ workload.apiVersion }}"
          kind: "{{ workload.kind }}"
          name: "{{ workload.metadata.name }}"
    state: present
  loop: |-
    {{
      applications_otel_demo_deployments.resources |
      ansible.builtin.rejectattr('metadata.name', '==', 'load-generator') |
      ansible.builtin.rejectattr('metadata.name', '==', 'opentelemetry-collector')
    }}
  loop_control:
    label: deployment/{{ workload.metadata.name }}
    loop_var: workload
  when:
    - applications_opentelemetry_demo_kubernetes_autoscaling_enabled

- name: Create Common PrometheusRules
  kubernetes.core.k8s:
    state: present
    template:
      path: templates/kubernetes/common/prometheusrules.j2
      variable_end_string: "]]"
      variable_start_string: "[["
  vars:
    application_namespace: "{{ applications_namespace_opentelemetry_demo }}"
    group_name: opentelemetrydemo

- name: Create OpenTelemetry Demo PrometheusRules
  kubernetes.core.k8s:
    state: present
    template:
      path: templates/kubernetes/otel_demo/prometheusrules.j2
      variable_end_string: "]]"
      variable_start_string: "[["
