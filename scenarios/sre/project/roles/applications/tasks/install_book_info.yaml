---
- name: Create temporary directory for Git checkout
  ansible.builtin.tempfile:
    prefix: book_info
    state: directory
  register: applications_temporary_directory

- name: Checkout Istio repository using Git
  ansible.builtin.git:
    depth: 1
    dest: "{{ applications_temporary_directory.path }}"
    repo: "https://github.com/istio/istio.git"
    version: "1.30.3"

- name: Create Namespace
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        labels:
          "istio.io/dataplane-mode": ambient
          "itbench.io/ansible-role": applications
          "itbench.io/inject": "true"
          "itbench.io/layer": application
          "itbench.io/monitor": "true"
          "itbench.io/record": "true"
        name: "{{ applications_namespace_book_info }}"
    state: present

- name: Create BookInfo Kubernetes objects
  kubernetes.core.k8s:
    namespace: "{{ applications_namespace_book_info }}"
    src: "{{ applications_temporary_directory.path }}/{{ manifest_file_path }}"
    state: present
  loop:
    - samples/bookinfo/platform/kube/bookinfo.yaml
    - samples/bookinfo/platform/kube/bookinfo-versions.yaml
    - samples/bookinfo/gateway-api/bookinfo-gateway.yaml
  loop_control:
    label: manifest/{{ manifest_file_path | ansible.builtin.basename }}
    loop_var: manifest_file_path

- name: Wait for Kubernetes Gateway to be programmed
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    name: bookinfo-gateway
    namespace: "{{ applications_namespace_book_info }}"
    wait: true
    wait_condition:
      reason: Programmed
      status: "True"
      type: Programmed

- name: Delete the temporary directory
  ansible.builtin.file:
    path: "{{ applications_temporary_directory.path }}"
    state: absent

- name: Create Prometheus Pod Monitors
  kubernetes.core.k8s:
    resource_definition:
      - apiVersion: monitoring.coreos.com/v1
        kind: PodMonitor
        metadata:
          name: bookinfo-gateway
          namespace: "{{ applications_namespace_book_info }}"
        spec:
          podMetricsEndpoints:
            - interval: 30s
              port: metrics
          selector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: bookinfo-gateway
      - apiVersion: monitoring.coreos.com/v1
        kind: PodMonitor
        metadata:
          name: productpage-v1
          namespace: "{{ applications_namespace_book_info }}"
        spec:
          fallbackScrapeProtocol: PrometheusText1.0.0
          podMetricsEndpoints:
            - interval: 30s
              portNumber: 9080
          selector:
            matchLabels:
              app: productpage
              version: v1
    state: present

- name: Retrieve Kubernetes Gateway address
  delay: 15
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    name: bookinfo-gateway
    namespace: "{{ applications_namespace_book_info }}"
  register: applications_gateway
  retries: 20
  until:
    - applications_gateway.resources | ansible.builtin.length == 1
    - applications_gateway.resources[0].status.addresses is ansible.builtin.defined
    - applications_gateway.resources[0].status.addresses | ansible.builtin.length > 0

- name: Extract gateway address information
  ansible.builtin.set_fact:
    applications_book_info_gateway_endpoints:
      http: http://{{ address.value }}{{ ":80" if address.type == "IPAddress" else "" }}
  vars:
    address: "{{ applications_gateway.resources[0].status.addresses[0] }}"
  when:
    - address.type in ["IPAddress", "Hostname"]

- name: Create simple load generator
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels:
          "app.kubernetes.io/component": load-generator
          "app.kubernetes.io/managed-by": ansible
          "app.kubernetes.io/part-of": bookinfo
        name: load-generator-product-page
        namespace: "{{ applications_namespace_book_info }}"
      spec:
        replicas: 3
        selector:
          matchLabels:
            "app.kubernetes.io/component": load-generator
            "app.kubernetes.io/managed-by": ansible
            "app.kubernetes.io/part-of": bookinfo
        template:
          metadata:
            labels:
              "app.kubernetes.io/component": load-generator
              "app.kubernetes.io/managed-by": ansible
              "app.kubernetes.io/part-of": bookinfo
          spec:
            containers:
              - args:
                  - -c
                  - "while true; do curl {{ applications_book_info_gateway_endpoints.http ~ '/productpage' }}; sleep 5; done"
                command:
                  - /bin/sh
                image: registry.access.redhat.com/ubi10/ubi-minimal@sha256:ab67cd02caf8706e34a695a1432ebe965934f6128ec352a6c3f4048b43a4fb5e
                name: generator
    state: present

- name: Create Common PrometheusRules
  kubernetes.core.k8s:
    state: present
    template:
      path: templates/kubernetes/common/prometheusrules.j2
      variable_end_string: "]]"
      variable_start_string: "[["
  vars:
    application_namespace: "{{ applications_namespace_book_info }}"
    group_name: bookinfo

- name: Create Book Info PrometheusRules
  kubernetes.core.k8s:
    state: present
    template:
      path: templates/kubernetes/book_info/prometheusrules.j2
      variable_end_string: "]]"
      variable_start_string: "[["
