---
- name: Retrieve namespaces
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    kubeconfig: "{{ agent_cluster.kubeconfig }}"
  register: agent_k8s_namespaces

- name: Validate that all requesting namespaces exist
  ansible.builtin.assert:
    that:
      - ( agent_access_request.namespaces | ansible.builtin.intersect(existing_namespaces) | ansible.builtin.length ) == ( agent_access_request.namespaces |
        ansible.builtin.length )
    fail_msg: Requested namespaces do not exist. Please ensure all namespaces exist before requesting access.
    success_msg: All requested namespaces found.
  vars:
    existing_namespaces: "{{ agent_k8s_namespaces.resources | map(attribute='metadata.name') }}"

- name: Create ServiceAccount
  kubernetes.core.k8s:
    kubeconfig: "{{ agent_cluster.kubeconfig }}"
    resource_definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        labels:
          "app.kubernetes.io/component": agent-access-provider
          "app.kubernetes.io/managed-by": ITBench
        name: agent
        namespace: default
    state: present

- name: Create RBAC objects in each requested namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ agent_cluster.kubeconfig }}"
    resource_definition:
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          labels:
            "app.kubernetes.io/component": agent-access-provider
            "app.kubernetes.io/managed-by": ITBench
          name: agent-namespace-access
          namespace: "{{ ns }}"
        rules:
          - apiGroups:
              - ""
            resources:
              - resourcequotas
            verbs:
              - "*"
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: agent-namespace-admin
          namespace: "{{ ns }}"
          labels:
            "app.kubernetes.io/component": agent-access-provider
            "app.kubernetes.io/managed-by": ITBench
        subjects:
          - kind: ServiceAccount
            name: agent
            namespace: default
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: admin
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          labels:
            "app.kubernetes.io/component": agent-access-provider
            "app.kubernetes.io/managed-by": ITBench
          name: agent-namespace-access
          namespace: "{{ ns }}"
        subjects:
          - kind: ServiceAccount
            name: agent
            namespace: default
        roleRef:
          kind: Role
          name: agent-namespace-access
          apiGroup: rbac.authorization.k8s.io
    state: present
  loop: "{{ agent_access_request.namespaces }}"
  loop_control:
    label: namespace/{{ ns }}
    loop_var: ns

- name: Create cluster-scoped RBAC objects
  kubernetes.core.k8s:
    kubeconfig: "{{ agent_cluster.kubeconfig }}"
    resource_definition:
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          labels:
            "app.kubernetes.io/component": agent-access-provider
            "app.kubernetes.io/managed-by": ITBench
          name: agent-cluster-access
        rules:
          - apiGroups:
              - ""
            resources:
              - nodes
            verbs:
              - patch
          - apiGroups:
              - scheduling.k8s.io
            resources:
              - priorityclasses
            verbs:
              - create
              - delete
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          labels:
            "app.kubernetes.io/component": agent-access-provider
            "app.kubernetes.io/managed-by": ITBench
          name: agent-cluster-access
        subjects:
          - kind: ServiceAccount
            name: agent
            namespace: default
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: agent-cluster-access
    state: present

- name: Create TokenRequest
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - default
      - create
      - token
      - agent
      - --duration
      - 18h
      - -o
      - json
      - --kubeconfig={{ agent_cluster.kubeconfig | ansible.builtin.expanduser }}
  register: agent_token_creation_output
  changed_when:
    - agent_token_creation_output.rc == 0

- name: Parse kubeconfig to find current context
  ansible.builtin.set_fact:
    agent_current_cluster: |-
      {{
        kubeconfig.clusters |
        ansible.builtin.selectattr("name", "==", kubeconfig["current-context"])
      }}
  vars:
    kubeconfig: |-
      {{
        lookup("ansible.builtin.file", (agent_cluster.kubeconfig | ansible.builtin.expanduser)) |
        ansible.builtin.from_yaml
      }}

- name: Validate that there is only one context
  ansible.builtin.fail:
    msg: More than one context discovered. Please ensure kubeconfig is properly formatted.
  when:
    - agent_current_cluster | ansible.builtin.length != 1

- name: Create temporary file for restricted kubeconfig
  ansible.builtin.tempfile:
    prefix: restricted-kubeconfig
  register: agent_temporary_kubeconfig

- name: Create restricted kubeconfig file in temporary directory
  kubernetes.core.kubeconfig:
    clusters:
      - cluster:
          server: "{{ agent_current_cluster[0].cluster.server }}"
          certificate-authority-data: "{{ agent_current_cluster[0].cluster['certificate-authority-data'] }}"
        name: "{{ agent_current_cluster[0].name }}"
    contexts:
      - context:
          cluster: "{{ agent_current_cluster[0].name }}"
          user: agent
        name: "{{ agent_current_cluster[0].name }}"
    current_context: "{{ agent_current_cluster[0].name }}"
    path: "{{ agent_temporary_kubeconfig.path }}"
    users:
      - name: agent
        user:
          token: |-
            {{
              (
                agent_token_creation_output.stdout |
                ansible.builtin.from_json
              ).status.token
            }}

- name: Copy restricted kubeconfig into local directory
  ansible.builtin.copy:
    dest: "{{ [agent_storage.local.directory, 'kubeconfig'] | ansible.builtin.path_join }}"
    mode: "0644"
    src: "{{ agent_temporary_kubeconfig.path }}"
  when:
    - agent_storage.local is ansible.builtin.defined

- name: Upload restricted kubeconfig to S3 bucket
  amazon.aws.s3_object:
    endpoint_url: "{{ agent_storage.s3.endpoint }}"
    bucket: "{{ agent_storage.s3.bucket }}"
    object: "{{ [agent_storage.s3.directory, 'kubeconfig'] | ansible.builtin.path_join }}"
    src: "{{ agent_temporary_kubeconfig.path }}"
    mode: put
  when:
    - agent_storage.s3 is ansible.builtin.defined

- name: Delete the temporary kubeconfig
  ansible.builtin.file:
    path: "{{ agent_temporary_kubeconfig.path }}"
    state: absent
