---
- name: Set scenario variables
  ansible.builtin.set_fact:
    scenarios_scenario: |-
      {{
        lookup("ansible.builtin.file", scenario_path) |
        ansible.builtin.from_yaml
      }}
  vars:
    scenario_path: |-
      {{
        [
          playbook_dir,
          '..',
          '..',
          '..',
          "archive",
          "scenarios",
          scenarios_identifier | ansible.builtin.string,
          "scenario.yaml"
        ] |
        ansible.builtin.path_join |
        ansible.builtin.realpath
      }}
  tags:
    - always
