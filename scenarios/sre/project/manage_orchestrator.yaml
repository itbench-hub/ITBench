---
- name: Manage ITBench Orchestrator Cluster
  hosts:
    - localhost
  pre_tasks:
    - name: Resolve helm binary path from mise
      ansible.builtin.set_fact:
        mise_helm_path: "{{ lookup('ansible.builtin.pipe', 'mise which helm') }}"
      tags:
        - always

    - name: Import cluster role
      ansible.builtin.import_role:
        name: cluster
      tags:
        - always
  tasks:
    - name: Import argo role
      ansible.builtin.import_role:
        name: argo
      module_defaults:
        group/kubernetes.core.helm:
          binary_path: "{{ mise_helm_path }}"
      vars:
        argo_cluster:
          provider: "{{ cluster_provider }}"
        argo_environment_kubeconfigs: "{{ stack.environments.kubeconfigs | ansible.builtin.default([]) }}"
