---
- name: Manage ITBench Orchestrator Cluster
  hosts:
    - localhost
  environment:
    K8_AUTH_KUBECONFIG: "{{ cluster.kubeconfig }}"
  pre_tasks:
    - name: Import executables role
      ansible.builtin.import_role:
        name: executables
      tags:
        - always

    - name: Import cluster role
      ansible.builtin.import_role:
        name: cluster
      tags:
        - always
      vars:
        cluster_files:
          kubeconfig: "{{ cluster.kubeconfig }}"
  tasks:
    - name: Import argo role
      ansible.builtin.import_role:
        name: argo
      vars:
        argo_cluster:
          platform: "{{ cluster_platform }}"
          provider: "{{ cluster_provider }}"
