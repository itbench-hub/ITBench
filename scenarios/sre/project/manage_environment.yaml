---
- name: Manage ITBench Environment Cluster
  hosts:
    - localhost
  pre_tasks:
    - name: Resolve helm binary path from mise
      ansible.builtin.set_fact:
        mise_helm_path: "{{ lookup('ansible.builtin.pipe', 'mise which helm') }}"
      tags:
        - always

    - name: Import cluster role
      ansible.builtin.import_role:
        name: cluster
      tags:
        - always
  tasks:
    - name: Import tools role (non-recorders)
      ansible.builtin.import_role:
        name: tools
      module_defaults:
        group/kubernetes.core.helm:
          binary_path: "{{ mise_helm_path }}"
      vars:
        tools_cluster:
          platform: "{{ cluster_platform }}"
          provider: "{{ cluster_provider }}"
      when:
        - environment_tool_management_enabled | ansible.builtin.default(false)

    - name: Import applications role
      ansible.builtin.import_role:
        name: applications
      module_defaults:
        group/kubernetes.core.helm:
          binary_path: "{{ mise_helm_path }}"
      vars:
        applications_cluster:
          platform: "{{ cluster_platform }}"
      when:
        - environment_application_management_enabled | ansible.builtin.default(false)

    - name: Import tools role (recorders)
      ansible.builtin.import_role:
        name: tools
        tasks_from: install_itbench_recorders.yaml
      tags:
        - install
      vars:
        tools_cluster:
          platform: "{{ cluster_platform }}"
          provider: "{{ cluster_provider }}"
      when:
        - environment_recorder_management_enabled | ansible.builtin.default(false)
