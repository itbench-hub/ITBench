---
- name: Manage SRE and FinOps Scenario Data Recorder Stack
  hosts:
    - localhost
  pre_tasks:
    - name: Import executables role
      ansible.builtin.import_role:
        name: executables
      tags:
        - always

    - name: Import cluster role
      ansible.builtin.import_role:
        name: cluster
      tags:
        - always
      vars:
        cluster_files:
          kubeconfig: "{{ cluster.kubeconfig }}"

    - name: Configure storage
      tags:
        - always
      block:
        - name: Override storage configuration
          ansible.builtin.set_fact:
            storage: |-
              {{
                lookup("ansible.builtin.template", template_path) |
                ansible.builtin.from_yaml
              }}
          vars:
            template_path: "{{ playbook_dir }}/templates/group_variables/storage.j2"
          when:
            - scenario_id is ansible.builtin.defined
            - storage is ansible.builtin.defined
            - storage_overrides is ansible.builtin.defined

        - name: Create directory for local storage export
          ansible.builtin.file:
            mode: "0755"
            path: "{{ storage.local.directory | ansible.builtin.default('/tmp') }}"
            state: directory
          when:
            - storage.local is ansible.builtin.defined
  tasks:
    - name: Set recorders role variables
      tags:
        - setup_recording
        - export_records
        - teardown_recording
      block:
        - name: Set recorders_export_phase
          ansible.builtin.set_fact:
            recorders_export_phase: "{{ benchmark_phase | ansible.builtin.default('pre-fault-injection') }}"

        - name: Set recorders_export_type
          ansible.builtin.set_fact:
            recorders_export_type: "{{ export_type | ansible.builtin.default('full') }}"

        - name: Set recorders_storage_local
          ansible.builtin.set_fact:
            recorders_storage_local: "{{ storage.local }}"
          when:
            - storage is ansible.builtin.defined
            - storage.local is ansible.builtin.defined

        - name: Set recorders_storage_s3
          ansible.builtin.set_fact:
            recorders_storage_s3: "{{ storage.s3 }}"
          when:
            - storage is ansible.builtin.defined
            - storage.s3 is ansible.builtin.defined

    - name: Import recorders role
      ansible.builtin.import_role:
        name: recorders
      vars:
        recorders_cluster:
          kubeconfig: "{{ cluster.kubeconfig }}"
          platform: "{{ cluster_platform }}"
