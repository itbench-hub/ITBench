---
- name: Create ServiceAccount for Kubernetes topology collector
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        labels:
          "itbench.io/ansible-role": recorders
          "itbench.io/layer": data
        name: "{{ itbench_topology_managers.kubernetes.name }}"
        namespace: "{{ itbench_topology_managers.kubernetes.namespace }}"
    state: present

- name: Create ClusterRole for Kubernetes topology collector
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        labels:
          "itbench.io/ansible-role": recorders
          "itbench.io/layer": data
        name: "{{ itbench_topology_managers.kubernetes.name }}"
      rules:
        - apiGroups: [""]
          resources:
            - pods
            - services
            - persistentvolumeclaims
            - configmaps
            - serviceaccounts
            - secrets
            - namespaces
            - nodes
            - persistentvolumes
            - events
          verbs: ["get", "list", "watch"]
        - apiGroups: ["events.k8s.io"]
          resources:
            - events
          verbs: ["get", "list", "watch"]
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources:
            - roles
            - rolebindings
            - clusterroles
            - clusterrolebindings
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apps"]
          resources:
            - deployments
            - daemonsets
            - statefulsets
            - replicasets
          verbs: ["get", "list", "watch"]
        - apiGroups: ["batch"]
          resources:
            - jobs
            - cronjobs
          verbs: ["get", "list", "watch"]
        - apiGroups: ["autoscaling"]
          resources:
            - horizontalpodautoscalers
          verbs: ["get", "list", "watch"]
        - apiGroups: ["networking.k8s.io"]
          resources:
            - ingresses
            - networkpolicies
          verbs: ["get", "list", "watch"]
        - apiGroups: ["discovery.k8s.io"]
          resources:
            - endpointslices
          verbs: ["get", "list", "watch"]
        - apiGroups: ["storage.k8s.io"]
          resources:
            - storageclasses
          verbs: ["get", "list", "watch"]
        - apiGroups: ["networking.istio.io"]
          resources:
            - virtualservices
            - destinationrules
            - serviceentries
            - gateways
          verbs: ["get", "list", "watch"]
        - apiGroups: ["security.istio.io"]
          resources:
            - authorizationpolicies
            - peerauthentications
          verbs: ["get", "list", "watch"]
        - apiGroups: ["gateway.networking.k8s.io"]
          resources:
            - httproutes
            - gateways
          verbs: ["get", "list", "watch"]
        - apiGroups: ["policies.kyverno.io"]
          resources:
            - namespacedvalidatingpolicies
          verbs: ["get", "list", "watch"]
        - apiGroups: ["wgpolicyk8s.io"]
          resources:
            - policyreports
          verbs: ["get", "list", "watch"]
    state: present

- name: Create ClusterRoleBinding for Kubernetes topology collector
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        labels:
          "itbench.io/ansible-role": recorders
          "itbench.io/layer": data
        name: "{{ itbench_topology_managers.kubernetes.name }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ itbench_topology_managers.kubernetes.name }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ itbench_topology_managers.kubernetes.name }}"
          namespace: "{{ itbench_topology_managers.kubernetes.namespace }}"
    state: present

# The Istio receiver is always defined, but it is only added to the pipeline when the
# Istio CRDs exist. Components that are not part of a pipeline are never started.
- name: Deploy Kubernetes topology collector
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        labels:
          "itbench.io/ansible-role": recorders
          "itbench.io/layer": data
        name: "{{ itbench_topology_managers.kubernetes.name }}"
        namespace: "{{ itbench_topology_managers.kubernetes.namespace }}"
      spec:
        config:
          exporters:
            otlp_grpc/kubernetes-events:
              endpoint: "{{ fqdn_itbench_opentelemetry_gateway_infrastructure.kubernetes_events }}"
              retry_on_failure:
                enabled: true
              sending_queue:
                batch:
                  flush_timeout: 2s
                  min_size: 2500
                enabled: true
                num_consumers: 5
              tls:
                insecure: true
            otlp_grpc/kubernetes-infrastructure:
              endpoint: "{{ fqdn_itbench_opentelemetry_gateway_infrastructure.kubernetes_infrastructure }}"
              retry_on_failure:
                enabled: true
              sending_queue:
                batch:
                  flush_timeout: 2s
                  min_size: 2500
                enabled: true
                num_consumers: 5
              tls:
                insecure: true
            otlp_grpc/kubernetes-topology:
              endpoint: "{{ fqdn_itbench_opentelemetry_gateway_infrastructure.kubernetes_topology }}"
              retry_on_failure:
                enabled: true
              sending_queue:
                batch:
                  flush_timeout: 2s
                  min_size: 2500
                enabled: true
                num_consumers: 5
              tls:
                insecure: true
          processors:
            # Only record that a Secret exists, never its contents. The
            # last-applied-configuration annotation is also removed because
            # kubectl apply copies the full manifest, including data, into it.
            transform/strip-secrets:
              error_mode: ignore
              log_statements:
                - conditions:
                    - body["object"]["kind"] == "Secret"
                  context: log
                  statements:
                    - delete_key(body["object"], "data")
                    - delete_key(body["object"], "stringData")
                    - delete_key(body["object"]["metadata"]["annotations"], "kubectl.kubernetes.io/last-applied-configuration")
          receivers:
            k8sobjects/events:
              objects:
                - group: events.k8s.io
                  mode: watch
                  name: events
                - group: ""
                  mode: watch
                  name: events
            k8sobjects/infrastructure:
              include_initial_state: true
              kube_api_burst: 20
              kube_api_qps: 10
              objects:
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: pods
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: nodes
            # Cluster-scoped objects are mostly static, so without
            # include_initial_state they would never emit an event.
            k8sobjects/topology-cluster:
              include_initial_state: true
              kube_api_burst: 20
              kube_api_qps: 10
              objects:
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: namespaces
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: nodes
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: persistentvolumes
                - exclude_watch_type: [BOOKMARK]
                  group: storage.k8s.io
                  mode: watch
                  name: storageclasses
                - exclude_watch_type: [BOOKMARK]
                  group: rbac.authorization.k8s.io
                  mode: watch
                  name: clusterroles
                - exclude_watch_type: [BOOKMARK]
                  group: rbac.authorization.k8s.io
                  mode: watch
                  name: clusterrolebindings
            # Gateway API CRDs are standard across all cluster types and always installed.
            k8sobjects/topology-gateway:
              include_initial_state: true
              kube_api_burst: 20
              kube_api_qps: 10
              objects:
                - exclude_watch_type: [BOOKMARK]
                  group: gateway.networking.k8s.io
                  mode: watch
                  name: httproutes
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: gateway.networking.k8s.io
                  mode: watch
                  name: gateways
                  namespaces: "{{ topology_required_namespaces }}"
            # Kyverno policies and their reports, for the CISO domain. A PolicyReport is owned by the object it
            # reports on, so the topology writer links it to that object through ownerReferences.
            k8sobjects/topology-kyverno:
              include_initial_state: true
              kube_api_burst: 20
              kube_api_qps: 10
              objects:
                - exclude_watch_type: [BOOKMARK]
                  group: policies.kyverno.io
                  mode: watch
                  name: namespacedvalidatingpolicies
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: wgpolicyk8s.io
                  mode: watch
                  name: policyreports
                  namespaces: "{{ topology_required_namespaces }}"
            k8sobjects/topology-istio:
              include_initial_state: true
              kube_api_burst: 20
              kube_api_qps: 10
              objects:
                - exclude_watch_type: [BOOKMARK]
                  group: networking.istio.io
                  mode: watch
                  name: virtualservices
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: networking.istio.io
                  mode: watch
                  name: destinationrules
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: networking.istio.io
                  mode: watch
                  name: serviceentries
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: networking.istio.io
                  mode: watch
                  name: gateways
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: security.istio.io
                  mode: watch
                  name: authorizationpolicies
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: security.istio.io
                  mode: watch
                  name: peerauthentications
                  namespaces: "{{ topology_required_namespaces }}"
            k8sobjects/topology-namespaced:
              include_initial_state: true
              kube_api_burst: 40
              kube_api_qps: 20
              objects:
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: pods
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: services
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: discovery.k8s.io
                  mode: watch
                  name: endpointslices
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: persistentvolumeclaims
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: configmaps
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: serviceaccounts
                  namespaces: "{{ topology_required_namespaces }}"
                # Secret data is stripped by the transform/strip-secrets processor.
                - exclude_watch_type: [BOOKMARK]
                  mode: watch
                  name: secrets
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: rbac.authorization.k8s.io
                  mode: watch
                  name: roles
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: rbac.authorization.k8s.io
                  mode: watch
                  name: rolebindings
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: apps
                  mode: watch
                  name: deployments
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: apps
                  mode: watch
                  name: daemonsets
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: apps
                  mode: watch
                  name: statefulsets
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: apps
                  mode: watch
                  name: replicasets
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: batch
                  mode: watch
                  name: jobs
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: batch
                  mode: watch
                  name: cronjobs
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: autoscaling
                  mode: watch
                  name: horizontalpodautoscalers
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: networking.k8s.io
                  mode: watch
                  name: ingresses
                  namespaces: "{{ topology_required_namespaces }}"
                - exclude_watch_type: [BOOKMARK]
                  group: networking.k8s.io
                  mode: watch
                  name: networkpolicies
                  namespaces: "{{ topology_required_namespaces }}"
          service:
            pipelines:
              logs/events:
                exporters: ["otlp_grpc/kubernetes-events"]
                receivers: ["k8sobjects/events"]
              logs/infrastructure:
                exporters: ["otlp_grpc/kubernetes-infrastructure"]
                receivers: ["k8sobjects/infrastructure"]
              logs/topology:
                exporters: ["otlp_grpc/kubernetes-topology"]
                processors: ["transform/strip-secrets"]
                receivers: >-
                  {{
                    [
                      "k8sobjects/topology-namespaced",
                      "k8sobjects/topology-cluster",
                      "k8sobjects/topology-gateway"
                    ] +
                    (["k8sobjects/topology-istio"] if recorders_istio_present else []) +
                    (["k8sobjects/topology-kyverno"] if recorders_kyverno_present else [])
                  }}
        image: quay.io/it-bench/opentelemetry-collector:2.0.0@sha256:78a168deeca16edbade2446e842b75be5cba8dfadc6daf181eb57779810aaea7
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        serviceAccount: "{{ itbench_topology_managers.kubernetes.name }}"
    state: present
    wait: true
    wait_condition:
      reason: Reconciled
      status: "True"
      type: Ready
  vars:
    topology_required_namespaces: "{{ recorders_recordable_namespaces.resources | map(attribute='metadata.name') }}"
