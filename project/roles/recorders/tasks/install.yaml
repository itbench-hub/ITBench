---
- name: Retrieve Namespace for observability tools
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ itbench_namespaces.observability }}"
  register: recorders_observability_namespace

- name: Retrieve Namespaces with record labels
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    label_selectors:
      - "itbench.io/record=true"
  register: recorders_recordable_namespaces

- name: Install recorders
  when:
    - recorders_observability_namespace.resources | ansible.builtin.length == 1
    - recorders_recordable_namespaces.resources | ansible.builtin.length > 0
  block:
    - name: Retrieve OpenTelemetry Collector CustomResourceDefinition
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: opentelemetrycollectors.opentelemetry.io
      register: recorders_opentelemetry_crd

    - name: Fail when the OpenTelemetry Collector CustomResourceDefinition is missing
      ansible.builtin.fail:
        msg: The OpenTelemetry Collector CustomResourceDefinition was not found. Install the tools before the recorders.
      when:
        - recorders_opentelemetry_crd.resources | ansible.builtin.length == 0

    - name: Retrieve Istio VirtualService CustomResourceDefinition
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: virtualservices.networking.istio.io
      register: recorders_istio_crd

    - name: Record whether Istio objects can be collected
      ansible.builtin.set_fact:
        recorders_istio_present: "{{ recorders_istio_crd.resources | ansible.builtin.length > 0 }}"

    - name: Import Kubernetes topology installation tasks
      ansible.builtin.import_tasks:
        file: install_topology_kubernetes.yaml

    - name: Import scenario topology installation tasks
      ansible.builtin.import_tasks:
        file: install_topology_scenario.yaml
