---
- name: Retrieve Namespace for observability tools
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ itbench_namespaces.observability }}"
  register: recorders_observability_namespace

- name: Retrieve Namespaces with record labels
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    label_selectors:
      - "itbench.io/record=true"
  register: recorders_recordable_namespaces

- name: Export observability records
  when:
    - recorders_observability_namespace.resources | ansible.builtin.length == 1
    - recorders_recordable_namespaces.resources | ansible.builtin.length > 0
  block:
    - name: Import Clickhouse Recorder export tasks
      ansible.builtin.import_tasks:
        file: export_clickhouse.yaml

    - name: Import Prometheus Recorder export tasks
      ansible.builtin.import_tasks:
        file: export_prometheus.yaml
