---
- name: Create PersistentVolumeClaim for Clickhouse Recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          "itbench.io/ansible-role": recorders
          "itbench.io/layer": data
        name: "{{ itbench_data_recorders.clickhouse.persistent_volume_claim }}"
        namespace: "{{ itbench_data_recorders.clickhouse.namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        volumeMode: Filesystem
    state: present

- name: Install Kubernetes Job for Clickhouse Recorder
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          "itbench.io/ansible-role": recorders
          "itbench.io/layer": data
        name: "{{ itbench_data_recorders.clickhouse.name }}"
        namespace: "{{ itbench_data_recorders.clickhouse.namespace }}"
      spec:
        template:
          spec:
            containers:
              - env:
                  - name: CLICKHOUSE_HOST
                    value: "{{ fqdn_itbench_clickhouse_database_observability.tcp }}"
                  - name: NAMESPACES
                    value: >-
                      {{
                        recorders_recordable_namespaces.resources |
                        map(attribute='metadata.name') |
                        ansible.builtin.join(',')
                      }}
                  - name: OUTPUT_DIR
                    value: /records
                  - name: RECORDING_START_TIMESTAMP
                    value: "{{ '%Y-%m-%dT%H:%M:%SZ' | ansible.builtin.strftime(now(utc=true).timestamp() - (recorders_benchmark_duration_minutes * 60)) }}"
                  - name: RECORDING_END_TIMESTAMP
                    value: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
                  - name: RECORDING_INTERVAL_SECONDS
                    value: "300"
                envFrom:
                  - secretRef:
                      name: "{{ 'clickhouse-user-' ~ itbench_clickhouse_databases.observability.users.recorder.name }}"
                image: quay.io/it-bench/clickhouse-recorder:1.0.0@sha256:655bcc8b4f76915536239dee0160e08d00f83f4daa588b2237a1f91123bce64e
                name: recorder
                resources:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    memory: 1024Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - mountPath: /records
                    name: records
            restartPolicy: Never
            securityContext:
              fsGroup: 1001
              runAsNonRoot: true
              runAsUser: 1001
              seccompProfile:
                type: RuntimeDefault
            volumes:
              - name: records
                persistentVolumeClaim:
                  claimName: "{{ itbench_data_recorders.clickhouse.persistent_volume_claim }}"
    state: present
    wait: true
    wait_condition:
      status: "True"
      type: Complete
    wait_timeout: 600

- name: Export Clickhouse records
  ansible.builtin.import_tasks:
    file: export_records.yaml
  vars:
    recorder_persistent_volume_claim: "{{ itbench_data_recorders.clickhouse.persistent_volume_claim }}"
