---
- name: Import tools role to install required CRDs
  ansible.builtin.import_role:
    name: tools
    tasks_from: install_custom_resource_definitions
  vars:
    tools_cluster:
      platform: "{{ argo_cluster.platform }}"

- name: Import tools role to install the Kubernetes Gateway controller
  ansible.builtin.import_role:
    name: tools
    tasks_from: install_kubernetes_gateway_controller
  vars:
    tools_cluster:
      platform: "{{ argo_cluster.platform }}"

- name: Retrieve GatewayClasses
  kubernetes.core.k8s_info:
    apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
  register: argo_gateway_classes

- name: Create Kubernetes Gateway for Argo
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        labels:
          "itbench.io/ansible-role": argo
          "itbench.io/layer": networking
        name: "{{ itbench_kubernetes_gateways.argo.name }}"
        namespace: "{{ itbench_kubernetes_gateways.argo.namespace }}"
      spec:
        gatewayClassName: >-
          {{
            argo_gateway_classes.resources |
            ansible.builtin.selectattr("metadata.name", "==", openshift_kubernetes_gateway_class.name) |
            ansible.builtin.first |
            ansible.builtin.default("nginx")
          }}
        listeners:
          - allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchLabels:
                    "itbench.io/gateway-access": shared
            name: http
            port: 8080
            protocol: HTTP
    state: present
    wait: true
    wait_condition:
      status: "True"
      type: Programmed

- name: Import Argo components installation tasks
  ansible.builtin.import_tasks:
    file: install_argo.yaml
