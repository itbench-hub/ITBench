---
- name: Install Argo Workflows
  kubernetes.core.helm:
    chart_ref: "{{ helm_chart_argo_workflows.reference }}"
    chart_version: "{{ helm_chart_argo_workflows.version }}"
    release_name: "{{ helm_release_argo_workflows.name }}"
    release_namespace: "{{ helm_release_argo_workflows.namespace }}"
    release_state: present
    release_values:
      controller:
        workflowNamespaces:
          - "{{ helm_release_argo_workflows.namespace }}"
      server:
        httpRoute:
          enabled: true
          parentRefs:
            - name: "{{ itbench_kubernetes_gateways.argo.name }}"
              namespace: "{{ itbench_kubernetes_gateways.argo.namespace }}"
          rules:
            - filters:
                - responseHeaderModifier:
                    add:
                      - name: Content-Security-Policy
                        value: "img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; form-action 'none'; frame-ancestors 'none'"
                      - name: Cross-Origin-Resource-Policy
                        value: same-origin
                      - name: Strict-Transport-Security
                        value: max-age=31536000; includeSubDomains; preload
                      - name: Referrer-Policy
                        value: strict-origin-when-cross-origin
                      - name: X-Content-Type-Options
                        value: nosniff
                      - name: X-Frame-Options
                        value: DENY
                      - name: X-XSS-Protection
                        value: "0"
                  type: ResponseHeaderModifier
    timeout: 10m0s
    wait: true
