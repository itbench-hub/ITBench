---
- name: Create Argo namespace
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: "{{ 'project.openshift.io/v1' if argo_cluster.platform == 'openshift' else 'v1' }}"
      kind: "{{ 'Project' if argo_cluster.platform == 'openshift' else 'Namespace' }}"
      metadata:
        labels:
          "itbench.io/ansible-role": argo
          "itbench.io/gateway-access": shared
          "itbench.io/inject": "false"
          "itbench.io/layer": orchestration
          "itbench.io/monitor": "true"
        name: "{{ argo_namespace }}"
    state: present

- name: Install Argo Workflows
  kubernetes.core.helm:
    chart_ref: "{{ helm_chart_argo_workflows.reference }}"
    chart_version: "{{ helm_chart_argo_workflows.version }}"
    release_name: "{{ helm_release_argo_workflows.name }}"
    release_namespace: "{{ argo_namespace }}"
    release_state: present
    release_values:
      server:
        baseHref: /orchestration/workflows/
      controller:
        workflowNamespaces:
          - "{{ argo_namespace }}"
    timeout: 10m0s
    wait: true

- name: Create HTTPRoute for Argo Workflows
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: "{{ helm_release_argo_workflows.name }}"
        namespace: "{{ argo_namespace }}"
      spec:
        parentRefs:
          - name: "{{ itbench_kubernetes_gateways.argo.name }}"
            namespace: "{{ itbench_kubernetes_gateways.argo.namespace }}"
        rules:
          - backendRefs:
              - name: "{{ helm_release_argo_workflows.name }}-server"
                port: 2746
            filters:
              - responseHeaderModifier:
                  add: "{{ argo_response_headers_http }}"
                type: ResponseHeaderModifier
            matches:
              - path:
                  type: PathPrefix
                  value: /orchestration/workflows
    state: present
