---
- name: Uninstall Argo Workflows Helm release
  kubernetes.core.helm:
    release_name: "{{ helm_release_argo_workflows.name }}"
    release_namespace: "{{ helm_release_argo_workflows.namespace }}"
    release_state: absent
    wait: true

- name: Uninstall orchestrator infrastructure via tools role
  ansible.builtin.import_role:
    name: tools
  vars:
    tools_cluster:
      platform: "{{ argo_cluster.platform }}"
      provider: "{{ argo_cluster.provider }}"

- name: Delete all Argo namespaces
  kubernetes.core.k8s:
    api_version: v1
    delete_all: true
    kind: Namespace
    label_selectors:
      - "itbench.io/ansible-role=argo"
    state: absent
    wait: true

- name: Retrieve all CustomResourceDefinitions
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
  register: argo_custom_resource_definitions

- name: Uninstall Argo Custom Resource Definitions
  kubernetes.core.k8s:
    resource_definition: "{{ definitions }}"
    state: absent
    wait: true
  vars:
    _regex: "{{ '(%s)$' | ansible.builtin.format('argoproj.io' | ansible.builtin.regex_escape) }}"
    definitions: >-
      {{
        argo_custom_resource_definitions.resources |
        ansible.builtin.selectattr("spec.group", "search", _regex)
      }}
  when:
    - definitions | ansible.builtin.length > 0
