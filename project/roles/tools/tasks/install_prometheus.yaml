---
- name: Install Prometheus on Kubernetes
  when:
    - tools_cluster.platform == "kubernetes"
  block:
    - name: Install Issuer for Prometheus proxy
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: "{{ helm_release_kube_prometheus_stack.name ~ '-proxy-issuer' }}"
            namespace: "{{ itbench_namespaces.observability }}"
          spec:
            selfSigned: {}
        state: present

    - name: Install Certificate for Prometheus proxy
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: "{{ helm_release_kube_prometheus_stack.name ~ '-prometheus-proxy-tls' }}"
            namespace: "{{ itbench_namespaces.observability }}"
          spec:
            dnsNames:
              - "{{ helm_release_kube_prometheus_stack.name ~ '-prometheus' }}"
              - >-
                {{
                    [
                      helm_release_kube_prometheus_stack.name ~ "-prometheus",
                      itbench_namespaces.observability
                    ] |
                    ansible.builtin.join(".")
                }}
              - >-
                {{
                    [
                      helm_release_kube_prometheus_stack.name ~ "-prometheus",
                      itbench_namespaces.observability,
                      "svc",
                      "cluster",
                      "local"
                    ] |
                    ansible.builtin.join(".")
                }}
            duration: 2160h
            isCA: false
            issuerRef:
              name: "{{ helm_release_kube_prometheus_stack.name ~ '-proxy-issuer' }}"
              kind: Issuer
            privateKey:
              algorithm: ECDSA
              size: 256
            renewBefore: 360h
            secretName: "{{ helm_release_kube_prometheus_stack.name ~ '-proxy-cert' }}"
            usages:
              - server auth
              - client auth
        state: present

    - name: Install Prometheus Operator and Prometheus
      kubernetes.core.helm:
        chart_ref: "{{ helm_chart_kube_prometheus_stack.reference }}"
        chart_version: "{{ helm_chart_kube_prometheus_stack.version }}"
        release_name: "{{ helm_release_kube_prometheus_stack.name }}"
        release_namespace: "{{ itbench_namespaces.observability }}"
        release_state: present
        release_values:
          alertmanager:
            enabled: false
          crds:
            enabled: false
          customRules:
            KubeContainerWaiting:
              for: 5m
            KubeDeploymentRolloutStuck:
              for: 5m
            KubeHpaMaxedOut:
              for: 5m
            KubePodCrashLooping:
              for: 5m
            KubePodNotReady:
              for: 5m
          defaultRules:
            rules:
              alertmanager: false
          grafana:
            enabled: false
          kubeControllerManager:
            enabled: "{{ tools_cluster.provider == 'kind' }}"
          kubeEtcd:
            enabled: "{{ tools_cluster.provider == 'kind' }}"
          kubeProxy:
            enabled: "{{ tools_cluster.provider == 'kind' }}"
          kubeScheduler:
            enabled: "{{ tools_cluster.provider == 'kind' }}"
          prometheus:
            prometheusSpec:
              containers:
                - args:
                    - "--secure-listen-address=0.0.0.0:{{ itbench_prometheus_proxy.ports.https }}"
                    - "--upstream=http://127.0.0.1:9090/"
                    - "--tls-cert-file=/etc/tls/proxy/tls.crt"
                    - "--tls-private-key-file=/etc/tls/proxy/tls.key"
                    - "--v=10"
                  image: "{{ container_image_kube_rbac_proxy_kube_rbac_proxy }}"
                  name: kube-rbac-proxy
                  ports:
                    - containerPort: "{{ itbench_prometheus_proxy.ports.https }}"
                      name: http-proxy
                  volumeMounts:
                    - name: proxy-certs
                      mountPath: /etc/tls/proxy
                      readOnly: true
              enableOTLPReceiver: false
              listenLocal: true
              podMonitorNamespaceSelector:
                matchLabels:
                  "itbench.io/monitor": "true"
              podMonitorSelectorNilUsesHelmValues: false
              ruleNamespaceSelector:
                matchLabels:
                  "itbench.io/monitor": "true"
              ruleSelectorNilUsesHelmValues: false
              serviceMonitorNamespaceSelector:
                matchLabels:
                  "itbench.io/monitor": "true"
              serviceMonitorSelectorNilUsesHelmValues: false
              volumes:
                - name: proxy-certs
                  secret:
                    secretName: "{{ helm_release_kube_prometheus_stack.name ~ '-proxy-cert' }}"
            service:
              additionalPorts:
                - name: http-proxy
                  port: "{{ itbench_prometheus_proxy.ports.https }}"
                  targetPort: "{{ itbench_prometheus_proxy.ports.https }}"
              # NOTE: This is a workaround due to this issue: https://github.com/prometheus-operator/prometheus-operator/issues/8605
              #       The following line can be safely removed should the connected PR be accepted by the community.
              publishNotReadyAddresses: true
            serviceMonitor:
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-proxy
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
        timeout: 10m0s
        wait: true

    - name: Create ClusterRoleBinding for bearer token validation
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": observability
            name: "{{ helm_release_kube_prometheus_stack.name ~ '-proxy-token-reviews' }}"
          subjects:
            - kind: ServiceAccount
              name: "{{ helm_release_kube_prometheus_stack.name ~ '-prometheus' }}"
              namespace: itbench-observability
          roleRef:
            kind: ClusterRole
            name: "system:auth-delegator"
            apiGroup: rbac.authorization.k8s.io
        state: present

    - name: Create ClusterRole for reader access to Prometheus
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": observability
            name: monitoring-prometheus-api-reader
          rules:
            - apiGroups:
                - ""
              resources:
                - namespaces
                - pods
                - services
                - endpoints
              verbs:
                - get
                - list
                - watch
            - nonResourceURLs:
                - /metrics
                - "*"
              verbs:
                - get
                - create
        state: present

- name: Install Prometheus on OpenShift
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Create Cluster Monitoring ConfigMap
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          data:
            config.yaml: |
              enableUserWorkload: true
          kind: ConfigMap
          metadata:
            name: "{{ openshift_monitoring_config_map }}"
            namespace: "{{ openshift_monitoring_namespace }}"
        state: present

    - name: Create User Workload ConfigMap
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          data:
            config.yaml: |
              alertmanager:
                enabled: false
          kind: ConfigMap
          metadata:
            name: "{{ openshift_user_workload_monitoring_config_map }}"
            namespace: "{{ openshift_user_workload_monitoring_namespace }}"
        state: present

    - name: Wait for Prometheus workload pods to start
      kubernetes.core.k8s_info:
        kind: Pod
        label_selectors:
          - app.kubernetes.io/component = prometheus
          - app.kubernetes.io/instance = user-workload
        namespace: "{{ openshift_user_workload_monitoring_namespace }}"
        wait: true
        wait_condition:
          status: "True"
          type: Ready
        wait_timeout: 300
