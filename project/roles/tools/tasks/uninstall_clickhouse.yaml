---
- name: Check for existence of ClickHouseInstallation resource
  kubernetes.core.k8s_info:
    api_version: clickhouse.altinity.com/v1
    kind: ClickHouseInstallation
  register: tools_clickhouse_installation_resource

- name: Delete Clickhouse Installations
  kubernetes.core.k8s:
    api_version: clickhouse.altinity.com/v1
    delete_all: true
    kind: ClickHouseInstallation
    namespace: "{{ itbench_namespaces.observability }}"
    state: absent
    wait: true
  when:
    - tools_clickhouse_installation_resource.api_found

- name: Uninstall Clickhouse Operator Helm release
  kubernetes.core.helm:
    release_name: "{{ helm_release_altinity_clickhouse_operator.name }}"
    release_namespace: "{{ itbench_namespaces.operators }}"
    release_state: absent
    wait: true
