---
- name: Install altinity Clickhouse Operator
  kubernetes.core.helm:
    chart_ref: "{{ helm_chart_altinity_clickhouse_operator.reference }}"
    chart_version: "{{ helm_chart_altinity_clickhouse_operator.version }}"
    release_name: "{{ helm_release_altinity_clickhouse_operator.name }}"
    release_namespace: "{{ itbench_namespaces.operators }}"
    release_state: present
    release_values:
      serviceMonitor:
        enabled: true
    timeout: 10m0s
    wait: true

- name: Create Secrets for Clickhouse users
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ 'clickhouse-user-' ~ clickhouse_user.value.name }}"
        namespace: "{{ itbench_clickhouse_databases.observability.namespace }}"
      stringData:
        CLICKHOUSE_PASSWORD: "{{ clickhouse_user.value.password }}"
        CLICKHOUSE_USER: "{{ clickhouse_user.value.name }}"
      type: Opaque
    state: present
  loop: "{{ itbench_clickhouse_databases.observability.users | ansible.builtin.dict2items }}"
  loop_control:
    label: user/{{ clickhouse_user.key }}
    loop_var: clickhouse_user

- name: Create Clickhouse Installation
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: clickhouse.altinity.com/v1
      kind: ClickHouseInstallation
      metadata:
        labels:
          "app.kubernetes.io/name": clickhouse
          app.kubernetes.io/version: 26.3.33.10001
        name: "{{ itbench_clickhouse_databases.observability.name }}"
        namespace: "{{ itbench_namespaces.observability }}"
      spec:
        configuration:
          clusters:
            - layout:
                replicasCount: 1
                shardsCount: 1
              name: main
          profiles:
            default/http_connection_timeout: 30
          settings:
            prometheus/asynchronous_metrics: "true"
            prometheus/endpoint: "/metrics"
            prometheus/errors: "true"
            prometheus/events: "true"
            prometheus/metrics: "true"
          users:
            admin/access_management: 1
            admin/named_collection_control: 1
            admin/networks/ip: 0.0.0.0/0
            admin/password:
              valueFrom:
                secretKeyRef:
                  key: CLICKHOUSE_PASSWORD
                  name: "{{ 'clickhouse-user-' ~ itbench_clickhouse_databases.observability.users.admin.name }}"
            admin/show_named_collections: 1
            admin/show_named_collections_secrets: 1
            agent/grants/query:
              - GRANT SELECT ON bank_of_anthos.logs
              - GRANT SELECT ON jaeger.spans
              - GRANT SELECT ON kubernetes.events
              - GRANT SELECT ON kubernetes.infrastructure
              - GRANT SELECT ON kubernetes.topology
              - GRANT SELECT ON kubernetes.topology_graph
              - GRANT SELECT ON microservices_demo.logs
              - GRANT SELECT ON opentelemetry_demo.logs
            agent/networks/ip: 0.0.0.0/0
            agent/password:
              valueFrom:
                secretKeyRef:
                  key: CLICKHOUSE_PASSWORD
                  name: "{{ 'clickhouse-user-' ~ itbench_clickhouse_databases.observability.users.agent.name }}"
            itbench-jaeger/grants/query:
              - GRANT ALL ON jaeger.*
            itbench-jaeger/networks/ip: 0.0.0.0/0
            itbench-jaeger/password:
              valueFrom:
                secretKeyRef:
                  key: CLICKHOUSE_PASSWORD
                  name: "{{ 'clickhouse-user-' ~ itbench_clickhouse_databases.observability.users.jaeger.name }}"
            itbench-observability/grants/query:
              - GRANT CREATE, INSERT ON bank_of_anthos.*
              - GRANT CREATE, INSERT ON istio.*
              - GRANT CREATE, INSERT ON kubernetes.*
              - GRANT CREATE, INSERT ON microservices_demo.*
              - GRANT CREATE, INSERT ON opentelemetry_demo.*
            itbench-observability/networks/ip: 0.0.0.0/0
            itbench-observability/password:
              valueFrom:
                secretKeyRef:
                  key: CLICKHOUSE_PASSWORD
                  name: "{{ 'clickhouse-user-' ~ itbench_clickhouse_databases.observability.users.observability.name }}"
            itbench-recorder/grants/query:
              - GRANT SELECT ON bank_of_anthos.*
              - GRANT SELECT ON jaeger.*
              - GRANT SELECT ON kubernetes.*
              - GRANT SELECT ON microservices_demo.*
              - GRANT SELECT ON opentelemetry_demo.*
            itbench-recorder/networks/ip: 0.0.0.0/0
            itbench-recorder/password:
              valueFrom:
                secretKeyRef:
                  key: CLICKHOUSE_PASSWORD
                  name: "{{ 'clickhouse-user-' ~ itbench_clickhouse_databases.observability.users.recorder.name }}"
            itbench-topology/grants/query:
              - GRANT CREATE, INSERT, SELECT ON kubernetes.*
            itbench-topology/networks/ip: 0.0.0.0/0
            itbench-topology/password:
              valueFrom:
                secretKeyRef:
                  key: CLICKHOUSE_PASSWORD
                  name: "{{ 'clickhouse-user-' ~ itbench_clickhouse_databases.observability.users.topology.name }}"
        defaults:
          templates:
            dataVolumeClaimTemplate: data-volume-template
            podTemplate: pod-template
            serviceTemplate: service-template
        templates:
          podTemplates:
            - metadata:
                labels:
                  "app.kubernetes.io/name": clickhouse
                  app.kubernetes.io/version: 26.3.33.10001
              name: pod-template
              spec:
                containers:
                  - image: "{{ container_image_altinity_clickhouse_server }}"
                    imagePullPolicy: IfNotPresent
                    name: clickhouse
                    ports:
                      - containerPort: 8123
                        name: http
                      - containerPort: 9000
                        name: tcp
                    resources:
                      limits:
                        memory: 6Gi
                      requests:
                        cpu: 100m
                        memory: 2Gi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                securityContext:
                  fsGroup: 101
                  runAsGroup: 101
                  runAsNonRoot: true
                  runAsUser: 101
                  seccompProfile:
                    type: RuntimeDefault
          serviceTemplates:
            - metadata:
                labels:
                  "app.kubernetes.io/name": clickhouse
                  app.kubernetes.io/version: 26.3.33.10001
              name: service-template
              spec:
                ports:
                  - name: http
                    port: 8123
                    targetPort: 8123
                  - name: tcp
                    port: 9000
                    targetPort: 9000
                selector:
                  "app.kubernetes.io/name": clickhouse
                type: ClusterIP
          volumeClaimTemplates:
            - name: data-volume-template
              reclaimPolicy: Retain
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Gi
    state: present

- name: Wait for Clickhouse installation to complete
  delay: 30
  kubernetes.core.k8s_info:
    api_version: clickhouse.altinity.com/v1
    kind: ClickHouseInstallation
    name: "{{ itbench_clickhouse_databases.observability.name }}"
    namespace: "{{ itbench_namespaces.observability }}"
  register: tools_chi
  retries: 10
  until:
    - tools_chi.resources[0].status is ansible.builtin.defined
    - tools_chi.resources[0].status.status is ansible.builtin.defined
    - tools_chi.resources[0].status.status == 'Completed'

- name: Create Job for Clickhouse database initialization
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          "app.kubernetes.io/name": clickhouse-init
        name: clickhouse-init
        namespace: "{{ itbench_namespaces.observability }}"
      spec:
        backoffLimit: 5
        template:
          metadata:
            labels:
              "app.kubernetes.io/name": clickhouse-init
          spec:
            containers:
              - args:
                  - >-
                    clickhouse-client
                    --host "$CLICKHOUSE_HOST"
                    --user "$CLICKHOUSE_USER"
                    --password "$CLICKHOUSE_PASSWORD"
                    --multiquery
                    --query "
                      CREATE DATABASE IF NOT EXISTS bank_of_anthos;
                      CREATE DATABASE IF NOT EXISTS jaeger;
                      CREATE DATABASE IF NOT EXISTS istio;
                      CREATE DATABASE IF NOT EXISTS kubernetes;
                      CREATE DATABASE IF NOT EXISTS microservices_demo;
                      CREATE DATABASE IF NOT EXISTS opentelemetry_demo;
                    "
                command:
                  - /bin/sh
                  - -c
                env:
                  - name: CLICKHOUSE_HOST
                    value: "{{ 'clickhouse-' ~ itbench_clickhouse_databases.observability.name }}"
                  - name: CLICKHOUSE_USER
                    valueFrom:
                      secretKeyRef:
                        key: CLICKHOUSE_USER
                        name: "{{ 'clickhouse-user-' ~ itbench_clickhouse_databases.observability.users.admin.name }}"
                  - name: CLICKHOUSE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        key: CLICKHOUSE_PASSWORD
                        name: "{{ 'clickhouse-user-' ~ itbench_clickhouse_databases.observability.users.admin.name }}"
                image: "{{ container_image_altinity_clickhouse_server }}"
                imagePullPolicy: IfNotPresent
                name: init
                resources:
                  limits:
                    memory: 256Mi
                  requests:
                    cpu: 50m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
            restartPolicy: Never
            securityContext:
              runAsGroup: 101
              runAsNonRoot: true
              runAsUser: 101
              seccompProfile:
                type: RuntimeDefault
    state: present
    wait: true
    wait_condition:
      status: "True"
      type: Complete
    wait_timeout: 600

- name: Create ServiceMonitor for Clickhouse Installation
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: main
        namespace: "{{ itbench_namespaces.observability }}"
      spec:
        endpoints:
          - interval: 30s
            port: http
        selector:
          matchLabels:
            "app.kubernetes.io/name": clickhouse
    state: present
