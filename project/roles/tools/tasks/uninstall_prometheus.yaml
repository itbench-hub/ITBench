---
- name: Uninstall Prometheus Operator and Prometheus Helm release
  kubernetes.core.helm:
    release_name: "{{ helm_release_kube_prometheus_stack.name }}"
    release_namespace: "{{ itbench_namespaces.observability }}"
    release_state: absent
    timeout: "600s"
    wait: true
  when:
    - tools_cluster.platform == "kubernetes"

- name: Uninstall Prometheus on OpenShift
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Delete User Workload ConfigMap
      kubernetes.core.k8s:
        api_version: v1
        kind: ConfigMap
        name: "{{ openshift_user_workload_monitoring_config_map }}"
        namespace: "{{ openshift_user_workload_monitoring_namespace }}"
        state: absent

    - name: Delete Cluster Monitoring ConfigMap
      kubernetes.core.k8s:
        api_version: v1
        kind: ConfigMap
        name: "{{ openshift_monitoring_config_map }}"
        namespace: "{{ openshift_monitoring_namespace }}"
        state: absent
