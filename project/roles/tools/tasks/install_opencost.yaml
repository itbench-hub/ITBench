---
- name: Create ClusterRoleBinding for OpenCost
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        labels:
          "itbench.io/ansible-role": tools
          "itbench.io/layer": infrastructure
        name: opencost-prometheus
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ 'monitoring-alertmanager-api-reader' if tools_cluster.platform == 'openshift' else 'monitoring-prometheus-api-reader' }}"
      subjects:
        - kind: ServiceAccount
          name: opencost
          namespace: "{{ helm_release_opencost.namespace }}"
    state: present

- name: Install OpenCost
  kubernetes.core.helm:
    chart_ref: "{{ helm_chart_opencost.reference }}"
    chart_version: "{{ helm_chart_opencost.version }}"
    release_name: "{{ helm_release_opencost.name }}"
    release_namespace: "{{ helm_release_opencost.namespace }}"
    release_state: present
    release_values:
      opencost:
        customPricing:
          costModel:
            CPU: 10.00
            GPU: 50.00
            RAM: 5.00
            description: Modified pricing configuration.
            internetNetworkEgress: 1.00
            regionNetworkEgress: 1.00
            spotCPU: 7.50
            spotRAM: 2.50
            storage: 2.50
            zoneNetworkEgress: 1.00
          createConfigmap: true
          enabled: true
          provider: custom
        exporter:
          extraEnv:
            USE_CUSTOM_PROVIDER: true
        metrics:
          serviceMonitor:
            enabled: true
        mcp:
          enabled: true
          httpRoute:
            enabled: true
            parentRefs:
              - name: "{{ itbench_kubernetes_gateways.mcp.name }}"
                namespace: "{{ itbench_kubernetes_gateways.mcp.namespace }}"
            rules:
              - backendRefs:
                  - name: ""
                matches:
                  - headers:
                      - name: Authorization
                        type: Exact
                        value: "{{ 'Bearer ' ~ itbench_kubernetes_gateways.mcp.token }}"
                    path:
                      type: PathPrefix
                      value: /mcp/opencost
        platforms:
          openshift:
            enabled: "{{ tools_cluster.platform == 'openshift' }}"
        prometheus:
          insecureSkipVerify: true
          internal:
            enabled: true
            namespaceName: >-
              {{
                (tools_cluster.platform == "openshift") |
                ansible.builtin.ternary(
                  openshift_monitoring_namespace,
                  itbench_namespaces.observability
                )
              }}
            port: >-
              {{
                (tools_cluster.platform == "openshift") |
                ansible.builtin.ternary(
                  openshift_monitoring_prometheus.port,
                  itbench_prometheus_proxy.ports.https
                )
              }}
            scheme: https
            serviceName: >-
              {{
                (tools_cluster.platform == "openshift") |
                ansible.builtin.ternary(
                  openshift_monitoring_prometheus.name,
                  helm_release_kube_prometheus_stack.name ~ "-prometheus"
                )
              }}
          kubeRBACProxy: true
        thanos:
          enabled: "{{ tools_cluster.platform == 'openshift' }}"
          internal:
            namespaceName: "{{ openshift_monitoring_namespace }}"
            port: "{{ openshift_monitoring_thanos_querier.port }}"
            scheme: https
            serviceName: "{{ openshift_monitoring_thanos_querier.name }}"
    timeout: 10m0s
    wait: true

- name: Create PrometheusRules
  kubernetes.core.k8s:
    state: present
    template: templates/kubernetes/opencost/prometheusrules.j2
