---
- name: Install cert-manager on Kubernetes
  kubernetes.core.helm:
    chart_ref: "{{ helm_chart_cert_manager.reference }}"
    chart_version: "{{ helm_chart_cert_manager.version }}"
    release_name: "{{ helm_release_cert_manager.name }}"
    release_namespace: "{{ itbench_namespaces.system }}"
    release_state: present
    release_values:
      crds:
        enabled: true
      prometheus:
        enabled: true
        servicemonitor:
          enabled: true
    timeout: 10m0s
    wait: true
  when:
    - tools_cluster.platform == "kubernetes"

- name: Install cert-manager Operator on OpenShift
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Create Project for cert-manager Operator for Red Hat OpenShift
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: project.openshift.io/v1
          kind: Project
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/inject": false
              "itbench.io/layer": infrastructure
              "itbench.io/monitor": "true"
            name: "{{ openshift_cert_manager_namespace }}"
        state: present

    - name: Create the operator group for RH cert-manager Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: "{{ openshift_cert_manager_operator_group.name }}"
            namespace: "{{ openshift_cert_manager_operator_group.namespace }}"
        state: present

    - name: Create the subscription for RH cert-manager Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": infrastructure
            name: "{{ openshift_cert_manager_subscription.name }}"
            namespace: "{{ openshift_cert_manager_subscription.namespace }}"
          spec:
            channel: "{{ openshift_cert_manager_subscription.channel }}"
            installPlanApproval: "{{ openshift_operator_subscription_install_plan_approval }}"
            name: "{{ openshift_cert_manager_subscription.name }}"
            source: "{{ openshift_operator_subscription_source }}"
            sourceNamespace: "{{ openshift_operator_subscription_source_namespace }}"
        state: present
        wait: true
        wait_condition:
          status: "False"
          type: CatalogSourcesUnhealthy
        wait_timeout: 300
