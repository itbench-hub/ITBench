---
- name: Install OpenTelemetry Operator on Kubernetes
  kubernetes.core.helm:
    chart_ref: "{{ helm_chart_opentelemetry_operator.reference }}"
    chart_version: "{{ helm_chart_opentelemetry_operator.version }}"
    release_name: "{{ helm_release_opentelemetry_operator.name }}"
    release_namespace: "{{ itbench_namespaces.operators }}"
    release_state: present
    release_values:
      admissionWebhooks:
        certManager:
          enabled: true
      manager:
        serviceMonitor:
          enabled: true
    timeout: 10m0s
    wait: true
  when:
    - tools_cluster.platform == "kubernetes"

- name: Install OpenTelemetry Operator on OpenShift
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Create the project for RH build of OpenTelemetry Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: project.openshift.io/v1
          kind: Project
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": observability
              "itbench.io/monitor": "true"
            name: "{{ openshift_opentelemetry_operator_namespace }}"
          state: present

    - name: Create the operator group for RH build of OpenTelemetry Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: "{{ openshift_opentelemetry_operator_operator_group.name }}"
            namespace: "{{ openshift_opentelemetry_operator_operator_group.namespace }}"
          spec:
            upgradeStrategy: Default
        state: present

    - name: Create the subscription for RH build of OpenTelemetry Operator
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": observability
            name: "{{ openshift_opentelemetry_operator_subscription.name }}"
            namespace: "{{ openshift_opentelemetry_operator_subscription.namespace }}"
          spec:
            channel: "{{ openshift_opentelemetry_operator_subscription.channel }}"
            installPlanApproval: "{{ openshift_operator_subscription_install_plan_approval }}"
            name: "{{ openshift_opentelemetry_operator_subscription.name }}"
            source: "{{ openshift_operator_subscription_source }}"
            sourceNamespace: "{{ openshift_operator_subscription_source_namespace }}"
        state: present
        wait: true
        wait_condition:
          status: "False"
          type: CatalogSourcesUnhealthy
        wait_timeout: 300

- name: Install OpenTelemetry Collector for Jaeger
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: "{{ itbench_opentelemetry_collectors.jaeger.name }}"
        namespace: "{{ itbench_namespaces.observability }}"
      spec:
        config:
          exporters:
            jaeger_storage_exporter:
              trace_storage: traces_store
          extensions:
            jaeger_query:
              storage:
                traces: traces_store
            jaeger_storage:
              backends:
                traces_store:
                  clickhouse:
                    addresses:
                      - "{{ fqdn_itbench_clickhouse_database_observability.tcp }}"
                    auth:
                      basic:
                        password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
                        username: ${env:CLICKHOUSE_USER}
                    create_schema: true
                    table_engine:
                      merge_tree: {}
          processors:
            batch:
              send_batch_size: 8192
              timeout: 1s
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ itbench_opentelemetry_collectors.jaeger.ports.collector }}
          service:
            extensions:
              - jaeger_storage
              - jaeger_query
            pipelines:
              traces:
                exporters:
                  - jaeger_storage_exporter
                processors:
                  - batch
                receivers:
                  - otlp
        envFrom:
          - secretRef:
              name: "{{ 'clickhouse-user-' ~ itbench_clickhouse_databases.observability.users.jaeger.name }}"
        image: "{{ container_image_jaegertracing_jaeger }}"
        mode: deployment
        observability:
          metrics:
            enableMetrics: true
        ports:
          - name: query-http
            port: "{{ itbench_opentelemetry_collectors.jaeger.ports.querier }}"
    state: present
    wait: true
    wait_condition:
      reason: Reconciled
      status: "True"
      type: Ready

# NOTE: The two gateways are the only Clickhouse writers for OTLP logs. Each source has its own
#       named receiver (and port) with a dedicated pipeline, so no routing is required.
#         - infrastructure: Kubernetes recorders and Istio (fixed volume, one replica)
#         - applications: Bank of Anthos, Microservices Demo and OpenTelemetry Demo
#       Ports are only unique within a gateway, as each gateway is its own Service.

- name: Install OpenTelemetry Collector for OTLP infrastructure gateway
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: "{{ itbench_opentelemetry_gateways.infrastructure.name }}"
        namespace: "{{ itbench_namespaces.observability }}"
      spec:
        config:
          exporters:
            clickhouse/istio:
              database: istio
              endpoint: "{{ _fqdn_clickhouse }}"
              logs_table_name: access_logs
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            clickhouse/kubernetes_events:
              database: kubernetes
              endpoint: "{{ _fqdn_clickhouse }}"
              logs_table_name: events
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            clickhouse/kubernetes_infrastructure:
              database: kubernetes
              endpoint: "{{ _fqdn_clickhouse }}"
              logs_table_name: infrastructure
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            clickhouse/kubernetes_topology:
              database: kubernetes
              endpoint: "{{ _fqdn_clickhouse }}"
              logs_table_name: topology
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            otlp_grpc/jaeger:
              endpoint: "{{ fqdn_itbench_opentelemetry_collectors_jaeger.collector }}"
              retry_on_failure:
                enabled: true
              sending_queue:
                enabled: true
              tls:
                insecure: true
          processors:
            batch:
              send_batch_max_size: 16384
              send_batch_size: 8192
              timeout: 1s
            memory_limiter:
              check_interval: 1s
              limit_mib: 400
              spike_limit_mib: 100
          receivers:
            otlp/istio:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ itbench_opentelemetry_gateways.infrastructure.ports.istio }}
            otlp/kubernetes_events:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ itbench_opentelemetry_gateways.infrastructure.ports.kubernetes_events }}
            otlp/kubernetes_infrastructure:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ itbench_opentelemetry_gateways.infrastructure.ports.kubernetes_infrastructure }}
            otlp/kubernetes_topology:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ itbench_opentelemetry_gateways.infrastructure.ports.kubernetes_topology }}
            otlp/traces:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ itbench_opentelemetry_gateways.infrastructure.ports.traces }}
          service:
            pipelines:
              logs/istio:
                exporters:
                  - clickhouse/istio
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/istio
              logs/kubernetes_events:
                exporters:
                  - clickhouse/kubernetes_events
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/kubernetes_events
              logs/kubernetes_infrastructure:
                exporters:
                  - clickhouse/kubernetes_infrastructure
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/kubernetes_infrastructure
              logs/kubernetes_topology:
                exporters:
                  - clickhouse/kubernetes_topology
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/kubernetes_topology
              traces/jaeger:
                exporters:
                  - otlp_grpc/jaeger
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/traces
        envFrom:
          - secretRef:
              name: "{{ 'clickhouse-user-' ~ itbench_clickhouse_databases.observability.users.observability.name }}"
        image: quay.io/it-bench/opentelemetry-collector:2.0.0
        mode: deployment
        observability:
          metrics:
            enableMetrics: true
        ports:
          - name: istio
            port: "{{ itbench_opentelemetry_gateways.infrastructure.ports.istio }}"
          - name: k8s-events
            port: "{{ itbench_opentelemetry_gateways.infrastructure.ports.kubernetes_events }}"
          - name: k8s-infra
            port: "{{ itbench_opentelemetry_gateways.infrastructure.ports.kubernetes_infrastructure }}"
          - name: k8s-topology
            port: "{{ itbench_opentelemetry_gateways.infrastructure.ports.kubernetes_topology }}"
          - name: traces
            port: "{{ itbench_opentelemetry_gateways.infrastructure.ports.traces }}"
        resources:
          limits:
            memory: 512Mi
          requests:
            memory: 256Mi
    state: present
    wait: true
    wait_condition:
      reason: Reconciled
      status: "True"
      type: Ready
  vars:
    _fqdn_clickhouse: "tcp://{{ fqdn_itbench_clickhouse_database_observability.tcp }}"

- name: Install OpenTelemetry Collector for OTLP applications gateway
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: "{{ itbench_opentelemetry_gateways.applications.name }}"
        namespace: "{{ itbench_namespaces.observability }}"
      spec:
        config:
          exporters:
            clickhouse/bank_of_anthos:
              database: bank_of_anthos
              endpoint: "{{ _fqdn_clickhouse }}"
              logs_table_name: logs
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            clickhouse/microservices_demo:
              database: microservices_demo
              endpoint: "{{ _fqdn_clickhouse }}"
              logs_table_name: logs
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            clickhouse/opentelemetry_demo:
              database: opentelemetry_demo
              endpoint: "{{ _fqdn_clickhouse }}"
              logs_table_name: logs
              password: ${env:CLICKHOUSE_PASSWORD} # pragma: allowlist secret
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_elapsed_time: 300s
                max_interval: 30s
              sending_queue:
                enabled: true
                queue_size: 1000
              username: ${env:CLICKHOUSE_USER}
            otlp_grpc/jaeger:
              endpoint: "{{ fqdn_itbench_opentelemetry_collectors_jaeger.collector }}"
              retry_on_failure:
                enabled: true
              sending_queue:
                enabled: true
              tls:
                insecure: true
            prometheus:
              endpoint: 0.0.0.0:8889
          processors:
            batch:
              send_batch_max_size: 16384
              send_batch_size: 8192
              timeout: 1s
            memory_limiter:
              check_interval: 1s
              limit_mib: 800
              spike_limit_mib: 200
          receivers:
            otlp/bank_of_anthos:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ itbench_opentelemetry_gateways.applications.ports.bank_of_anthos }}
            otlp/metrics:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ itbench_opentelemetry_gateways.applications.ports.metrics }}
            otlp/microservices_demo:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ itbench_opentelemetry_gateways.applications.ports.microservices_demo }}
            otlp/opentelemetry_demo:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ itbench_opentelemetry_gateways.applications.ports.opentelemetry_demo }}
            otlp/traces:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:{{ itbench_opentelemetry_gateways.applications.ports.traces }}
          service:
            pipelines:
              logs/bank_of_anthos:
                exporters:
                  - clickhouse/bank_of_anthos
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/bank_of_anthos
              logs/microservices_demo:
                exporters:
                  - clickhouse/microservices_demo
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/microservices_demo
              logs/opentelemetry_demo:
                exporters:
                  - clickhouse/opentelemetry_demo
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/opentelemetry_demo
              metrics:
                exporters:
                  - prometheus
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/metrics
              traces/jaeger:
                exporters:
                  - otlp_grpc/jaeger
                processors:
                  - memory_limiter
                  - batch
                receivers:
                  - otlp/traces
        envFrom:
          - secretRef:
              name: "{{ 'clickhouse-user-' ~ itbench_clickhouse_databases.observability.users.observability.name }}"
        image: quay.io/it-bench/opentelemetry-collector:2.0.0
        mode: deployment
        observability:
          metrics:
            enableMetrics: true
        ports:
          - name: bank-of-anthos
            port: "{{ itbench_opentelemetry_gateways.applications.ports.bank_of_anthos }}"
          - name: metrics
            port: "{{ itbench_opentelemetry_gateways.applications.ports.metrics }}"
          - name: micro-demo
            port: "{{ itbench_opentelemetry_gateways.applications.ports.microservices_demo }}"
          - name: otel-demo
            port: "{{ itbench_opentelemetry_gateways.applications.ports.opentelemetry_demo }}"
          - name: prometheus
            port: 8889
          - name: traces
            port: "{{ itbench_opentelemetry_gateways.applications.ports.traces }}"
        resources:
          limits:
            memory: 1Gi
          requests:
            memory: 512Mi
    state: present
    wait: true
    wait_condition:
      reason: Reconciled
      status: "True"
      type: Ready
