---
- name: Install Kyverno
  kubernetes.core.helm:
    chart_ref: "{{ helm_chart_kyverno.reference }}"
    chart_version: "{{ helm_chart_kyverno.version }}"
    release_name: "{{ helm_release_kyverno.name }}"
    release_namespace: "{{ helm_release_kyverno.namespace }}"
    release_state: present
    release_values:
      admissionController:
        certManager:
          enabled: true
        serviceMonitor:
          enabled: true
      backgroundController:
        serviceMonitor:
          enabled: true
      cleanupController:
        certManager:
          enabled: true
        serviceMonitor:
          enabled: true
      prometheusRule:
        enabled: true
      reportsController:
        serviceMonitor:
          enabled: true
    wait: true
