---
- name: Install Istio Service Mesh on Kubernetes
  when:
    - tools_cluster.platform == "kubernetes"
  block:
    - name: Create Namespace for Istio
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/inject": "false"
              "itbench.io/layer": networking
              "itbench.io/monitor": "true"
            name: "{{ helm_release_istio_base.namespace }}"
        state: present

    - name: Install Istio Base (CRDs)
      kubernetes.core.helm:
        chart_ref: "{{ helm_chart_istio_base.reference }}"
        chart_version: "{{ helm_chart_istio_base.version }}"
        release_name: "{{ helm_release_istio_base.name }}"
        release_namespace: "{{ helm_release_istio_base.namespace }}"
        release_state: present
        release_values:
          profile: ambient
        wait: true

    - name: Install Istiod Control Plane
      kubernetes.core.helm:
        chart_ref: "{{ helm_chart_istio_istiod.reference }}"
        chart_version: "{{ helm_chart_istio_istiod.version }}"
        release_name: "{{ helm_release_istio_istiod.name }}"
        release_namespace: "{{ tools_namespace_istio_istiod }}"
        release_state: present
        release_values:
          meshConfig:
            enablePrometheusMerge: false
            enableTracing: true
            extensionProviders:
              - name: jaeger
                opentelemetry:
                  port: "{{ itbench_opentelemetry_gateways.infrastructure.ports.traces }}"
                  service: "{{ _fqdn_itbench_opentelemetry_gateway_infrastructure }}"
              - envoyOtelAls:
                  port: "{{ itbench_opentelemetry_gateways.infrastructure.ports.istio }}"
                  service: "{{ _fqdn_itbench_opentelemetry_gateway_infrastructure }}"
                name: opentelemetry
          profile: ambient
        wait: true

    - name: Install Istio CNI Node Agent
      kubernetes.core.helm:
        chart_ref: "{{ helm_chart_istio_cni.reference }}"
        chart_version: "{{ helm_chart_istio_cni.version }}"
        release_name: "{{ helm_release_istio_cni.name }}"
        release_namespace: "{{ tools_namespace_istio_cni }}"
        release_state: present
        release_values:
          profile: ambient
          useAppArmorAnnotation: false
        wait: true

    - name: Install Istio ZTunnel
      kubernetes.core.helm:
        chart_ref: "{{ helm_chart_istio_ztunnel.reference }}"
        chart_version: "{{ helm_chart_istio_ztunnel.version }}"
        release_name: "{{ helm_release_istio_ztunnel.name }}"
        release_namespace: "{{ tools_namespace_istio_ztunnel }}"
        release_state: present
        release_values:
          profile: ambient
        wait: true

- name: Install Service Mesh on OpenShift
  when:
    - tools_cluster.platform == "openshift"
  block:
    - name: Create Projects for Istio
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: project.openshift.io/v1
          kind: Project
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/inject": "false"
              "itbench.io/layer": networking
              "itbench.io/monitor": "true"
            name: "{{ istio_namespace }}"
        state: present
      loop: >-
        {{
          [
            tools_namespace_istio_istiod,
            tools_namespace_istio_cni,
            tools_namespace_istio_ztunnel
          ] |
          ansible.builtin.unique
        }}
      loop_control:
        label: namespace/{{ istio_namespace }}
        loop_var: istio_namespace

    - name: Create Subscription for Service Mesh 3
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": networking
            name: "{{ openshift_service_mesh3_subscription.name }}"
            namespace: "{{ openshift_service_mesh3_subscription.namespace }}"
          spec:
            channel: "{{ openshift_service_mesh3_subscription.channel }}"
            installPlanApproval: "{{ openshift_operator_subscription_install_plan_approval }}"
            name: "{{ openshift_service_mesh3_subscription.name }}"
            source: "{{ openshift_operator_subscription_source }}"
            sourceNamespace: "{{ openshift_operator_subscription_source_namespace }}"
        state: present
        wait: true
        wait_condition:
          status: "False"
          type: CatalogSourcesUnhealthy
        wait_timeout: 300

    - name: Install Istio
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: sailoperator.io/v1
          kind: Istio
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": networking
            name: "{{ openshift_service_mesh3_istio.name }}"
          spec:
            namespace: "{{ tools_namespace_istio_istiod }}"
            profile: ambient
            values:
              global:
                nativeNftables: true
              meshConfig:
                discoverySelectors:
                  - matchLabels:
                      istio-discovery: enabled
              pilot:
                trustedZtunnelNamespace: "{{ tools_namespace_istio_ztunnel }}"
        state: present

    - name: Install IstioCNI
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: sailoperator.io/v1
          kind: IstioCNI
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": networking
            name: "{{ openshift_service_mesh3_istio_cni.name }}"
          spec:
            namespace: "{{ tools_namespace_istio_cni }}"
            profile: ambient
            values:
              global:
                nativeNftables: true
        state: present

    - name: Install Ztunnel
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: sailoperator.io/v1alpha1
          kind: ZTunnel
          metadata:
            labels:
              "itbench.io/ansible-role": tools
              "itbench.io/layer": networking
            name: "{{ openshift_service_mesh3_istio_ztunnel.name }}"
          spec:
            namespace: "{{ tools_namespace_istio_ztunnel }}"
            profile: ambient
        state: present

- name: Create Telemetry
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: telemetry.istio.io/v1
      kind: Telemetry
      metadata:
        name: istio-telemetry
        namespace: "{{ tools_namespace_istio_istiod }}"
      spec:
        accessLogging:
          - providers:
              - name: opentelemetry
        tracing:
          - providers:
              - name: jaeger
            randomSamplingPercentage: 10
    state: present
  when:
    - tools_observability_enabled

- name: Create ServiceMonitor for Control Plane
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: "{{ helm_release_istio_istiod.name }}"
        namespace: "{{ tools_namespace_istio_istiod }}"
      spec:
        endpoints:
          - interval: 30s
            port: http-monitoring
        selector:
          matchLabels:
            "app.kubernetes.io/name": "{{ helm_release_istio_istiod.name }}"
            "app.kubernetes.io/part-of": istio
    state: present

- name: Create PodMonitor for CNI Pods
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: "{{ helm_release_istio_cni.name }}"
        namespace: "{{ tools_namespace_istio_cni }}"
      spec:
        podMetricsEndpoints:
          - interval: 30s
            port: metrics
        selector:
          matchLabels:
            "app.kubernetes.io/name": "{{ helm_release_istio_cni.name }}"
            "app.kubernetes.io/part-of": istio
    state: present

- name: Create PodMonitor for ZTunnel Pods
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: "{{ helm_release_istio_ztunnel.name }}"
        namespace: "{{ tools_namespace_istio_ztunnel }}"
      spec:
        podMetricsEndpoints:
          - interval: 30s
            port: ztunnel-stats
        selector:
          matchLabels:
            "app.kubernetes.io/name": "{{ helm_release_istio_ztunnel.name }}"
            "app.kubernetes.io/part-of": istio
    state: present
