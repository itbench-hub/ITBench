---
- name: Include fault argument validation tasks
  ansible.builtin.include_tasks:
    file: validate_fault_arguments.yaml

- name: Generate corrupted data for each secret key
  ansible.builtin.set_fact:
    faults_corrupted_data: >-
      {{
        faults_corrupted_data |
        ansible.builtin.default({}) |
        ansible.builtin.combine({
          secret_key: (
              lookup(
                "ansible.builtin.password",
                "/dev/null",
                chars=["ascii_letters", "digits"],
                length=25,
                seed=random_fault_injection_seed ~ secret_key
              ) |
              ansible.builtin.b64encode
            )
        })
      }}
  loop: "{{ faults_kubernetes_object.data.keys() | ansible.builtin.list }}"
  loop_control:
    label: "key/{{ secret_key }}"
    loop_var: secret_key

- name: Corrupt secret data with random values
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ faults_kubernetes_object.metadata.name }}"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      data: "{{ faults_corrupted_data }}"
    state: patched
