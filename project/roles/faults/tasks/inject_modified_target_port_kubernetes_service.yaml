---
- name: Include fault argument validation tasks
  ansible.builtin.include_tasks:
    file: validate_fault_arguments.yaml

- name: Update service ports
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: "{{ faults_kubernetes_object.apiVersion }}"
      kind: "{{ faults_kubernetes_object.kind }}"
      metadata:
        name: "{{ faults_kubernetes_object.metadata.name }}"
        namespace: "{{ faults_kubernetes_object.metadata.namespace }}"
      spec:
        ports: >-
          {{
            [
              port |
              ansible.builtin.combine({
                "targetPort": port.targetPort + _modifier if port.targetPort is ansible.builtin.number else "http-" ~ _modifier
              })
            ]
          }}
    state: patched
  loop: "{{ faults_kubernetes_object.spec.ports }}"
  loop_control:
    label: port/{{ port.port }}
    loop_var: port
    pause: "{{ range(1, 5) | ansible.builtin.list | ansible.builtin.random }}"
  vars:
    _modifier: "{{ range(1, 11) | ansible.builtin.list | ansible.builtin.random(seed=random_fault_injection_seed) }}"
