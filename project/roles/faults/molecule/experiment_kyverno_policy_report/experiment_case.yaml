---
- name: Set facts for case {{ exp_case.id }}
  ansible.builtin.set_fact:
    exp_namespace: "kyverno-exp-{{ exp_case.id }}"

- name: Create namespace for case {{ exp_case.id }}
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        labels:
          "itbench.io/experiment": kyverno-policy-report
        name: "{{ exp_namespace }}"
    state: present

- name: Create the workload first for case {{ exp_case.id }}
  kubernetes.core.k8s:
    resource_definition: "{{ exp_deployment }}"
    state: present
    wait: true
  when:
    - exp_case.order == 'workload_first'

- name: Create policy for case {{ exp_case.id }}
  kubernetes.core.k8s:
    resource_definition: "{{ exp_policy_base | ansible.builtin.combine(exp_overrides[exp_case.variant], recursive=true) }}"
    state: present

# The fault itself would not wait. The pause only makes sure that the admission webhook knows the policy.
- name: Create the workload after the policy for case {{ exp_case.id }}
  when:
    - exp_case.order == 'policy_first'
  block:
    - name: Wait for the policy to be known to the admission webhook
      ansible.builtin.pause:
        seconds: 15

    - name: Create the workload
      kubernetes.core.k8s:
        resource_definition: "{{ exp_deployment }}"
        state: present
        wait: true

- name: Poll the policy reports while the defect is active for case {{ exp_case.id }}
  ansible.builtin.command:
    argv:
      - bash
      - "{{ playbook_dir }}/poll.sh"
      - "{{ exp_namespace }}"
      - require-container-limits
      - "120"
      - "^(fail|error)$"
  changed_when: false
  register: exp_active

- name: Show the policy report entries while the defect is active for case {{ exp_case.id }}
  ansible.builtin.debug:
    var: exp_active.stdout_lines

- name: Fix the defect and poll for case {{ exp_case.id }}
  when:
    - exp_case.variant != 'control'
  block:
    - name: Patch the one defective field
      kubernetes.core.k8s:
        resource_definition: >-
          {{
            {
              'apiVersion': 'policies.kyverno.io/v1',
              'kind': 'NamespacedValidatingPolicy',
              'metadata': {'name': 'require-container-limits', 'namespace': exp_namespace}
            } | ansible.builtin.combine(exp_fixes[exp_case.variant], recursive=true)
          }}
        state: patched

    - name: Poll the policy reports after the fix
      ansible.builtin.command:
        argv:
          - bash
          - "{{ playbook_dir }}/poll.sh"
          - "{{ exp_namespace }}"
          - require-container-limits
          - "120"
          - "^fail$"
      changed_when: false
      register: exp_fixed

    - name: Show the policy report entries after the fix
      ansible.builtin.debug:
        var: exp_fixed.stdout_lines
