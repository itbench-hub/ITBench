---
# Throwaway experiment (step 1 of ciso-policy-fault-task.md). Delete this scenario once its results are recorded in ciso-plan.md.
# Variants:
#   control: the policy as in `inject_missing_resource_limits_kyverno_policy.yaml`.
#   a: `spec.evaluation.background.enabled: false`.
#   b: `spec.matchConstraints.resourceRules[].resources` names `pods`, while the expression still reads `object.spec.template.spec.containers`.
- name: Run Kyverno policy report experiment
  hosts:
    - localhost
  vars:
    exp_cases:
      - id: control-workload-first
        order: workload_first
        variant: control
      - id: a-workload-first
        order: workload_first
        variant: a
      - id: a-policy-first
        order: policy_first
        variant: a
      - id: b-workload-first
        order: workload_first
        variant: b
      - id: b-policy-first
        order: policy_first
        variant: b
    exp_rule_apps:
      apiGroups:
        - apps
      apiVersions:
        - v1
      operations:
        - CREATE
        - UPDATE
      resources:
        - deployments
    exp_rule_pods:
      apiGroups:
        - ""
      apiVersions:
        - v1
      operations:
        - CREATE
        - UPDATE
      resources:
        - pods
    exp_policy_base:
      apiVersion: policies.kyverno.io/v1
      kind: NamespacedValidatingPolicy
      metadata:
        name: require-container-limits
        namespace: "{{ exp_namespace }}"
      spec:
        matchConstraints:
          resourceRules:
            - "{{ exp_rule_apps }}"
        validationActions:
          - Audit
        validations:
          - expression: >-
              object.spec.template.spec.containers.all(container,
              has(container.resources) &&
              has(container.resources.limits) &&
              size(container.resources.limits) > 0)
            message: Every container must define resource limits.
    exp_overrides:
      control: {}
      a:
        spec:
          evaluation:
            background:
              enabled: false
      b:
        spec:
          matchConstraints:
            resourceRules:
              - "{{ exp_rule_pods }}"
    exp_fixes:
      a:
        spec:
          evaluation:
            background:
              enabled: true
      b:
        spec:
          matchConstraints:
            resourceRules:
              - "{{ exp_rule_apps }}"
    exp_deployment:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: test-workload
        namespace: "{{ exp_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            "app.kubernetes.io/name": test-workload
        template:
          metadata:
            labels:
              "app.kubernetes.io/name": test-workload
          spec:
            containers:
              - name: server
                image: "{{ container_image_ubi10_ubi_minimal }}"
                command:
                  - /bin/sh
                args:
                  - -c
                  - "sleep infinity"
  tasks:
    - name: Retrieve the CRD of NamespacedValidatingPolicy
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: namespacedvalidatingpolicies.policies.kyverno.io
      register: exp_crd

    - name: Show the CRD description of `spec.evaluation`
      ansible.builtin.debug:
        msg: >-
          {{
            (
              exp_crd.resources[0].spec.versions |
              ansible.builtin.selectattr('name', 'equalto', 'v1') |
              ansible.builtin.first
            ).schema.openAPIV3Schema.properties.spec.properties.evaluation |
            ansible.builtin.default('no spec.evaluation in the CRD') |
            ansible.builtin.to_nice_json
          }}

    - name: Run case
      ansible.builtin.include_tasks:
        file: experiment_case.yaml
      loop: "{{ exp_cases }}"
      loop_control:
        label: "{{ exp_case.id }}"
        loop_var: exp_case
