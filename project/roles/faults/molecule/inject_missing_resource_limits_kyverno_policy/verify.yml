---
- name: Verify that fault injection succeeded
  hosts:
    - localhost
  tasks:
    - name: Retrieve policy
      kubernetes.core.k8s_info:
        api_version: policies.kyverno.io/v1
        kind: NamespacedValidatingPolicy
        name: require-container-limits
        namespace: missing-resource-limits-test
      register: faults_policy

    - name: Validate that policy was created
      ansible.builtin.assert:
        that:
          - faults_policy.resources | ansible.builtin.length == 1
        fail_msg: Policy not found. Fault injection failed.
        success_msg: Policy found.

    - name: Retrieve workload
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: test-workload
        namespace: missing-resource-limits-test
      register: faults_deployment

    - name: Validate that the workload container no longer has resource limits
      ansible.builtin.assert:
        that:
          - faults_deployment.resources[0].spec.template.spec.containers[0].resources.limits is ansible.builtin.undefined
            or faults_deployment.resources[0].spec.template.spec.containers[0].resources.limits | ansible.builtin.length == 0
        fail_msg: Workload container still has resource limits. Fault injection failed.
        success_msg: Workload container has no resource limits.

    - name: Wait for the policy report to show the failed result
      kubernetes.core.k8s_info:
        api_version: wgpolicyk8s.io/v1alpha2
        kind: PolicyReport
        namespace: missing-resource-limits-test
      register: faults_policy_reports
      vars:
        failed_results: >-
          {{
            faults_policy_reports.resources |
            ansible.builtin.default([]) |
            ansible.builtin.map(attribute="results", default=[]) |
            ansible.builtin.flatten |
            ansible.builtin.selectattr("policy", "equalto", "missing-resource-limits-test/require-container-limits") |
            ansible.builtin.selectattr("result", "equalto", "fail") |
            ansible.builtin.list
          }}
      until:
        - failed_results | ansible.builtin.length > 0
      retries: 30
      delay: 5

    # The fix, as the agent would make it. The failed entry must turn into a passed one.
    - name: Restore the resource limits
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-workload
            namespace: missing-resource-limits-test
          spec:
            template:
              spec:
                containers:
                  - name: server
                    resources:
                      limits:
                        cpu: 100m
                        memory: 64Mi
        state: patched

    - name: Wait for the policy report to show the passed result
      kubernetes.core.k8s_info:
        api_version: wgpolicyk8s.io/v1alpha2
        kind: PolicyReport
        namespace: missing-resource-limits-test
      register: faults_policy_reports_fixed
      vars:
        passed_results: >-
          {{
            faults_policy_reports_fixed.resources |
            ansible.builtin.default([]) |
            ansible.builtin.map(attribute="results", default=[]) |
            ansible.builtin.flatten |
            ansible.builtin.selectattr("policy", "equalto", "missing-resource-limits-test/require-container-limits") |
            ansible.builtin.selectattr("result", "equalto", "pass") |
            ansible.builtin.list
          }}
      until:
        - passed_results | ansible.builtin.length > 0
      retries: 30
      delay: 5
