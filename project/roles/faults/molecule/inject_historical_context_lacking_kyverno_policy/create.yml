---
- name: Create test resources
  hosts:
    - localhost
  tasks:
    - name: Import cluster role
      ansible.builtin.import_role:
        name: cluster

    - name: Import tools role
      ansible.builtin.import_role:
        name: tools
        tasks_from: install.yaml
      vars:
        tools_cluster:
          platform: "{{ cluster_platform }}"
        tools_governance_enabled: true

    - name: Create test namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: historical-context-test
        state: present

    - name: Create test deployment
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-workload
            namespace: historical-context-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                "app.kubernetes.io/name": test-workload
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": test-workload
              spec:
                containers:
                  - name: server
                    image: "{{ container_image_ubi10_ubi_minimal }}"
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - "sleep infinity"
                    securityContext:
                      readOnlyRootFilesystem: true
        state: present
        wait: true
