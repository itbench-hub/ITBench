---
- name: Install Prometheus MCP server
  kubernetes.core.helm:
    chart_ref: "{{ helm_chart_prometheus_mcp.reference }}"
    chart_version: "{{ helm_chart_prometheus_mcp.version }}"
    release_name: "{{ helm_release_prometheus_mcp.name }}"
    release_namespace: "{{ itbench_mcp_servers.prometheus.namespace }}"
    release_state: present
    release_values:
      route:
        main:
          enabled: true
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /
          matches:
            - path:
                type: PathPrefix
                value: /mcp/prometheus
          parentRefs:
            - name: "{{ itbench_kubernetes_gateways.mcp.name }}"
              namespace: "{{ itbench_kubernetes_gateways.mcp.namespace }}"
      serviceMonitor:
        enabled: true
    wait: true
