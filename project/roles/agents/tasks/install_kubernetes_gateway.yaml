---
- name: Create GatewayClass for OpenShift Ingress
  kubernetes.core.k8s_info:
    apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
  register: agents_gateway_classes

- name: Create Kubernetes Gateway for MCP servers
  kubernetes.core.k8s:
    resource_definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        labels:
          "itbench.io/ansible-role": agents
          "itbench.io/layer": networking
        name: "{{ itbench_kubernetes_gateways.mcp.name }}"
        namespace: "{{ itbench_kubernetes_gateways.mcp.namespace }}"
      spec:
        gatewayClassName: >-
          {{
            agents_gateway_classes.resources |
            ansible.builtin.selectattr("metadata.name", "==", openshift_kubernetes_gateway_class.name) |
            ansible.builtin.first |
            ansible.builtin.default("nginx")
          }}
        listeners:
          - allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchLabels:
                    "itbench.io/gateway-access": shared
            name: http
            port: 8080
            protocol: HTTP
    state: present
    wait: true
    wait_condition:
      status: "True"
      type: Programmed
