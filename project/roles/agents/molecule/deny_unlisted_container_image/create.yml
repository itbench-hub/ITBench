---
- name: Create Kubernetes objects
  hosts:
    - localhost
  tasks:
    - name: Create agents namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            labels:
              "itbench.io/ansible-role": agents
            name: "{{ itbench_namespaces.agents }}"
        state: present

    - name: Create MCP servers namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ itbench_namespaces.mcp_servers }}"
        state: present

    - name: Create fault injectable namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            labels:
              "itbench.io/ansible-role": applications
              "itbench.io/inject": "true"
            name: deny-unlisted-container-image-test
        state: present

    - name: Create deployment
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: compromised-workload
            namespace: deny-unlisted-container-image-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                "app.kubernetes.io/name": compromised-workload
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": compromised-workload
              spec:
                containers:
                  - name: server
                    image: "{{ container_image_ubi10_ubi_minimal }}"
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - "sleep infinity"
        state: present
        wait: true
