---
- name: Destroy Kubernetes objects
  hosts:
    - localhost
  tasks:
    - name: Delete ValidatingAdmissionPolicyBindings
      kubernetes.core.k8s:
        api_version: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicyBinding
        label_selectors:
          - "itbench.io/ansible-role=agents"
        state: absent
        wait: true

    - name: Delete ValidatingAdmissionPolicies
      kubernetes.core.k8s:
        api_version: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicy
        label_selectors:
          - "itbench.io/ansible-role=agents"
        state: absent
        wait: true

    - name: Delete ClusterRoleBindings
      kubernetes.core.k8s:
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        label_selectors:
          - "itbench.io/ansible-role=agents"
        state: absent
        wait: true

    - name: Delete ClusterRoles
      kubernetes.core.k8s:
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        label_selectors:
          - "itbench.io/ansible-role=agents"
        state: absent
        wait: true

    - name: Delete namespaces
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ namespace_name }}"
        state: absent
        wait: true
      loop:
        - deny-protected-network-policy-changes-test
        - "{{ itbench_namespaces.agents }}"
        - "{{ itbench_namespaces.mcp_servers }}"
      loop_control:
        loop_var: namespace_name
