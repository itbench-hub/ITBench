---
- name: Create Kubernetes objects
  hosts:
    - localhost
  tasks:
    # Kyverno brings the `NamespacedValidatingPolicy` and `PolicyReport` kinds.
    - name: Import cluster role
      ansible.builtin.import_role:
        name: cluster

    - name: Import tools role
      ansible.builtin.import_role:
        name: tools
        tasks_from: install.yaml
      vars:
        tools_cluster:
          platform: "{{ cluster_platform }}"
        tools_governance_enabled: true

    - name: Create agents namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            labels:
              "itbench.io/ansible-role": agents
            name: "{{ itbench_namespaces.agents }}"
        state: present

    - name: Create fault injectable namespace
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            labels:
              "itbench.io/ansible-role": applications
              "itbench.io/inject": "true"
            name: allow-diagnosis-policy-reads-test
        state: present

    # The agent has no RoleBinding here, so it must not be able to read anything in it.
    - name: Create namespace that is not fault injectable
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: allow-diagnosis-policy-reads-other
        state: present

    - name: Create policies
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: policies.kyverno.io/v1
          kind: NamespacedValidatingPolicy
          metadata:
            name: require-replicas
            namespace: "{{ policy_namespace }}"
          spec:
            matchConstraints:
              resourceRules:
                - apiGroups:
                    - apps
                  apiVersions:
                    - v1
                  operations:
                    - CREATE
                    - UPDATE
                  resources:
                    - deployments
            validationActions:
              - Audit
            validations:
              - expression: object.spec.replicas > 0
                message: Every workload must have replicas.
        state: present
      loop:
        - allow-diagnosis-policy-reads-test
        - allow-diagnosis-policy-reads-other
      loop_control:
        loop_var: policy_namespace

    - name: Create deployment, so that a policy report exists
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-workload
            namespace: allow-diagnosis-policy-reads-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                "app.kubernetes.io/name": test-workload
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": test-workload
              spec:
                containers:
                  - name: server
                    image: "{{ container_image_ubi10_ubi_minimal }}"
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - "sleep infinity"
        state: present
        wait: true
