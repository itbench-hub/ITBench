---
# Throwaway experiment for holes 7 and 8 of ciso-plan.md. Delete this scenario once the results are recorded.
#
# Questions answered, all visible in the task output:
#   1. Does a NamespacedValidatingPolicy in Audit mode write PolicyReport results? (hole 8)
#   2. What do the results look like: the `policy` value, `scope`, `resources`, `result`? (hole 8)
#   3. How many seconds pass between a change and the report reflecting it? (hole 7)
#        a. policy created over an already compliant Deployment -> `pass`
#        b. limits removed from the Deployment                  -> `fail`
#        c. limits restored                                     -> `pass`
- name: Measure policy report behavior of a NamespacedValidatingPolicy
  hosts:
    - localhost
  vars:
    experiment_namespace: kyverno-report-test
    experiment_policy: require-container-limits
    experiment_deployment: workload
    experiment_timeout_retries: 90
    experiment_timeout_delay: 2
  tasks:
    - name: Retrieve the PolicyReport CRD
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: policyreports.wgpolicyk8s.io
      register: experiment_polr_crd

    - name: Select the PolicyReport API version
      ansible.builtin.set_fact:
        experiment_report_api_version: >-
          {{
            'wgpolicyk8s.io/v1alpha2'
            if 'v1alpha2' in served_versions
            else 'wgpolicyk8s.io/' ~ served_versions[0]
          }}
      vars:
        served_versions: >-
          {{
            experiment_polr_crd.resources[0].spec.versions |
            selectattr('served') |
            map(attribute='name') |
            list
          }}

    - name: Show the PolicyReport API version
      ansible.builtin.debug:
        msg: "Using {{ experiment_report_api_version }}"

    - name: Create a Deployment that has resource limits
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ experiment_deployment }}"
            namespace: "{{ experiment_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                "app.kubernetes.io/name": "{{ experiment_deployment }}"
            template:
              metadata:
                labels:
                  "app.kubernetes.io/name": "{{ experiment_deployment }}"
              spec:
                containers:
                  - name: server
                    image: "{{ container_image_ubi10_ubi_minimal }}"
                    command:
                      - /bin/sh
                    args:
                      - -c
                      - "sleep infinity"
                    resources:
                      limits:
                        cpu: 100m
                        memory: 64Mi
                      requests:
                        cpu: 50m
                        memory: 32Mi
        state: present
        wait: true

    - name: Record the time before the policy is created
      ansible.builtin.set_fact:
        experiment_started: "{{ now(utc=true).timestamp() | float }}"

    - name: Create a policy that requires resource limits on every container
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: policies.kyverno.io/v1beta1
          kind: NamespacedValidatingPolicy
          metadata:
            name: "{{ experiment_policy }}"
            namespace: "{{ experiment_namespace }}"
          spec:
            validationActions:
              - Audit
            matchConstraints:
              resourceRules:
                - apiGroups:
                    - apps
                  apiVersions:
                    - v1
                  operations:
                    - CREATE
                    - UPDATE
                  resources:
                    - deployments
            validations:
              - expression: >-
                  object.spec.template.spec.containers.all(c,
                  has(c.resources) && has(c.resources.limits))
                message: Every container must set resource limits.
        state: present

    - name: Wait for a pass result after the policy was created over a compliant Deployment
      ansible.builtin.include_tasks:
        file: wait_for_report_result.yml
      vars:
        experiment_step: policy created, Deployment compliant
        experiment_expected_result: pass

    # The fault's own waiter, so the timing includes the pod restart its patch causes.
    - name: Remove the resource limits from the Deployment with the waiters role
      ansible.builtin.import_role:
        name: waiters
      vars:
        waiters_tasks:
          - id: unassign-workload-container-resource-limits
            workload:
              apiVersion: apps/v1
              kind: Deployment
              name: "{{ experiment_deployment }}"
              namespace: "{{ experiment_namespace }}"
            container: server

    - name: Record the time after the limits were removed
      ansible.builtin.set_fact:
        experiment_started: "{{ now(utc=true).timestamp() | float }}"

    - name: Wait for a fail result after the limits were removed
      ansible.builtin.include_tasks:
        file: wait_for_report_result.yml
      vars:
        experiment_step: limits removed
        experiment_expected_result: fail

    - name: Restore the resource limits on the Deployment
      kubernetes.core.k8s:
        resource_definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ experiment_deployment }}"
            namespace: "{{ experiment_namespace }}"
          spec:
            template:
              spec:
                containers:
                  - name: server
                    resources:
                      limits:
                        cpu: 100m
                        memory: 64Mi
        state: patched

    - name: Record the time after the limits were restored
      ansible.builtin.set_fact:
        experiment_started: "{{ now(utc=true).timestamp() | float }}"

    - name: Wait for a pass result after the limits were restored
      ansible.builtin.include_tasks:
        file: wait_for_report_result.yml
      vars:
        experiment_step: limits restored
        experiment_expected_result: pass

    - name: Retrieve every report in the cluster for the final record
      kubernetes.core.k8s_info:
        api_version: "{{ experiment_report_api_version }}"
        kind: PolicyReport
        namespace: "{{ experiment_namespace }}"
      register: experiment_final_reports

    - name: Show every report in the namespace
      ansible.builtin.debug:
        msg: "{{ experiment_final_reports.resources | ansible.builtin.to_nice_json }}"
