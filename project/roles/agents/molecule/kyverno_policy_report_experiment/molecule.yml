---
dependency:
  name: galaxy

ansible:
  env:
    ANSIBLE_ROLES_PATH: ../../..
    K8S_AUTH_KUBECONFIG: ${KUBECONFIG}
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_PROJECT_DIRECTORY}/../../../inventory
        - --tags=install,inject_faults,untagged
  playbooks:
    create: create.yml
    converge: converge.yml
    destroy: destroy.yml

scenario:
  name: kyverno_policy_report_experiment
  test_sequence:
    - syntax
    - create
    - converge
    - destroy
