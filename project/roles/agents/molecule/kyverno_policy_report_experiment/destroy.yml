---
- name: Remove Kyverno and its prerequisites
  hosts:
    - localhost
  tasks:
    - name: Delete the test namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: kyverno-report-test
        state: absent
        wait: true

    - name: Uninstall Kyverno
      kubernetes.core.helm:
        release_name: "{{ helm_release_kyverno.name }}"
        release_namespace: "{{ helm_release_kyverno.namespace }}"
        release_state: absent
        wait: true

    - name: Uninstall cert-manager
      kubernetes.core.helm:
        release_name: "{{ helm_release_cert_manager.name }}"
        release_namespace: "{{ itbench_namespaces.system }}"
        release_state: absent
        wait: true

    - name: Uninstall Prometheus Operator CRDs
      kubernetes.core.helm:
        release_name: "{{ helm_release_prometheus_operator_crds.name }}"
        release_namespace: "{{ itbench_namespaces.operators }}"
        release_state: absent
        wait: true

    # Kyverno leaves its webhooks behind if the pre-delete hook did not finish, which would break the
    # scenarios that run after this one.
    - name: Delete namespaces
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ namespace_name }}"
        state: absent
        wait: true
      loop:
        - "{{ helm_release_kyverno.namespace }}"
        - "{{ itbench_namespaces.system }}"
        - "{{ itbench_namespaces.operators }}"
      loop_control:
        loop_var: namespace_name
