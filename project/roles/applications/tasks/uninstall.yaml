---
- name: Uninstall Microservices Demo (Online Boutique)
  kubernetes.core.helm:
    release_name: "{{ helm_release_microservices_demo.name }}"
    release_namespace: "{{ applications_microservices_demo_namespace }}"
    release_state: absent
    wait: true

- name: Uninstall OpenTelemetry Demo (Astronomy Shop)
  kubernetes.core.helm:
    release_name: "{{ helm_release_opentelemetry_demo.name }}"
    release_namespace: "{{ applications_opentelemetry_demo_namespace }}"
    release_state: absent
    wait: true

- name: Delete all application namespaces
  kubernetes.core.k8s:
    api_version: v1
    delete_all: true
    kind: Namespace
    label_selectors:
      - "itbench.io/ansible-role=applications"
    state: absent
    wait: true
