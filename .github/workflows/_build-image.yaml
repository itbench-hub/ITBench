name: Build image (reusable)

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context path
        required: true
        type: string
      image:
        description: Image name without tag (e.g. quay.io/it-bench/my-image)
        required: true
        type: string
      tags:
        description: Newline-separated list of full image tags
        required: true
        type: string
      push:
        description: Whether to push the built image
        required: false
        type: boolean
        default: false
    secrets:
      QUAY_USERNAME:
        required: false
      QUAY_ROBOT_TOKEN:
        required: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Checkout codebase
        uses: actions/checkout@v7.0.1
      - name: Login to Quay.io
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build image
        id: build
        uses: docker/build-push-action@v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ inputs.context }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ inputs.image }},push-by-digest=${{ inputs.push }},push=${{ inputs.push }}
      - name: Export digest
        if: ${{ inputs.push }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.PLATFORM_PAIR }}-${{ github.run_id }}-digests
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: ${{ inputs.push }}
    runs-on: ubuntu-24.04
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: "*-${{ github.run_id }}-digests"
          merge-multiple: true
      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(echo "${{ inputs.tags }}" | sed 's/^[[:space:]]*//' | grep -v '^$' | sed 's/^/-t /') \
            $(printf '${{ inputs.image }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ inputs.image }}:latest
