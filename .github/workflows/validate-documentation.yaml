name: Validate ITBench documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - library/**
      - scenarios/sre/scripts/generate_library_*.py
      - scenarios/sre/scripts/validate_library_*.py
      - templates/documentation/**
      - templates/library/**
      - templates/schemas/**

jobs:
  validate-library:
    name: Validate documents
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
      - name: Install project dependencies
        run: |
          make deps
      - name: Run validation scripts
        run: |
          make -C scenarios/sre validate-library
