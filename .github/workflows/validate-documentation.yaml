name: Validate ITBench documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - library/**
      - scenarios/sre/scripts/generate_library_*.py
      - scenarios/sre/scripts/validate_library_*.py
      - templates/documentation/**
      - templates/library/**
      - templates/schemas/**

jobs:
  validate-library:
    name: Validate documents
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
      - name: Install project dependencies
        run: |
          make deps
      - name: Run validation scripts
        run: |
          make -C scenarios/sre validate-library
