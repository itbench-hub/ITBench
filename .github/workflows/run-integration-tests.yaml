name: Run ITBench Integration Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - components/recorders/**
      - clusters/kind/go.*
      - scenarios/sre/project/roles/tools/**
      - src/**
      - tests/integration/**
      - pyproject.toml

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clickhouse-recorder:
    name: ClickHouse Recorder Integration Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: components/recorders/clickhouse/go.mod
          cache-dependency-path: components/recorders/clickhouse/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: components/recorders/clickhouse
      - name: Test
        run: go test -count=1 ./...
        working-directory: components/recorders/clickhouse

  prometheus-recorder:
    name: Prometheus Recorder Integration Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: components/recorders/prometheus/go.mod
          cache-dependency-path: components/recorders/prometheus/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: components/recorders/prometheus
      - name: Test
        run: go test -count=1 ./...
        working-directory: components/recorders/prometheus

  itbench-cli:
    name: ITBench CLI Integration Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: clusters/kind/go.mod
          cache-dependency-path: clusters/kind/go.sum
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0
      - name: Install project dependencies
        run: |
          make deps
      - name: Create group vars
        run: |
          make -C scenarios/sre group-vars
      - name: Create Kind cluster
        run: |
          make -C clusters/kind create-simple-cluster
      - name: Run Cloud Provider
        run: |
          make -C clusters/kind run-service-provider &
          sleep 10
      - name: Deploy tools stack
        run: uv run itbench deploy tools --kubeconfig "$HOME/.kube/config"
      - name: Run CLI integration tests
        run: uv run --group dev pytest --integration -m integration -v tests/integration/
        env:
          KUBECONFIG: ${{ env.HOME }}/.kube/config
          ITBENCH_PLATFORM: kubernetes
      - name: Undeploy tools stack
        if: always()
        run: uv run itbench undeploy tools --kubeconfig "$HOME/.kube/config"
      - name: Destroy Kind cluster
        if: always()
        run: |
          make -C clusters/kind destroy-simple-cluster
