name: Run ITBench Integration Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - components/recorders/**
      - components/telemetry/**
      - clusters/kind/**
      - clusters/minikube/**
      - mise*.toml
      - project/manage_environment.yaml
      - project/roles/applications/tasks/install.yaml
      - project/roles/agents/**
      - project/roles/recorders/**
      - project/roles/tools/**
      - src/**
      - tests/integration/**
      - pyproject.toml

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFIG: ${{ github.workspace }}/clusters/kind/kubeconfigs/kind-environment
  MISE_ENV: kind

jobs:
  clickhouse-recorder:
    name: ClickHouse Recorder Integration Tests
    runs-on: ubuntu-26.04
    env:
      MISE_ENV: dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.7
      - name: Lint
        run: mise run lint:go:clickhouse-recorder
      - name: Test
        run: mise run test:integration:clickhouse-recorder

  prometheus-recorder:
    name: Prometheus Recorder Integration Tests
    runs-on: ubuntu-26.04
    env:
      MISE_ENV: dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.7
      - name: Lint
        run: mise run lint:go:prometheus-recorder
      - name: Test
        run: mise run test:integration:prometheus-recorder

  topology-writer:
    name: Topology Writer Integration Tests
    runs-on: ubuntu-26.04
    env:
      MISE_ENV: dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.7
      - name: Lint
        run: mise run lint:go:topology
      - name: Test
        run: mise run test:integration:topology

  itbench-cli:
    name: ITBench CLI Integration Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.7
      - name: Install project dependencies
        run: |
          mise run install:dev
      - name: Create Kind cluster
        run: |
          mise run create:kind:environment
      - name: Run Cloud Provider
        run: |
          mise run run:kind:provider &
          sleep 10
      - name: Run CLI integration tests
        run: mise run test:integration:cli
        env:
          ITBENCH_PLATFORM: kubernetes
      - name: Destroy Kind cluster
        if: always()
        run: |
          mise run destroy:kind:environment

  kind:
    name: Kind Integration Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.7
      - name: Install project dependencies
        run: |
          mise run install:dev
      - name: Create Kind cluster
        run: |
          mise run create:kind:environment
      - name: Run Cloud Provider
        run: |
          mise run run:kind:provider &
          sleep 10
      - name: Run Kind integration tests
        run: mise run test:integration:kind
        env:
          ITBENCH_PLATFORM: kubernetes
      - name: Destroy Kind cluster
        if: always()
        run: |
          mise run destroy:kind:environment

  minikube:
    name: Minikube Integration Tests
    runs-on: ubuntu-26.04
    env:
      KUBECONFIG: ${{ github.workspace }}/clusters/minikube/kubeconfigs/minikube-environment
      MISE_ENV: minikube
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.7
      - name: Install project dependencies
        run: |
          mise run install:dev
      - name: Create Minikube cluster
        run: |
          mise run create:minikube:environment
      - name: Start Minikube tunnel
        run: |
          mise run run:minikube:tunnel &
          sleep 10
      - name: Run Minikube integration tests
        run: mise run test:integration:minikube
        env:
          ITBENCH_PLATFORM: kubernetes
      - name: Destroy Minikube cluster
        if: always()
        run: |
          mise run destroy:minikube:environment
