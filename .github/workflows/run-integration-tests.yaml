name: Run ITBench Integration Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - components/recorders/**
      - components/telemetry/**
      - clusters/kind/**
      - mise*.toml
      - scenarios/sre/project/manage_environment.yaml
      - scenarios/sre/project/roles/applications/tasks/install.yaml
      - scenarios/sre/project/roles/applications/tasks/install_agent_rbac.yaml
      - scenarios/sre/project/roles/tools/**
      - src/**
      - tests/integration/**
      - pyproject.toml

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFIG: ${{ github.workspace }}/clusters/kind/kubeconfigs/kind-environment
  MISE_ENV: kind

jobs:
  clickhouse-recorder:
    name: ClickHouse Recorder Integration Tests
    runs-on: ubuntu-26.04
    env:
      MISE_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.7
      - name: Vet
        run: go vet ./...
        working-directory: components/recorders/clickhouse
      - name: Test
        run: go test -count=1 ./...
        working-directory: components/recorders/clickhouse

  prometheus-recorder:
    name: Prometheus Recorder Integration Tests
    runs-on: ubuntu-26.04
    env:
      MISE_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.7
      - name: Vet
        run: go vet ./...
        working-directory: components/recorders/prometheus
      - name: Test
        run: go test -count=1 ./...
        working-directory: components/recorders/prometheus

  topology-writer:
    name: Topology Writer Integration Tests
    runs-on: ubuntu-26.04
    env:
      MISE_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.7
      - name: Vet
        run: go vet ./...
        working-directory: components/telemetry/topology
      - name: Test
        run: go test -count=1 ./...
        working-directory: components/telemetry/topology

  itbench-cli:
    name: ITBench CLI Integration Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.7
      - name: Install project dependencies
        run: |
          mise run install:dev
      - name: Create Kind cluster
        run: |
          mise run create:kind:environment
      - name: Run Cloud Provider
        run: |
          mise run run:kind:provider &
          sleep 10
      - name: Deploy tools stack
        run: uv run itbench deploy environment --only tools
      - name: Run CLI integration tests
        run: uv run --group dev pytest --integration -m integration -v tests/integration/
        env:
          ITBENCH_PLATFORM: kubernetes
      - name: Undeploy tools stack
        if: always()
        run: uv run itbench undeploy environment --yes
      - name: Destroy Kind cluster
        if: always()
        run: |
          mise run destroy:kind:environment
