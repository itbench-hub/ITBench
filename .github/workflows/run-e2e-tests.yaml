name: Run ITBench End-To-End Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - clusters/kind/go.*
      - scenarios/project/roles/applications/tasks/install_*.yaml
      - scenarios/project/roles/cluster/vars/main/minimum_versions.yaml
      - scenarios/project/roles/executables/vars/main/minimum_versions.yaml
      - scenarios/project/roles/recorders/tasks/copy_python_recorder_files.yaml
      - scenarios/project/roles/recorders/tasks/deploy_python_recorder.yaml
      - scenarios/project/roles/tools/tasks/install_*.yaml
      - scenarios/project/manage_applications.yaml
      - scenarios/project/manage_faults.yaml
      - scenarios/project/manage_recorders.yaml
      - scenarios/project/manage_tools.yaml
      - scenarios/scripts/inject_scenario_faults.py
      - scenarios/Makefile
      - pyproject.toml
      - requirements.yaml

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finops:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: clusters/kind/go.mod
          cache-dependency-path: clusters/kind/go.sum
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.3
      - name: Create Kind cluster
        run: |
          make -C clusters/kind create-simple-cluster
      - name: Run Cloud Provider
        run: |
          make -C clusters/kind run-service-provider &
          sleep 10
      - name: Install project dependencies
        run: |
          make deps
      - name: Create group vars
        run: |
          make -C scenarios group-vars
      - name: Start FinOps Scenario 37 # Due to resources, skip deploying recorders
        run: |
          SCENARIO_NUMBER=37 make -C scenarios create-environment
          SCENARIO_NUMBER=37 make -C scenarios inject-scenario-faults
      - name: Stop FinOps Scenario 37
        run: |
          SCENARIO_NUMBER=37 make -C scenarios remove-fault-resources
          SCENARIO_NUMBER=37 make -C scenarios destroy-environment
      - name: Destroy Kind cluster
        run: |
          make -C clusters/kind destroy-simple-cluster
  sre:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: clusters/kind/go.mod
          cache-dependency-path: clusters/kind/go.sum
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.3
      - name: Create Kind cluster
        run: |
          make -C clusters/kind create-simple-cluster
      - name: Run Cloud Provider
        run: |
          make -C clusters/kind run-service-provider &
          sleep 10
      - name: Install project dependencies
        run: |
          make deps
      - name: Create group vars
        run: |
          make -C scenarios group-vars
      - name: Start SRE Scenario 60
        run: |
          SCENARIO_NUMBER=60 make -C scenarios start-scenario
      - name: Stop SRE Scenario 60
        run: |
          SCENARIO_NUMBER=60 make -C scenarios stop-scenario
      - name: Destroy Kind cluster
        run: |
          make -C clusters/kind destroy-simple-cluster
