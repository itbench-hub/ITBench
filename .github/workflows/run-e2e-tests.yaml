name: Run ITBench End-To-End Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - clusters/kind/go.*
      - scenarios/sre/project/roles/applications/tasks/install_*.yaml
      - scenarios/sre/project/roles/cluster/**
      - scenarios/sre/project/roles/executables/vars/main/minimum_versions.yaml
      - scenarios/sre/project/roles/faults/**
      - scenarios/sre/project/roles/tools/tasks/export*.yaml
      - scenarios/sre/project/roles/tools/tasks/install_*.yaml
      - scenarios/sre/project/roles/waiters/**
      - scenarios/sre/project/manage_environment.yaml
      - scenarios/sre/project/manage_faults.yaml
      - scenarios/sre/Makefile
      - src/itbench/cli/commands/deploy/**
      - src/itbench/cli/commands/inject/**
      - src/itbench/cli/commands/remove/**
      - src/itbench/cli/commands/undeploy/**
      - src/itbench/cli/playbook.py
      - src/itbench/utils/runner.py
      - pyproject.toml
      - requirements.yaml

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finops:
    runs-on: ubuntu-26.04
    steps:
      - name: Change Host Kernel Watcher Limits
        run: |
          # Elevate values directly on the shared runner host kernel
          sudo sysctl fs.inotify.max_user_instances=1024
          sudo sysctl fs.inotify.max_user_watches=524288

          # Boost process-level descriptor capacity for the shell
          ulimit -n 65536
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: clusters/kind/go.mod
          cache-dependency-path: clusters/kind/go.sum
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - name: Create Kind cluster
        run: |
          make -C clusters/kind create-simple-cluster
      - name: Run Cloud Provider
        run: |
          make -C clusters/kind run-service-provider &
          sleep 10
      - name: Install project dependencies
        run: |
          make deps
      - name: Create group vars
        run: |
          make -C scenarios/sre group-vars
      - name: Prepare cluster
        run: uv run itbench prepare cluster --kubeconfig "$HOME/.kube/config"
      - name: Deploy FinOps Scenario 37
        run: uv run itbench deploy environment --scenario 37 --kubeconfig "$HOME/.kube/config"
      - name: Undeploy FinOps Scenario 37
        run: uv run itbench undeploy environment --yes --kubeconfig "$HOME/.kube/config"
      - name: Destroy Kind cluster
        run: |
          make -C clusters/kind destroy-simple-cluster
  sre:
    runs-on: ubuntu-26.04
    steps:
      - name: Change Host Kernel Watcher Limits
        run: |
          # Elevate values directly on the shared runner host kernel
          sudo sysctl fs.inotify.max_user_instances=1024
          sudo sysctl fs.inotify.max_user_watches=524288

          # Boost process-level descriptor capacity for the shell
          ulimit -n 65536
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: clusters/kind/go.mod
          cache-dependency-path: clusters/kind/go.sum
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - name: Create Kind cluster
        run: |
          make -C clusters/kind create-simple-cluster
      - name: Run Cloud Provider
        run: |
          make -C clusters/kind run-service-provider &
          sleep 10
      - name: Install project dependencies
        run: |
          make deps
      - name: Create group vars
        run: |
          make -C scenarios/sre group-vars
      - name: Prepare cluster
        run: uv run itbench prepare cluster --kubeconfig "$HOME/.kube/config"
      - name: Configure environment
        run: uv run itbench configure environment --kubeconfig "$HOME/.kube/config"
      - name: Deploy SRE Scenario 60
        run: uv run itbench deploy environment --scenario 60 --kubeconfig "$HOME/.kube/config"
      - name: Inject SRE Scenario 60 faults
        run: uv run itbench inject faults --scenario 60 --kubeconfig "$HOME/.kube/config"
      - name: Remove SRE Scenario 60 faults
        run: uv run itbench remove faults --kubeconfig "$HOME/.kube/config"
      - name: Undeploy SRE Scenario 60
        run: uv run itbench undeploy environment --yes --kubeconfig "$HOME/.kube/config"
      - name: Destroy Kind cluster
        run: |
          make -C clusters/kind destroy-simple-cluster
