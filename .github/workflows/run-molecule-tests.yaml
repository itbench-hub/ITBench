name: Run ITBench Molecule Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - scenarios/sre/project/roles/awx/**
      - scenarios/sre/project/roles/faults/**
      - scenarios/sre/project/roles/waiters/**
      - '!scenarios/sre/project/roles/awx/tasks/generate_files.yaml'
      - '!scenarios/sre/project/roles/faults/tasks/generate_files.yaml'
      - '!scenarios/sre/project/roles/waiters/tasks/generate_files.yaml'

concurrency:
  group: ci-molecule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sre-faults:
    name: SRE Fault Injection Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: clusters/kind/go.mod
          cache-dependency-path: clusters/kind/go.sum
      - name: Install project dependencies
        run: |
          make deps
      - name: Create group vars
        run: |
          make -C scenarios/sre group-vars
      - name: Create Kind cluster
        run: |
          make -C clusters/kind create-environment-cluster
      - name: Run Cloud Provider
        run: |
          make -C clusters/kind run-service-provider &
          sleep 10
      - name: Run Molecule tests
        run: |
          make -C scenarios/sre test-molecule-faults
      - name: Destroy Kind cluster
        run: |
          make -C clusters/kind destroy-environment-cluster
  sre-waiters:
    name: SRE Waiters Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: clusters/kind/go.mod
          cache-dependency-path: clusters/kind/go.sum
      - name: Install project dependencies
        run: |
          make deps
      - name: Create group vars
        run: |
          make -C scenarios/sre group-vars
      - name: Create Kind cluster
        run: |
          make -C clusters/kind create-environment-cluster
      - name: Run Molecule tests
        run: |
          make -C scenarios/sre test-molecule-waiters
      - name: Destroy Kind cluster
        run: |
          make -C clusters/kind destroy-environment-cluster
