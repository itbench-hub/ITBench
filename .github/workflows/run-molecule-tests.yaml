name: Run ITBench Molecule Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - project/roles/agent/**
      - project/roles/faults/**
      - project/roles/waiters/**
      - '!project/roles/faults/tasks/generate_files.yaml'
      - '!project/roles/waiters/tasks/generate_files.yaml'

concurrency:
  group: ci-molecule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sre-faults:
    name: SRE Fault Injection Tests
    runs-on: ubuntu-26.04
    env:
      KUBECONFIG: ${{ github.workspace }}/clusters/kind/kubeconfigs/kind-environment
      MISE_ENV: kind
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.7
      - name: Install project dependencies
        run: |
          mise run install:dev
      - name: Create Kind cluster
        run: |
          mise run create:kind:environment
      - name: Run Cloud Provider
        run: |
          mise run run:kind:provider &
          sleep 10
      - name: Configure environment
        run: uv run itbench configure environment
      - name: Run Molecule tests
        run: |
          mise run test:molecule:faults
      - name: Destroy Kind cluster
        run: |
          mise run destroy:kind:environment
  sre-waiters:
    name: SRE Waiters Tests
    runs-on: ubuntu-26.04
    env:
      KUBECONFIG: ${{ github.workspace }}/clusters/kind/kubeconfigs/kind-environment
      MISE_ENV: kind
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.7
      - name: Install project dependencies
        run: |
          mise run install:dev
      - name: Create Kind cluster
        run: |
          mise run create:kind:environment
      - name: Configure environment
        run: uv run itbench configure environment
      - name: Run Molecule tests
        run: |
          mise run test:molecule:waiters
      - name: Destroy Kind cluster
        run: |
          mise run destroy:kind:environment
