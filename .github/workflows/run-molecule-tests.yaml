name: Run ITBench Molecule Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - clusters/minikube/**
      - scenarios/sre/project/roles/agent/**
      - scenarios/sre/project/roles/faults/**
      - scenarios/sre/project/roles/waiters/**
      - '!clusters/minikube/README.md'
      - '!scenarios/sre/project/roles/faults/tasks/generate_files.yaml'
      - '!scenarios/sre/project/roles/waiters/tasks/generate_files.yaml'

concurrency:
  group: ci-molecule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clusters-minikube:
    name: ITBench Minikube Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.11.7
      - uses: medyagh/setup-minikube@v0.0.21
        with:
          cache: false
          cni: cilium
          container-runtime: containerd
          driver: docker
          kubernetes-version: v1.35.0
          minikube-version: 1.38.1
          start: false
      - name: Install project dependencies
        run: |
          mise run install:dev
      - name: Create Minikube cluster
        run: |
          make -C clusters/minikube create-simple-cluster
      - name: Start Minikube tunnel
        run: |
          make -C clusters/minikube start-simple-tunnel &
          sleep 10
      - name: Run Molecule tests
        run: |
          make -C clusters/minikube test-molecule
      - name: Destroy Minikube cluster
        run: |
          make -C clusters/minikube destroy-simple-cluster
  sre-faults:
    name: SRE Fault Injection Tests
    runs-on: ubuntu-26.04
    env:
      KUBECONFIG: ${{ github.workspace }}/clusters/kind/kubeconfigs/kind-environment
      MISE_ENV: kind
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.11.7
      - name: Install project dependencies
        run: |
          mise run install:dev
      - name: Create Kind cluster
        run: |
          mise run create:kind:environment
      - name: Run Cloud Provider
        run: |
          mise run run:kind:provider &
          sleep 10
      - name: Configure environment
        run: uv run itbench configure environment
      - name: Run Molecule tests
        run: |
          mise run test:molecule:faults
      - name: Destroy Kind cluster
        run: |
          mise run destroy:kind:environment
  sre-waiters:
    name: SRE Waiters Tests
    runs-on: ubuntu-26.04
    env:
      KUBECONFIG: ${{ github.workspace }}/clusters/kind/kubeconfigs/kind-environment
      MISE_ENV: kind
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.11.7
      - name: Install project dependencies
        run: |
          mise run install:dev
      - name: Create Kind cluster
        run: |
          mise run create:kind:environment
      - name: Configure environment
        run: uv run itbench configure environment
      - name: Run Molecule tests
        run: |
          mise run test:molecule:waiters
      - name: Destroy Kind cluster
        run: |
          mise run destroy:kind:environment
