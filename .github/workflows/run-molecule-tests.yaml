name: Run ITBench Molecule Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - clusters/kind/**
      - clusters/minikube/**
      - scenarios/project/roles/agent/**
      - scenarios/project/roles/awx/**
      - scenarios/project/roles/faults/**
      - scenarios/project/roles/waiters/**
      - '!clusters/kind/README.md'
      - '!clusters/minikube/README.md'
      - '!scenarios/project/roles/awx/tasks/generate_files.yaml'
      - '!scenarios/project/roles/faults/tasks/generate_files.yaml'
      - '!scenarios/project/roles/waiters/tasks/generate_files.yaml'

concurrency:
  group: ci-molecule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clusters-kind:
    name: ITBench Kind Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: clusters/kind/go.mod
          cache-dependency-path: clusters/kind/go.sum
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.3
      - name: Install project dependencies
        run: |
          make deps
      - name: Create Kind cluster
        run: |
          make -C clusters/kind create-simple-cluster
      - name: Run Cloud Provider
        run: |
          make -C clusters/kind run-service-provider &
          sleep 10
      - name: Run Molecule tests
        run: |
          make -C clusters/kind test-molecule
      - name: Destroy Minikube cluster
        run: |
          make -C clusters/kind destroy-simple-cluster
  clusters-minikube:
    name: ITBench Minikube Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version-file: pyproject.toml
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.3
      - uses: medyagh/setup-minikube@v0.0.21
        with:
          cache: false
          cni: cilium
          container-runtime: containerd
          driver: docker
          kubernetes-version: v1.35.0
          minikube-version: 1.38.1
          start: false
      - name: Install project dependencies
        run: |
          make deps
      - name: Create Minikube cluster
        run: |
          make -C clusters/minikube create-simple-cluster
      - name: Start Minikube tunnel
        run: |
          make -C clusters/minikube start-simple-tunnel &
          sleep 10
      - name: Run Molecule tests
        run: |
          make -C clusters/minikube test-molecule
      - name: Destroy Minikube cluster
        run: |
          make -C clusters/minikube destroy-simple-cluster
  sre-agent:
    name: SRE Agent Access Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: clusters/kind/go.mod
          cache-dependency-path: clusters/kind/go.sum
      - name: Install project dependencies
        run: |
          make deps
      - name: Create group vars
        run: |
          make -C scenarios group-vars
      - name: Create Kind cluster
        run: |
          make -C clusters/kind create-simple-cluster
      - name: Run Molecule tests
        run: |
          make -C scenarios test-molecule-agent
      - name: Destroy Kind cluster
        run: |
          make -C clusters/kind destroy-simple-cluster
  sre-awx:
    name: SRE AWX Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: clusters/kind/go.mod
          cache-dependency-path: clusters/kind/go.sum
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.3
      - name: Install project dependencies
        run: |
          make deps
      - name: Create group vars
        run: |
          make -C scenarios group-vars
      - name: Create Kind cluster
        run: |
          make -C clusters/kind create-simple-cluster
      - name: Run Cloud Provider
        run: |
          make -C clusters/kind run-service-provider &
          sleep 10
      - name: Run Molecule tests
        run: |
          make -C scenarios test-molecule-awx
      - name: Destroy Kind cluster
        run: |
          make -C clusters/kind destroy-simple-cluster
  sre-faults:
    name: SRE Fault Injection Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: clusters/kind/go.mod
          cache-dependency-path: clusters/kind/go.sum
      - name: Install project dependencies
        run: |
          make deps
      - name: Create group vars
        run: |
          make -C scenarios group-vars
      - name: Create Kind cluster
        run: |
          make -C clusters/kind create-simple-cluster
      - name: Run Cloud Provider
        run: |
          make -C clusters/kind run-service-provider &
          sleep 10
      - name: Run Molecule tests
        run: |
          make -C scenarios test-molecule-faults
      - name: Destroy Kind cluster
        run: |
          make -C clusters/kind destroy-simple-cluster
  sre-waiters:
    name: SRE Waiters Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version-file: pyproject.toml
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: clusters/kind/go.mod
          cache-dependency-path: clusters/kind/go.sum
      - name: Install project dependencies
        run: |
          make deps
      - name: Create group vars
        run: |
          make -C scenarios group-vars
      - name: Create Kind cluster
        run: |
          make -C clusters/kind create-simple-cluster
      - name: Run Molecule tests
        run: |
          make -C scenarios test-molecule-waiters
      - name: Destroy Kind cluster
        run: |
          make -C clusters/kind destroy-simple-cluster
