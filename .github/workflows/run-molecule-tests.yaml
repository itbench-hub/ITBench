name: Run ITBench Molecule Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - project/roles/agents/**
      - project/roles/faults/**
      - project/roles/waiters/**
      - '!project/roles/faults/tasks/generate_files.yaml'
      - '!project/roles/waiters/tasks/generate_files.yaml'

concurrency:
  group: ci-molecule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    name: Agent Access Control Tests
    runs-on: ubuntu-26.04
    env:
      KUBECONFIG: ${{ github.workspace }}/clusters/kind/kubeconfigs/kind-environment
      MISE_ENV: kind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.7
      - name: Install project dependencies
        run: |
          mise run install:dev
      - name: Create Kind cluster
        run: |
          mise run create:kind:environment
      - name: Configure environment
        run: uv run itbench configure environment
      - name: Run Molecule tests
        run: |
          mise run test:molecule:agents
      - name: Destroy Kind cluster
        run: |
          mise run destroy:kind:environment
  sre-faults:
    name: SRE Fault Injection Tests (${{ matrix.group }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        group:
          - core
          - istio
          - kyverno
          - valkey
    env:
      KUBECONFIG: ${{ github.workspace }}/clusters/kind/kubeconfigs/kind-environment
      MISE_ENV: kind
    steps:
      - name: Change Host Kernel Watcher Limits
        run: |
          # Elevate values directly on the shared runner host kernel
          sudo sysctl fs.inotify.max_user_instances=1024
          sudo sysctl fs.inotify.max_user_watches=524288

          # Boost process-level descriptor capacity for the shell
          ulimit -n 65536
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.7
      - name: Install project dependencies
        run: |
          mise run install:dev
      - name: Create Kind cluster
        run: |
          mise run create:kind:environment
      - name: Run Cloud Provider
        run: |
          mise run run:kind:provider &
          sleep 10
      - name: Configure environment
        run: uv run itbench configure environment
      - name: Run Molecule tests
        run: |
          mise run test:molecule:faults:${{ matrix.group }}
      - name: Destroy Kind cluster
        run: |
          mise run destroy:kind:environment
  sre-waiters:
    name: SRE Waiters Tests
    runs-on: ubuntu-26.04
    env:
      KUBECONFIG: ${{ github.workspace }}/clusters/kind/kubeconfigs/kind-environment
      MISE_ENV: kind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.7
      - name: Install project dependencies
        run: |
          mise run install:dev
      - name: Create Kind cluster
        run: |
          mise run create:kind:environment
      - name: Configure environment
        run: uv run itbench configure environment
      - name: Run Molecule tests
        run: |
          mise run test:molecule:waiters
      - name: Destroy Kind cluster
        run: |
          mise run destroy:kind:environment
