name: Run ITBench Unit Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - pyproject.toml

concurrency:
  group: ci-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  itbench-cli:
    name: ITBench CLI Unit Tests
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.11.7
      - name: Test
        run: mise run test:unit
