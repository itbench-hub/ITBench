name: Run ITBench Unit Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/**
      - tests/unit/**
      - templates/library/specs/**
      - scenarios/sre/scripts/**
      - scenarios/sre/tools/kubernetes-topology-monitor-recorder/**
      - components/recorders/**

concurrency:
  group: ci-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Scripts Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
      - name: Install project dependencies
        run: |
          make deps
      - name: Run unit tests
        run: |
          make test-scripts

  kubernetes-topology-monitor-recorder:
    name: Kubernetes Topology Monitor Recorder Unit Tests
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scenarios/sre/tools/kubernetes-topology-monitor-recorder/pyproject.toml
      - name: Test
        run: uv run python -m unittest discover -s . -p 'test_*.py'
        working-directory: scenarios/sre/tools/kubernetes-topology-monitor-recorder
