name: Build and push SRE tool images

on:
  push:
    branches:
      - main
    paths:
      - scenarios/sre/tools/**
      - '!scenarios/sre/tools/kubernetes-topology-monitor/charts/kubernetes-topology-monitor/**'

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  awx-ee:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Checkout codebase
        uses: actions/checkout@v7.0.1
      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
      - name: Install project dependencies
        run: |
          make deps
      - name: Create AWX Execution Environment image context
        run: |
          uv run ansible-builder create --output-filename Dockerfile
        working-directory: scenarios/sre/tools/awx-ee
      - name: Copy requirements to expected location
        run: |
          cp _build/requirements.yml requirements.yml
          cp _build/requirements.txt requirements.txt
        working-directory: scenarios/sre/tools/awx-ee/context
      - name: Build AWX Execution Environment image
        id: build
        uses: docker/build-push-action@v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: scenarios/sre/tools/awx-ee/context
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=quay.io/it-bench/awx-ee,push-by-digest=true,push=true
      - name: Export digest
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: awx-ee-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  awx-ee-merge:
    runs-on: ubuntu-24.04
    needs:
      - awx-ee
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: awx-ee-digests-*
          merge-multiple: true
      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t quay.io/it-bench/awx-ee:2.0.0 \
            -t quay.io/it-bench/awx-ee:latest \
            $(printf 'quay.io/it-bench/awx-ee@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect quay.io/it-bench/awx-ee:latest

  hello-bench-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7.0.1
      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build Hello Bench image
        uses: docker/build-push-action@v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: scenarios/sre/tools/hello-bench
          platforms: |
            linux/amd64
          push: true
          tags: |
            quay.io/it-bench/hello-bench-amd64:2.0.0
            quay.io/it-bench/hello-bench-amd64:latest

  hello-bench-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7.0.1
      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build Hello Bench image
        uses: docker/build-push-action@v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: scenarios/sre/tools/hello-bench
          platforms: |
            linux/arm64
          push: true
          tags: |
            quay.io/it-bench/hello-bench-arm64:2.0.0
            quay.io/it-bench/hello-bench-arm64:latest

  opentelemetry-collector:
    uses: ./.github/workflows/_build-image.yaml
    with:
      context: scenarios/sre/tools/opentelemetry-collector-builder
      image: quay.io/it-bench/opentelemetry-collector
      tags: |
        quay.io/it-bench/opentelemetry-collector:2.0.0
        quay.io/it-bench/opentelemetry-collector:latest
      push: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}

  clickhouse-recorder:
    uses: ./.github/workflows/_build-image.yaml
    with:
      context: scenarios/sre/tools/clickhouse-recorder
      image: quay.io/it-bench/clickhouse-recorder
      tags: |
        quay.io/it-bench/clickhouse-recorder:1.0.0
        quay.io/it-bench/clickhouse-recorder:latest
      push: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}

  jaeger-recorder:
    uses: ./.github/workflows/_build-image.yaml
    with:
      context: scenarios/sre/tools/jaeger-recorder
      image: quay.io/it-bench/jaeger-recorder
      tags: |
        quay.io/it-bench/jaeger-recorder:1.0.0
        quay.io/it-bench/jaeger-recorder:latest
      push: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}

  kubernetes-topology-monitor-recorder:
    uses: ./.github/workflows/_build-image.yaml
    with:
      context: scenarios/sre/tools/kubernetes-topology-monitor-recorder
      image: quay.io/it-bench/kubernetes-topology-monitor-recorder
      tags: |
        quay.io/it-bench/kubernetes-topology-monitor-recorder:1.0.0
        quay.io/it-bench/kubernetes-topology-monitor-recorder:latest
      push: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}

  prometheus-recorder:
    uses: ./.github/workflows/_build-image.yaml
    with:
      context: scenarios/sre/tools/prometheus-recorder
      image: quay.io/it-bench/prometheus-recorder
      tags: |
        quay.io/it-bench/prometheus-recorder:1.0.0
        quay.io/it-bench/prometheus-recorder:latest
      push: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}

  topology-monitor:
    uses: ./.github/workflows/_build-image.yaml
    with:
      context: scenarios/sre/tools/kubernetes-topology-monitor
      image: quay.io/it-bench/topology-monitor
      tags: |
        quay.io/it-bench/topology-monitor:0.0.4
        quay.io/it-bench/topology-monitor:latest
      push: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
