name: Perform SRE tool images build tests

on:
  pull_request:
    branches:
      - main
    paths:
      - scenarios/sre/tools/**
      - '!scenarios/sre/tools/kubernetes-topology-monitor/charts/kubernetes-topology-monitor/**'

concurrency:
  group: ci-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hello-bench-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build Hello Bench image
        uses: docker/build-push-action@v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: scenarios/sre/tools/hello-bench
          platforms: |
            linux/amd64
          push: false
          tags: |
            quay.io/it-bench/hello-bench-amd64:2.0.0
            quay.io/it-bench/hello-bench-amd64:latest

  hello-bench-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build Hello Bench image
        uses: docker/build-push-action@v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: scenarios/sre/tools/hello-bench
          platforms: |
            linux/arm64
          push: false
          tags: |
            quay.io/it-bench/hello-bench-arm64:2.0.0
            quay.io/it-bench/hello-bench-arm64:latest

  opentelemetry-collector:
    uses: ./.github/workflows/_build-image.yaml
    with:
      context: scenarios/sre/tools/opentelemetry-collector-builder
      image: quay.io/it-bench/opentelemetry-collector
      tags: |
        quay.io/it-bench/opentelemetry-collector:2.0.0
        quay.io/it-bench/opentelemetry-collector:latest
      push: false

  clickhouse-recorder:
    uses: ./.github/workflows/_build-image.yaml
    with:
      context: scenarios/sre/tools/clickhouse-recorder
      image: quay.io/it-bench/clickhouse-recorder
      tags: |
        quay.io/it-bench/clickhouse-recorder:1.0.0
        quay.io/it-bench/clickhouse-recorder:latest
      push: false

  jaeger-recorder:
    uses: ./.github/workflows/_build-image.yaml
    with:
      context: scenarios/sre/tools/jaeger-recorder
      image: quay.io/it-bench/jaeger-recorder
      tags: |
        quay.io/it-bench/jaeger-recorder:1.0.0
        quay.io/it-bench/jaeger-recorder:latest
      push: false

  kubernetes-topology-monitor-recorder:
    uses: ./.github/workflows/_build-image.yaml
    with:
      context: scenarios/sre/tools/kubernetes-topology-monitor-recorder
      image: quay.io/it-bench/kubernetes-topology-monitor-recorder
      tags: |
        quay.io/it-bench/kubernetes-topology-monitor-recorder:1.0.0
        quay.io/it-bench/kubernetes-topology-monitor-recorder:latest
      push: false

  prometheus-recorder:
    uses: ./.github/workflows/_build-image.yaml
    with:
      context: scenarios/sre/tools/prometheus-recorder
      image: quay.io/it-bench/prometheus-recorder
      tags: |
        quay.io/it-bench/prometheus-recorder:1.0.0
        quay.io/it-bench/prometheus-recorder:latest
      push: false

  topology-monitor:
    uses: ./.github/workflows/_build-image.yaml
    with:
      context: scenarios/sre/tools/kubernetes-topology-monitor
      image: quay.io/it-bench/topology-monitor
      tags: |
        quay.io/it-bench/topology-monitor:0.0.4
        quay.io/it-bench/topology-monitor:latest
      push: false
